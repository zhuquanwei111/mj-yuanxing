/* ============================================================
   明镜 · 设计令牌（公会端骨架按界面规矩10条：左导航+64px顶栏+浅灰内容区）
   ============================================================ */
:root{
  --brand:#6e6e6e;  --brand-ink:#595959;  --brand2:#6a6a6a;  --brand-soft:#f1f1f1;
  --ok:#7c7c7c;     --ok-soft:#f6f6f6;   --ok-line:#e8e8e8;
  --warn:#7a7a7a;   --warn-soft:#f7f7f7; --warn-line:#e1e1e1;
  --danger:#6e6e6e; --danger-soft:#f3f3f3; --danger-line:#dbdbdb;
  --ink:#1a1a1a;    --ink2:#616161;      --ink3:#9b9b9b;
  --line:#e9e9e9;   --line2:#f2f2f2;
  --card:#ffffff;   --bg:#f6f6f6;
  --sh1:0 1px 2px rgba(25, 25, 25,.04), 0 2px 8px rgba(25, 25, 25,.05);
  --sh2:0 1px 2px rgba(25, 25, 25,.05), 0 8px 26px rgba(25, 25, 25,.08);
}
/* ============================================================
   Ops Design System v8 · 视觉基座（P4）
   所有颜色/字号/间距/圆角/阴影只引用 token，页面内不写死值

   【冻结层纪律 · P4-3】自本层起冻结，不再新增 !important。
   - 遗留的 !important 属历史覆层，随 P7-2 CSS 覆层清理逐批拆除；
     清理前不得删除 1849-1851 灰度承重层（红队 R4 死令）。
   - 新页面一律走 token + 语义类，禁止用 !important 抢权重。
   ============================================================ */
:root{
  /* 中性色 */
  --canvas:#FFFFFF; --surface:#FFFFFF; --surface-subtle:#F7F7F8;
  --line-divider:#E4E4E7; --line-strong:#D4D4D8;
  --ink-900:#161616; --ink-700:#3F3F46; --ink-500:#595959; --ink-300:#A1A1AA;
  /* 品牌色（预览转正） */
  --brand-v8:#70517C; --brand-strong:#60446B; --brand-soft-v8:#F4F1F6;
  --brand-line:#D8CCE0; --brand-ink-v8:#4A3455; --brand-muted-v8:#806A89;
  /* 语义色 */
  --status-danger:#A33D3D; --status-danger-soft:#FBF1F1;
  --status-warning:#806216; --status-warning-soft:#FAF5E8;
  --status-success:#2F765F; --status-success-soft:#F0F6F4;
  --status-info:#426579;
  /* 字阶（6 档，tabular-nums） */
  --font-display:30px/36px; --font-title:19px/26px; --font-heading:16px/24px;
  --font-body:14px/22px; --font-secondary:13px/20px; --font-meta:12px/18px; --font-micro:11px/16px;
  /* 字重（4 档） */
  --font-regular:400; --font-medium:500; --font-semibold:600; --font-bold:700;
  /* 间距（4pt） */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px;
  /* 圆角（4 档） */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-full:999px;
  /* 阴影（3 档） */
  --shadow-none:none; --shadow-1:0 1px 2px rgba(22,22,22,.04);
  --shadow-2:0 8px 24px rgba(22,22,22,.08); --shadow-3:0 16px 48px rgba(22,22,22,.12);
  /* 动效（3 档） */
  --motion-fast:160ms; --motion-normal:200ms; --motion-slow:240ms;
  --ease-standard:cubic-bezier(.2,0,.1,1); --ease-exit:cubic-bezier(.4,0,1,1);
}
/* 数字统一 tabular-nums */

body{

}

.screen{background:var(--bg)}
/* 卡片：白底、细线或无线、无阴影，分区靠留白 */
.card{border:1px solid var(--line);box-shadow:none;border-radius:14px;padding:16px}
.mhead{background:#fff;border-bottom:1px solid var(--line);box-shadow:none}
.mtabs{background:#fff;border-top:1px solid var(--line)}
.tcard{border-radius:14px}
/* 渐变、彩色图标砖、彩色标签底——全删 */
.card.hero{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.card.hero .ct{color:var(--ink)}
.card.hero .ct .m{color:var(--ink3)}
.hero .taskrow .tn{color:var(--ink);font-weight:620}
.hero .taskrow .pb{background:var(--line2)}
.hero .taskrow .pb i{background:#181818}
.hero .taskrow .tv{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.hero .taskrow .tg{color:var(--ink3)}
.hero .snums .v{color:var(--ink)}
.hero .snums .l{color:var(--ink3)}
.hero .rec-lines div{color:var(--ink)}
.kico{display:none!important}
.catc{background:transparent!important;color:var(--ink3)!important;padding-left:0;font-weight:620}
.tcard.sumcard{border:1px solid var(--line);background:#fff}
.taskrow .pb i{background:#181818}
.tcard .aicard{background:#fafafa;border-color:var(--line)}
/* 排印：大数字自己会说话 */
.kpi .v,.snums .v{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink2)}
.kpi .l,.snums .l{font-size:12px;color:#a2a2a2}
.ph-t{font-size:17px;font-weight:600;color:#181818}
.ph-w{color:#a2a2a2}
.ph-d{color:#a2a2a2}
.mhead .mt{font-size:16px;font-weight:640;color:#181818}
.mhead .mrole{background:#f4f4f4;color:#727272}
/* 状态三档：降饱和 */
.alertrow{background:var(--tint-red);border:0;border-left:3px solid #5e5e5e;border-radius:0 11px 11px 0}
.adot{background:#5e5e5e;box-shadow:none}
.mrow.riskrow{background:var(--tint-red);border:0;border-left:3px solid #5e5e5e;border-radius:0 11px 11px 0}
.mrow.warnrow{background:#fff;border:0;border-left:3px solid #adadad;border-radius:0 11px 11px 0}
.badge{font-weight:600}
.badge.ok{background:#fbfbfb;color:#585858}
.badge.dg,.badge.warn{background:#f5f5f5;color:#5e5e5e}
.badge.b{background:#f4f4f4;color:#181818}
.badge.line{background:#fafafa;color:#a2a2a2}
.kpi .d.up{background:transparent;color:#585858}
.kpi .d.down{background:transparent;color:#5e5e5e}
/* 图标：单色细线 */
.tico{background:transparent!important;color:var(--ink3)!important}
/* Tab/导航：极简 */
.mtabs button.on{color:var(--ink);font-weight:650}
.ptab.on{color:var(--ink);font-weight:650}
.ptab.on::after{background:#181818;height:2px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ckpill{background:var(--line2);color:var(--ink)}
.ckpill.all{background:var(--tint-green);color:#585858}
.ckc.on{background:var(--tint-green);border-color:#e4e4e4;color:#585858}
.mlogo{background:#181818}
/* P00：Linear 项目列表质感 */
.p00brand .mlogo{background:#181818;color:#fff;display:flex;align-items:center;justify-content:center}
.rcard{border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:12px;box-shadow:none}
.rcard:hover{border-color:#e7e7e7;box-shadow:none}
.rcard .av{background:#f4f4f4!important;color:#181818;font-weight:600}
.rcard .rn{font-size:15px;font-weight:620;color:#181818}
.rcard .ro{font-size:12.5px;color:#a2a2a2;margin-top:3px}
.rcard .arr{color:#d5d5d5}
.p00hint{color:#a2a2a2}
.p00foot{color:#d5d5d5}
/* ===== ④画活：转场与微动效（150-250ms 克制线） ===== */
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mbody.pagein{animation:pagein .18s ease-out}
/* 点按反馈：按下去的手感 */
.btn{transition:transform .12s ease,filter .12s ease,background .15s ease,color .15s ease}
.btn:active{transform:scale(.97);filter:brightness(.93)}
.mrow,.rcard,.fchip,.kpi.link{transition:transform .12s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease}
.mrow:active,.rcard:active,.fchip:active{transform:scale(.985)}
/* Tab 选中态平滑过渡 */
.mtabs button,.ttab,.ptab,.fchip{transition:color .15s ease,background .15s ease,border-color .15s ease}
.ptab::after{opacity:0;transition:opacity .15s ease}
.ptab.on::after{opacity:1}
/* 状态变化微过渡 */
.ckpill{transition:background .18s ease,color .18s ease}
.ckc{transition:background .15s ease,border-color .15s ease,color .15s ease}
.badge{transition:background .15s ease,color .15s ease}
/* toast 可点（去开通向导按钮） */
#toast.show{pointer-events:auto}
/* 三档分明：红=立即处理 / 黄条=要跟进 / 白=正常 */
.mrow.warnrow{border-left:3px solid #c3c3c3}



.mrow.riskrow{background:var(--tint-red);border-color:#e1e1e1}
.tcard.sumcard{border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad-brand) border-box}
/* P00 角色选择 */
.p00v2{padding:4px 2px 2px}
.p00brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.p00hint{font-size:12px;color:var(--ink3);margin-bottom:10px}
.rcard{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:.15s}
.rcard:hover{box-shadow:var(--sh2);border-color:#cfcfcf}
.rcard.soon{opacity:.5}
.rcard .rn{font-size:13.5px;font-weight:660}
.rcard .ro{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}
.rcard .arr{margin-left:auto;color:var(--ink3);font-size:16px;flex:0 0 auto}
.p00foot{margin-top:12px;font-size:12px;color:var(--ink3);line-height:1.6}/* ---------- 三行小字页头（全局规矩1） ---------- */
.ph{margin-bottom:14px}
.ph-t{font-size:16.5px;font-weight:700;line-height:1.3}
.ph-w{font-size:12px;color:var(--ink3);margin-top:4px}
.ph-d{font-size:12px;color:var(--ink3);margin-top:2px}
/* ---------- 通用卡片 / 按钮 / 徽章 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card .ct{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card .ct .m{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400}
.btn{font-family:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:5px 12px;height:28px;
  cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn.p{background:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand-ink)}
.btn.g{background:#fff;color:var(--brand);border-color:#cfcfcf}
.btn.g:hover{background:var(--brand-soft)}
.btn.q{background:var(--line2);color:var(--ink2);border:0}
.btn.q:hover{background:#eaeaea}
.btn.d{background:#fff;color:var(--danger);border-color:#cdcdcd}
.btn.d:hover{background:var(--danger-soft)}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.dg{background:var(--danger-soft);color:var(--danger)}
.badge.b{background:var(--brand-soft);color:var(--brand-ink)}
.badge.line{background:#fff;color:var(--ink3);border:1px solid var(--line)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#181818;margin-right:5px;
  vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.tagchip{display:inline-block;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);
  border-radius:5px;padding:2px 7px;letter-spacing:.4px;white-space:nowrap}
.rlv{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1.5px 6px;margin-right:6px;white-space:nowrap}
.rlv.danger{background:var(--danger-soft);color:var(--danger)}
.rlv.warn{background:var(--warn-soft);color:var(--warn)}
/* ---------- AI 两容器（界面规矩8）：🤖浅色只读 / ✍️左草稿右拍板 ---------- */
.aicard{background:#f9f9f9;border:1px solid #e7e7e7;border-radius:10px;padding:12px 14px}
.aicard .aih{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;margin-bottom:8px}
.aicard .aih .m{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400;cursor:pointer}
.aib{font-size:12.5px;color:var(--ink2);line-height:1.7;display:flex;gap:8px}
.aib i{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:7px}
.aib i.ok{background:var(--ok)} .aib i.warn{background:#adadad}
.ailine{margin-top:10px;padding-top:9px;border-top:1px dashed #e0e0e0;font-size:12px;color:var(--ink3);line-height:1.65}
.ailine b{color:var(--ink2);font-weight:620}
.draftbox{border:1px solid #e7e7e7;background:#f9f9f9;border-radius:10px;display:grid;grid-template-columns:1fr 138px;overflow:hidden}
.draftbox .dl{padding:12px 14px;min-width:0}
.draftbox .dr{border-left:1px dashed #e0e0e0;padding:12px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.draftbox .dr .btn{width:100%}
.dtext{font-size:12.5px;color:var(--ink2);line-height:1.7;background:#fff;border:1px solid var(--line2);
  border-radius:8px;padding:9px 11px;margin-top:8px}
/* ---------- 指标卡（每张≤4个数） ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpis.four{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.kpi .v{font-size:19px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v.small{font-size:14px;font-weight:650}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:3px}
.kpi .d{font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--danger)} .flat{color:var(--ink3)} .warnv{color:var(--warn)}
.tglabel{font-size:12px;color:var(--ink3);font-weight:650;letter-spacing:.5px;margin:2px 0 7px}
/* ---------- 待办流（工作台信息序第一） ---------- */
.ttabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ttab{padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;font-weight:600}
.ttab.on{color:var(--brand-ink);border-color:var(--brand)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.tcard.wide{grid-column:1 / -1}
.tcard .th{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tcard .th .src{font-size:12px;color:var(--ink3)}
.tcard .tt{font-size:13px;font-weight:650;line-height:1.45}
.tcard .tsub{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:4px}
.tcard .tact{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.doneitem{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2);font-size:12.5px}
.doneitem:last-child{border-bottom:0}
.doneitem .dw{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}
.doneitem .dt{color:var(--ink2)}
/* ---------- 表格（数字右对齐） ---------- */

table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th{font-size:12px;color:var(--ink3);text-align:left;font-weight:650;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:transparent}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr.rowclick{cursor:pointer}
.tb tr.rowclick:hover td{background:#fbfbfb}
.tb td.n,.tb th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .pname{font-weight:640;white-space:nowrap}
.tb .ptrack{font-size:12px;color:var(--ink3);margin-left:6px}
.tb .riskcell{font-size:12px;color:var(--ink2);line-height:1.5;min-width:200px}
/* ---------- 图表（纯CSS柱状） ---------- */
.chart{display:flex;align-items:flex-end;gap:5px;height:118px;padding-top:4px}
.cbar{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.cbar i{display:block;background:linear-gradient(180deg,#a8a8a8,var(--brand));border-radius:3px 3px 0 0;min-height:3px}
.cbar.zero i{background:var(--line2)}
.cbar span{font-size:12px;color:var(--ink3);text-align:center;margin-top:5px;white-space:nowrap}
/* ---------- P21 主播卡片 ---------- */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.fchip{padding:5px 13px;border-radius:16px;border:1px solid var(--line);background:#fff;
  font-size:12px;cursor:pointer;color:var(--ink2);font-family:inherit;font-weight:600}
.fchip.on{background:var(--brand-soft);border-color:#cfcfcf;color:var(--brand-ink)}
.fchip .cnt{font-weight:400;font-size:12px;color:var(--ink3);margin-left:3px}
.bar select{font-family:inherit;font-size:16px;min-height:44px;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;cursor:pointer}
.bar .cnt2{margin-left:auto;font-size:12px;color:var(--ink3)}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.14s}
.scard:hover{box-shadow:var(--sh2);border-color:#cfcfcf;transform:translateY(-1px)}
.scard .shead{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;font-weight:650;letter-spacing:.5px}
.av.k-sing{background:linear-gradient(135deg,#6e6e6e,#6a6a6a)}
.av.k-talk{background:linear-gradient(135deg,#6a6a6a,#757575)}
.av.k-dance{background:linear-gradient(135deg,#7c7c7c,#9d9d9d)}
.av.k-game{background:linear-gradient(135deg,#888888,#b2b2b2)}
.scard .snm{font-size:13.5px;font-weight:660}
.scard .strack{font-size:12px;color:var(--ink3);margin-top:2px}
.scard .shead .badge{margin-left:auto}
.snums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px;padding:9px 0;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.snums .n .v{font-size:13.5px;font-weight:660;font-variant-numeric:tabular-nums;white-space:nowrap}
.snums .n .l{font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap}
.mbody .snums .n .l{white-space:normal;overflow-wrap:anywhere}
.snums .n .v.up{color:var(--ok)} .snums .n .v.down{color:var(--danger)} .snums .n .v.warnv{color:var(--warn)}
.spark{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:10px}
.spark i{flex:1 1 0;background:linear-gradient(180deg,#bbbbbb,var(--brand));border-radius:2px 2px 0 0;min-height:2px}
.spark i.zero{background:var(--line2)}
.spark .slabel{font-size:12px;color:var(--ink3);margin-left:6px;white-space:nowrap;align-self:flex-end;padding-bottom:1px}
.riskline{margin-top:9px;font-size:12px;line-height:1.55;border-radius:8px;padding:7px 9px}
.riskline.danger{background:var(--danger-soft);color:var(--danger)}
.riskline.warn{background:var(--warn-soft);color:var(--warn)}
.riskline b{font-weight:700}
.sact{display:flex;gap:7px;margin-top:11px}
/* ---------- P22 详情页 ---------- */
.banner{border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:13px;
  font-size:12.5px;line-height:1.55;flex-wrap:wrap}
.banner.danger{background:var(--danger-soft);border:1px solid var(--danger-line)}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn-line)}
.banner .btx{flex:1 1 auto;min-width:220px;color:var(--ink2)}
.banner .btx b{color:var(--ink)}
.prow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prow .av{width:46px;height:46px;font-size:14px}
.prow .pm1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow .pm2{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.6}
.prow .pact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:2px 0 15px;flex-wrap:wrap}
.ptab{padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;font-weight:600}
.ptab.on{color:var(--brand-ink);border-color:var(--brand)}
.rec{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
.rec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-d{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.rec-t{font-size:13px;font-weight:640}
.rec-goal{font-size:12px;color:var(--ink3);margin-top:4px}
.rec-lines{margin-top:8px}
.rec-lines div{font-size:12.5px;color:var(--ink2);line-height:1.75;padding-left:13px;position:relative}
.rec-lines div::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:#cfcfcf}
.rec .ract{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.rec .rexp{font-size:12px;color:var(--brand-ink);cursor:pointer;font-weight:600}
.handoff-overview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.handoff-overview-title{font-size:14px;font-weight:700;line-height:1.4;color:var(--ink)}
.handoff-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.handoff-stat{min-width:0;padding:10px 8px;border:1px solid var(--line2);border-radius:11px;background:#fafafa}
.handoff-stat strong{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.handoff-stat span{display:block;margin-top:4px;font-size:12px;line-height:1.35;color:var(--ink2);white-space:normal}
.handoff-group{margin-top:16px}
.handoff-group .secthead{margin:0 0 8px}
.handoff-list{display:grid;gap:10px;margin-bottom:16px}
.handoff-card{min-width:0;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.handoff-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.handoff-card-date{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.handoff-card-title{margin-top:10px;font-size:15px;line-height:1.45;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.handoff-card-route{margin-top:4px;font-size:13px;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.handoff-card-note{margin-top:10px;font-size:14px;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}
.handoff-card-owner{margin-top:8px;font-size:12px;line-height:1.45;color:var(--ink2)}
.handoff-card-owner strong{color:var(--ink);font-weight:650}
.handoff-card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.handoff-card-actions .btn{min-height:44px}
@media(max-width:360px){.handoff-overview{padding:12px}.handoff-stats{gap:6px}.handoff-stat{padding:9px 6px}.handoff-card{padding:12px}}
.rec-snap{font-size:12px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.notegrey{font-size:12px;color:var(--ink3);margin-top:10px;display:flex;align-items:center;gap:6px}
/* ---------- P23/P24 草稿行与清单 ---------- */
.prow-line{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}
.prow-line:last-child{border-bottom:0}

  font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;padding:6px 4px;line-height:1.25;text-align:center}
.segview button .n{font-size:12px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.segview button[aria-selected="true"]{background:var(--ink);color:#fff}
.segview button[aria-selected="true"] .n{color:rgba(255, 255, 255,.75)}
/* 区块标题：主次靠顺序与字号，不靠同款卡片 */
.secthead{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px;flex-wrap:wrap}
.secthead.first{margin-top:0}
.secthead h2{font-size:16px;font-weight:650;color:var(--ink);line-height:1.4}
.secthead .sct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.secthead .go{margin-left:auto;flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;border:0;
  background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:0 2px}
.secthead .go::after{content:"›";margin-left:4px;color:var(--ink3)}
/* 焦点记录：本页当前最该处理的一项，唯一视觉锚 */
.focusrec{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:16px}
.focusrec.danger{border-left-color:var(--danger)}
.focusrec.warn{border-left-color:var(--warn-rail)}
.focusrec.ok{border-left-color:var(--ok)}
.focusrec .frh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-bottom:8px}
.focusrec .frt{font-size:16px;font-weight:650;line-height:1.5;color:var(--ink)}
.focusrec .frs{font-size:14px;color:var(--ink2);line-height:1.65;margin-top:6px}
.focusrec .frb{margin-top:12px}
.focusrec .fract{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.focusrec .fract .btn{flex:1 1 130px}
.todo-owner{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink2)}
.todo-owner strong{color:var(--ink);font-weight:650}
/* 队列行：对象 + 原因/时限 + 状态 + 一个动作 */
.qlist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.qrow{display:flex;gap:10px;align-items:center;min-height:56px;padding:12px 14px;
  border-bottom:1px solid var(--line2);border-left:3px solid transparent;background:#fff}
.qrow:last-child{border-bottom:0}
.qrow.danger{border-left-color:var(--danger)}
.qrow.warn{border-left-color:var(--warn-rail)}
.qrow.ok{border-left-color:var(--ok)}
.qrow .qb{flex:1 1 auto;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;
  gap:3px;border:0;background:none;font:inherit;text-align:left;color:var(--ink);cursor:pointer;padding:0}
.qrow .qb:active{opacity:.65}
.qrow .qt{font-size:14px;font-weight:600;line-height:1.45;color:var(--ink)}
.qrow .qs{font-size:12px;color:var(--ink3);line-height:1.5}
.qrow .qr{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;
  color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
.qrow .arr{color:var(--ink3);font-size:16px;line-height:1;flex:0 0 auto}
.qrow .qact{flex:0 0 auto;min-height:44px}
.qrow.done .qt{color:var(--ink3);text-decoration:line-through}
/* 概况条：可下钻的数字条，不是四张同权大卡 */
.metricbar{display:flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.metricbar button{flex:1 1 0;min-width:78px;min-height:56px;border:0;background:none;font:inherit;text-align:left;
  padding:10px 12px;border-radius:10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.metricbar button[onclick]{cursor:pointer}
.metricbar button[onclick]:active{background:var(--line2)}
.metricbar .mv{font-size:19px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2}
.metricbar .mv small{font-size:12px;font-weight:600;margin-left:1px}
.metricbar .ml{font-size:12px;color:var(--ink3);line-height:1.35}
/* 排行/宽数据记录：原表每行转成纵向「标签/值」，无横向滚动 */
.ranklist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.rankrow{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line2)}
.rankrow:last-child{border-bottom:0}
.rankrow .rk{flex:0 0 22px;font-size:15px;font-weight:650;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:1.4}
.rankrow.top .rk{color:var(--ink)}
.rankrow .rb{flex:1 1 auto;min-width:0}
.rankrow .rn2{font-size:15px;font-weight:650;color:var(--ink);line-height:1.4}
.rankrow .fields{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px}
.rankrow .fields>div{flex:1 1 92px;min-width:0}
.rankrow .fields .fk{font-size:12px;color:var(--ink3);line-height:1.4}
.rankrow .fields .fv{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.4;margin-top:1px}
/* 关键值横排：对象头与分组内的可读数字 */
.kvrow{display:flex;flex-wrap:wrap;gap:12px 20px}
.kvrow>div{min-width:0;flex:1 1 76px}
.kvrow .fk{font-size:12px;color:var(--ink3);line-height:1.4}
.kvrow .fv{font-size:17px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3;margin-top:1px}
/* 字段清单：长字段纵向标签/值 */
.fieldlist{display:flex;flex-direction:column;gap:10px}
.fieldlist .frow{display:flex;flex-direction:column;gap:2px;min-width:0}
.fieldlist .fk{font-size:12px;color:var(--ink3)}
.fieldlist .fv{font-size:14px;color:var(--ink);line-height:1.65}
/* 就近分组：相关字段收在一起，避免卡片套卡片 */
.groupbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.groupbox>.gh{font-size:16px;font-weight:650;margin-bottom:12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.groupbox>.gh .m{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400}
.mbody .ckc{min-height:44px}
/* 分析块：命名分区替代原生折叠，卡片不再套卡片 */
.groupbox .card{border:0;padding:0;margin-bottom:0;border-radius:0}
.groupbox .card+.card{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
/* 更多操作：主动作之外的次要动作走手机内底部面板 */
.mask.sheetmask{align-items:flex-end;padding:0}
.modal.sheet{border-radius:18px 18px 0 0;padding:6px 12px calc(14px + env(safe-area-inset-bottom));max-height:82%}
.modal.sheet .modal-close{top:6px;right:6px;width:44px;height:44px;background:transparent;font-size:22px}
.modal.sheet .mh{font-size:16px;padding:10px 44px 2px 2px}
.modal.sheet .ms{padding:0 2px 6px}
.modal.sheet button.shrow{display:block;width:100%;min-height:48px;border:0;border-top:1px solid var(--line2);
  background:#fff;font:inherit;font-size:15px;font-weight:550;color:var(--ink);text-align:left;padding:0 2px;cursor:pointer}
.modal.sheet button.shrow:active{background:var(--line2)}
.modal.sheet button.shrow.d{color:var(--danger)}
.modal.sheet button.shcancel{margin-top:10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:600}
/* 顶部锚点：数据时间范围与对象上下文保持一致 */
.ctxtline{font-size:12px;color:var(--ink3);line-height:1.6;margin:-4px 0 12px}
/* 表格若保留也只读纵向；不再依赖横向滚动 */
.mbody .tbwrap{overflow-x:visible}
.mbody .tb{min-width:0;width:100%}
.tb th,.tb td,.tb .pname,.tb td.n,.tb th.n{white-space:normal}
/* 同级视图页签：手机内换行，不横滑 */
.mbody .ptabs{display:flex;flex-wrap:wrap;overflow:visible;gap:2px}
.mbody .ptab{white-space:normal;flex:1 1 0;min-width:0;text-align:center;padding:10px 4px;font-size:14px;line-height:1.3}
/* 状态文字对比度：待跟进文字用深琥珀，色条才用亮琥珀 */
.riskline.warn,.badge.warn{color:var(--warn-ink)}
.taskrow .tg{color:var(--warn-ink)}
.rlv.warn{color:var(--warn-ink)}
/* V3 FOUNDATION: mobile operations signal board */
:root{
  --brand:#636363; --brand-ink:#4e4e4e; --brand2:#636363; --brand-soft:#f0f0f0;
  --ok:#5e5e5e; --ok-soft:#f1f1f1; --ok-line:#dddddd;
  --warn:#646464; --warn-ink:#565656; --warn-soft:#f6f6f6; --warn-line:#d8d8d8; --warn-rail:#ababab;
  --danger:#656565; --danger-soft:#f1f1f1; --danger-line:#d5d5d5;
  --ink:#222222; --ink2:#606060; --ink3:#6f6f6f;
  --line:#e2e2e2; --line2:#eeeeee; --line-strong:#d1d1d1;
  --card:#ffffff; --bg:#f5f5f5;
  --sh1:0 1px 2px rgba(32, 32, 32,.04); --sh2:0 10px 28px rgba(32, 32, 32,.12);
  --grad-brand:none; --grad-ok:none; --grad-warn:none;
}
html{font-size:16px;text-size-adjust:100%;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;font-synthesis:none}
.prototype-shell{gap:20px;padding:20px;background:var(--bg)}
.prototype-shell .pstage{align-items:flex-start}
.phone{width:min(392px,100%);border:1px solid var(--line);border-radius:34px;background:#fff;padding:8px;box-shadow:0 12px 34px rgba(34, 34, 34,.12)}
.screen{border-radius:27px;background:var(--bg);min-width:0;min-height:0}
.mhead{min-height:62px;padding:8px 14px;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
.mhead .mlogo{width:30px;height:30px;border-radius:9px;background:var(--ink);font-size:13px}
.mhead .mt{min-width:0;font-size:17px;font-weight:680;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.mhead .mrole{font-size:13px;color:var(--ink2);background:var(--bg);border-radius:999px;padding:5px 9px}
.mback{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:12px;color:var(--ink);border-color:var(--line);font-size:20px}
.mbody{padding:18px 16px 24px;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:#cfcfcf transparent}
.mbody .ph-t{font-size:16px;line-height:1.45}
.card,.groupbox{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:none}
.card{padding:16px;margin-bottom:14px}
.card .ct{font-size:16px;line-height:1.45;font-weight:680}
.groupbox{padding:16px;margin-bottom:14px}
.groupbox>.gh{font-size:16px;line-height:1.45;font-weight:680}
.secthead{margin:22px 0 10px;align-items:center}
.secthead h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.secthead .sct,.groupbox>.gh .m,.metricbar .ml,.qrow .qs,.rankrow .fields .fk,.kvrow .fk,
.fieldlist .fk,.tsub,.notegrey,.ctxtline,.dchip,.ft,.scopechip,.syscard .stm,.sct,.badge,.fld label,
.fval,.psub,.ph-v{font-size:13px;line-height:1.5;color:var(--ink2)}
.qrow .qt,.rankrow .rn2{font-size:15px;line-height:1.45;font-weight:650}
.qrow{gap:12px;min-height:64px;padding:12px 14px;border-color:var(--line2)}
.qlist,.ranklist{border-color:var(--line);border-radius:13px;box-shadow:none}
.focusrec{padding:16px;border-radius:13px;border-color:var(--line);border-left-width:4px;margin-bottom:14px}
.focusrec .frh{font-size:13px;color:var(--ink2)}
.focusrec .frt{font-size:17px;line-height:1.45;font-weight:700}
.focusrec .frs{font-size:15px;line-height:1.55;color:var(--ink2)}
.metricbar{border-color:var(--line);border-radius:13px;padding:4px;margin-bottom:14px}
.metricbar button{min-width:0;min-height:62px;padding:9px 10px}
.metricbar .mv{font-size:21px;font-weight:700;line-height:1.2}
.metricbar .ml{font-size:13px}
.kpi .v{font-size:26px;line-height:1.2;font-weight:700}
.kpi .l,.snums .l{font-size:13px;color:var(--ink2)}
.btn,.fchip,.ptab,.segview button,.mtabs button,.mhead button,.chatbar button,.modal button{
  min-height:44px;font-size:14px;line-height:1.35;font-family:inherit;touch-action:manipulation
}
.btn{height:auto;padding:10px 14px;border-radius:10px;font-weight:650;white-space:normal;transition:background-color .14s ease,border-color .14s ease,color .14s ease}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand-ink)}
.btn.g{background:#fff;color:var(--brand-ink);border-color:#c7c7c7}
.btn.q{background:#f1f1f1;color:var(--ink2)}
.btn:active,.fchip:active,.segview button:active{transform:none;filter:none;opacity:.82}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(99, 99, 99,.36);outline-offset:2px
}
.fchip{padding:8px 12px;border-radius:999px;color:var(--ink2);border-color:var(--line);background:#fff;font-weight:600}
.fchip.on{color:#fff;background:var(--ink);border-color:var(--ink)}
.fchip .cnt{font-size:13px;color:inherit;opacity:.8}
.segview{gap:4px;background:#ececec;border-radius:12px;padding:4px}
.segview button{font-size:14px;color:var(--ink2)}
.segview button[aria-selected="true"]{background:var(--brand);color:#fff}
.segview button .n{font-size:13px}
.ptabs{border-color:var(--line)}
.ptab{padding:10px 8px;color:var(--ink2);font-size:14px}
.ptab.on{color:var(--brand-ink);font-weight:700}
.ptab.on::after{background:var(--brand)}
.badge{min-height:26px;padding:4px 8px;border-radius:7px;font-weight:650;white-space:normal}
.pst{font-size:13px}
.fld label{font-weight:650}
.fld select,.fld input,.fld textarea,.bar input,.chatbar input{font-size:16px;min-height:44px;border-color:var(--line);border-radius:10px}
.aidetails,.analysis-panel>summary{font-size:14px}
.mtabs{height:64px;border-top-color:var(--line);background:#fff}
.mtabs button{font-size:13px;line-height:1.2;color:var(--ink2);font-weight:560}
.mtabs button.on{color:var(--brand-ink);font-weight:750;box-shadow:inset 0 2px var(--brand)}
.mbody [style*="font-size:12px"]{font-size:13px!important;line-height:1.45}
.mbody :is(small,.small,.notegrey,.tsub){font-size:13px}
.review-panel{color:#606060}
@media(max-width:600px){
  html,body{width:100%;min-width:0;overflow-x:hidden}
  .prototype-shell{width:100%;height:100dvh;min-height:100dvh;padding:0;display:block;overflow:hidden}
  .prototype-shell .screen,.screen{width:100%;height:100%;max-height:none;min-height:0;border-radius:0}
  .pstage{width:100%;height:100dvh;min-height:100dvh;padding:0;overflow:hidden}
  .phone{width:100%;max-width:none;height:100%;min-height:0;flex:1 1 auto;border:0;border-radius:0;padding:0;box-shadow:none}
  .mbody{padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .mtabs{height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .mbody>*{max-width:100%}
  .mbody .grid2,.mbody .tgrid,.mbody .scards,.mbody .draftbox{min-width:0;max-width:100%}
}
@media(max-width:360px){
  .mbody{padding-right:14px;padding-left:14px}
  .mhead{padding-right:10px;padding-left:10px}
  .metricbar button{padding-right:7px;padding-left:7px}
  .segview button{font-size:13px;padding-right:2px;padding-left:2px}
}
/* V3 task-specific hierarchy: one queue, one focus, clear next action */
.p20-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.p20-shifts{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}
.p20-shift{min-width:56px;min-height:44px;padding:8px 10px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.p20-shift.on{background:var(--ink);color:#fff}
.p20-time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.p20-notify{margin-left:auto}
.p20-filters{margin:0 0 10px;gap:6px}
.p20-search{margin:0 0 10px}
.p20-overview{display:grid;gap:12px}
.p20-overview-heading{display:flex;align-items:center;gap:8px;min-height:44px}
.p20-overview-heading>div{min-width:0}
.p20-overview-heading h2{font-size:17px;font-weight:700;line-height:1.35}
.p20-overview-heading p{margin-top:2px;font-size:13px;line-height:1.4;color:var(--ink2)}
.p20-overview-heading .btn{margin-left:auto;flex:0 0 auto}
.p20-overview-hero{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}
.p20-overview-progress{display:grid;gap:8px;min-width:0}
.p20-overview-label{font-size:14px;font-weight:650;color:var(--ink2)}
.p20-overview-value{display:flex;align-items:baseline;gap:6px;min-width:0}
.p20-overview-value strong{font-size:32px;line-height:1;font-weight:750;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.p20-overview-value span{font-size:14px;line-height:1.4;color:var(--ink2)}
.p20-progress-track{height:8px;border-radius:8px;background:var(--line2);overflow:hidden}
.p20-progress-fill{display:block;height:100%;border-radius:inherit;background:var(--ok)}
.p20-progress-foot{font-size:13px;line-height:1.4;color:var(--ink2)}
.p20-live-now{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-width:0;min-height:88px;padding:11px;border:0;border-radius:13px;background:var(--ok-soft);text-align:left;color:var(--ink);cursor:pointer}
.p20-live-now strong{font-size:25px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ok)}
.p20-live-now span{font-size:13px;line-height:1.35}
.p20-live-now span:last-child{font-weight:650;color:var(--brand-ink)}
.p20-overview-metrics{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}
.p20-overview-metrics button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-width:0;min-height:82px;padding:12px;border:0;background:#fff;text-align:left;font:inherit;cursor:pointer}
.p20-overview-metrics button+button{border-left:1px solid var(--line)}
.p20-overview-metrics button:active,.p20-live-now:active,.p20-risk-row:active,.p20-next-step:active{background:var(--line2)}
.p20-overview-metrics span{font-size:13px;line-height:1.4;color:var(--ink2)}
.p20-overview-metrics strong{font-size:20px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.p20-risk-section{display:grid;gap:8px}
.p20-risk-heading{display:flex;align-items:center;gap:8px;min-height:44px}
.p20-risk-heading h2{font-size:17px;line-height:1.35;font-weight:700}
.p20-risk-heading>span{font-size:13px;color:var(--ink2)}
.p20-risk-heading button{margin-left:auto;min-height:44px;padding:0 2px;border:0;background:none;font:inherit;font-size:14px;font-weight:650;color:var(--brand-ink);cursor:pointer}
.p20-risk-list{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#fff}
.p20-risk-row{display:grid;grid-template-columns:auto minmax(0,1fr) 18px;align-items:center;gap:10px;width:100%;min-height:68px;padding:10px 12px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.p20-risk-row:last-child{border-bottom:0}
.p20-risk-tag{align-self:start;margin-top:2px;padding:4px 7px;border-radius:7px;font-size:13px;line-height:1.3;font-weight:650;white-space:nowrap}
.p20-risk-row.danger .p20-risk-tag{background:var(--danger-soft);color:var(--danger)}
.p20-risk-row.warn .p20-risk-tag{background:var(--warn-soft);color:var(--warn)}
.p20-risk-copy{display:grid;gap:3px;min-width:0}
.p20-risk-copy strong{font-size:15px;line-height:1.35}
.p20-risk-copy span{font-size:13px;line-height:1.45;color:var(--ink2);overflow-wrap:anywhere}

/* ===== 阶段三：移动端标杆页视觉试装（只改呈现，保留原有DOM与事件） =====
   P6：与 Ops Design System v8（文件头 :root）对齐——与 v8 同名的 token 改由 v8 提供
   （不再在此重复定义，避免遮蔽）；遗留 token 映射到 v8 等价物，保证 46 页同一套语言。 */
:root{
  --canvas:#F3F3F3;
  /* --surface/--line-divider/--ink-900/--ink-700 已由 v8 层提供，此处不再覆写 */
  --accent-100:#F2F2F2;
  --accent-200:#D3D3D3;
  --accent-600:#171717;
  --accent-700:#000000;
  --neutral-100:#F2F2F2;
  --neutral-700:#444444;
  --ink-600:#707070;
  --line-control:#858585;
  /* --line-divider 已由 v8 层提供（#E4E4E7），此处不再覆写，避免遮蔽 */
  --focus-ring:#111111;
  /* 品牌：旧版锚定到 --accent-600（黑）；正名 --brand 别名到 v8 品牌紫，供新页使用 */
  --brand:var(--accent-600);
  --brand-ink:var(--accent-700);
  --brand2:#777777;
  --brand-soft:var(--accent-100);
  --ok:#444444;--ok-soft:#EEEEEE;--ok-line:#C4C4C4;
  --up:var(--ok);--tint-green:#EEEEEE;--grad-ok:linear-gradient(135deg,#444444,#777777);
  --warn:#555555;--warn-soft:#F2F2F2;--warn-line:#AFAFAF;
  --danger:#111111;--danger-soft:#E5E5E5;--danger-line:#888888;
  --ink:var(--ink-900);--ink2:var(--ink-700);--ink3:var(--ink-600);
  --line:var(--line-divider);--line2:#F0F0F0;--card:var(--surface);--bg:var(--canvas);
  --grad-brand:linear-gradient(135deg,#171717,#777777);
  --sh1:0 2px 8px rgba(0,0,0,.045);
  --sh2:0 10px 26px rgba(0,0,0,.075);
}
body{color:var(--ink-900);background:var(--canvas);background-image:radial-gradient(620px 380px at 0% 0%,rgba(204, 204, 204,.34),transparent 68%),radial-gradient(520px 340px at 100% 5%,rgba(244, 244, 244,.5),transparent 66%)}

/* Stage 5: modal motion */
.mask{opacity:0;transition:opacity 180ms ease-out}
.mask.is-visible{opacity:1}
.mask:not(.sheetmask) .modal{
  opacity:0;transform:translateY(6px) scale(.99);
  transition:opacity 160ms ease-out,transform 200ms cubic-bezier(.2,0,0,1)
}
.mask:not(.sheetmask).is-visible .modal{opacity:1;transform:translateY(0) scale(1)}
.mask.sheetmask .modal{
  opacity:0;transform:translateY(20px);

}

}

  mine.filter(s=>s.st==="live").forEach(s=>evs.push({id:"live-"+s.id, lv:"ok", cat:"开播", sid:s.id, name:s.name,
    time:"今天 10:00", text:"已开播 · "+(s.slot||"晚场"), st:"进行中", act:["看档案",`goP22('${s.id}')`]}));
  HANDOFF_INBOX.forEach(h=>{ const s=byId(h.sid); if(!s) return; evs.push({id:"hand-"+h.id, lv:h.st==="wait"?"warn":"", cat:"交接",
    sid:h.sid, name:s.name, time:esc(h.d), text:h.k+" · "+h.note, st:HST[h.st][1], act:["看档案",`goP22('${h.sid}')`]}); });
  SIGNUP32.forEach(s=>evs.push({id:"sign-"+s.id, lv:"", cat:"签约", sid:s.sid, name:s.sname, time:"昨天",
    text:"已签约，进入「"+s.steps[0].n+"」", st:"已完成", act:["看档案", s.sid?`goP22('${s.sid}')`:"go('P32')"]}));
  const rank = e=>e.st==="待处理"?0:e.st==="进行中"?1:2;

  if (primary[0]!=="去复盘") more.push(["去复盘", `goP24('${s.id}')`]);

  return store[id] || (store[id]={tier:"dan",variant:0,stage:"form",form:{goal:"",focus:"",ref:true},work:{step:0},generation:0});
}
const P23TIER = {dan:["单场","单场规划草稿","单场"], stage7:["单阶段 · 7天","7天单阶段草稿","7天"], stage30:["完整阶段 · 30天","30天完整阶段草稿","阶段"]};
function goalFor(s, v){
  if (!s.yest && !s.today) return v ? "音浪5千 · 涨粉80（首播稳住就赢）" : "音浪3千 · 涨粉50（首播目标）";
  const arr = s.d14.slice(7).filter(x=>x>0);
  const base = arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 3;
  return "音浪"+(base*(v?1.05:1.15)).toFixed(1)+"万 · 涨粉"+Math.max(30, Math.round((s.fans7||100)*0.4));
}
function talkFor(s, tier, v){
  if (tier==="dan"){
    if (s.id==="azhe") return v ? "时段调回20点档；开场前10分钟改成点歌互动，不放歌单；周四约大乔连麦。" : "开场先点歌再聊天，留住进来的人；避开18点档，改打20点档。";
    if (s.id==="xiaoxiao") return v ? "先用昨晚评论区热词起头，30秒内点一次歌。" : "开场30秒抛一个树洞话题，让弹幕先动起来。";
    if (s.id==="maizi") return v ? "首播别怕冷场：每首歌之间说一句准备好的串词。" : "开场自报家门＋今晚歌单，前30分钟以弹幕点歌为主。";
    if (s.id==="laok") return v ? "临时调到21点档试两场；开播先打一局素材局，剪辑顺手切片。" : "22点档提前半小时热场，避开对面大场的开场高峰。";
    return v ? "开场直接唱半首，第40秒再打招呼；中段做一次小高潮，收尾报明天歌单。" : "开场30秒先报今晚安排，留住刚进来的人；每小时点一次歌，收尾连唱两首。";
  }
  if (tier==="stage7") return v ? "前三天固定老时段养习惯，后四天试一个新互动，周末连麦一场。" : "三天一循环：两天照常＋一天新花样；第三天连麦一场，冲一波涨粉。";
  return v ? "一个月主题递进：磨合→互动→连麦→大场；每周日做一次数据复盘。" : "四周走完：第1周定时段画面，第2周打磨互动，第3周连麦破圈，第4周锁定打法。";
}
function p23Rows(s, tier, v){
  const slot = s.id==="maizi" ? "14:00-17:00（早场，避开晚高峰）" : (s.slot || "19:00-22:00");
  if (tier==="dan") return [
    ["时段", slot],
    ["时长", s.id==="maizi" ? "3小时（首播宁短勿拖）" : "3.5小时（含2次各10分钟休息）"],
    ["画面自检", v ? "开播前六项过一遍：灯光暖场 → 背景整洁 → 妆容上镜 → 服装统一 → 机位居中 → 道具备齐" : "灯光 / 背景 / 妆容 / 服装 / 机位 / 道具 六项自检，全过再开播"],
    ["话术", talkFor(s,"dan",v)],
    ["数据目标", goalFor(s,v)]
  ];
  if (tier==="stage7") return [
    ["主题", s.track==="dance" ? "新舞教学周" : s.track==="talk" ? "话题互动周" : "翻唱连打周"],
    ["D1-D2", "固定"+slot+"开播，画面按六项自检走一遍"],
    ["D3-D4", "加入点歌点舞互动，盯进房率和停留"],
    ["D5-D7", "连麦一场冲涨粉；周日做周复盘"],
    ["数据目标", "7天涨粉"+Math.max(80, Math.round((s.fans7||60)*0.8))+" · 日均音浪不低于近7天均值"]
  ];
  const peak = s.d14 && Math.max(...s.d14) > 0 ? (Math.max(...s.d14)*1.3).toFixed(1) : "3";
  return [
    ["阶段定位", s.stage==="new" ? "新人期 → 稳定期（前15天是生死期）" : "稳定期 → 冲刺期"],
    ["第1周", "时段固定＋画面定稿（六项自检全过）"],
    ["第2周", "内容序列打磨，互动环节固定下来"],
    ["第3周", "连麦破圈，试一场大场"],
    ["第4周", "复盘调优，锁定能复用的打法"],
    ["里程碑", "连续开播25天 · 单场音浪破"+peak+"万"]
  ];
}
function p23Draft(s, tier, variant=ST.p23.variant){
  const store = P23DRAFTS[s.id] || (P23DRAFTS[s.id] = {});
  if (!store[tier]){
    const v = variant;
    store[tier] = {rows:p23Rows(s,tier,v), v:v, st:"draft"};
  }
  return store[tier];
}
function p23Basis(s){
  if (!s.yest && !s.today) return ["还没有开播数据：草稿按新人首播模板出，早场避开晚高峰", "签约和培训记录已读，首播以稳为主"];
  const last7 = s.d14.slice(7);
  const bi = last7.indexOf(Math.max(...last7));
  return ["近7天日均 "+(last7.reduce((a,b)=>a+b,0)/7).toFixed(1)+" 万 · 最近最高 "+DATES[7+bi]+"（"+Math.max(...last7).toFixed(1)+"万）",
    s.risk ? "后台在盯：" + s.risk.text : "近7天无连续下滑，节奏可以照旧"];
}

      <div class="worklines">${lines.slice(0, ST.p23work.step).map(l=>`<div class="workline">🤖 ${l}</div>`).join("")}</div></div>`;

      <div class="fld"><label for="f-focus">本轮重点</label><input id="f-focus" value="${esc(ST.p23form.focus||"")}" oninput="ST.p23form.focus=this.value" placeholder="${({dan:"比如：留人、试新歌",stage7:"比如：固定开播、增加互动",stage30:"比如：稳定场次、形成复盘节奏"})[ST.p23.tier]}"></div>
      <div class="sact"><label class="ckc ${ST.p23form.ref?"on":""}" style="flex:1 1 auto"><input type="checkbox" ${ST.p23form.ref?"checked":""} onchange="ST.p23form.ref=this.checked">参考上周数据</label></div>
      <div class="sact"><button class="btn p" onclick="p23Go()">开始生成</button></div>
    </div>`;
  }
  const d = p23Draft(byId(id), ST.p23.tier);
  const stB = {draft:["warn","待确认草稿"], adopted:["b","待发送"], sent:["ok","已发送"]};
  const formSummary = `<div class="card"><div class="ct">生成参数<span class="m">本次设定</span></div>
    <div class="rec-lines" style="margin-top:8px">
      <div>周期：${tierNames[ST.p23.tier||"dan"]} ｜ 数据目标：${esc(ST.p23form.goal||(near7(s)*1.15).toFixed(1)+"万")}</div>
      ${ST.p23form.focus?`<div>本场重点：${esc(ST.p23form.focus)}</div>`:""}
      <div>参考上周：${ST.p23form.ref?"是":"否"}</div>
    </div>
    <div class="sact"><button class="btn g" onclick="p23BackForm()">重新填写</button><button class="btn g" onclick="regenP23('${id}')">重新生成</button></div></div>`;
  const basis = `<div class="aicard" style="margin-bottom:13px">
    <div class="aih">✍️ 数据依据<span class="m">${s.name} · ${TRACK[s.track]}</span></div>
    <div class="aib"><i class="ok"></i><span>近7天 ${s.trend} · 昨日音浪 ${fmtW(s.yest?s.yest.g:null)} · 停留 ${s.stay||"—"}</span></div>
    <div class="aib"><i class="${s.risk?"warn":"ok"}"></i><span>${s.risk?"后台在盯："+s.risk.text:"无连续下滑信号"}</span></div>
  </div>`;
  const draft = `<div class="draftbox">
    <div class="dl"><div class="rec-t" style="display:flex;align-items:center;gap:8px">${s.name} · ${tierNames[ST.p23.tier||"dan"]} <span class="badge ${stB[d.st][0]}">${stB[d.st][1]}</span></div>
      <div class="plan-preview-fields">${d.rows.map(([label,value])=>`<div class="plan-preview-field"><strong>${esc(label)}</strong><span>${esc(value)}</span></div>`).join("")}</div></div>
    <div class="dr">
      ${d.st==="draft"?`<button class="btn p" onclick="adoptP23('${id}')">确认草稿</button><button class="btn g" onclick="editP23('${id}')">修改</button><button class="btn q" onclick="dropP23('${id}')">不用</button>`:""}
      ${d.st==="adopted"?`<button class="btn p" onclick="sendP23('${id}')">发给主播</button><button class="btn g" onclick="editP23('${id}')">继续修改</button>`:""}
      ${d.st==="sent"?`<button class="btn g" onclick="goP22('${id}','plan')">查看${s.name}的规划史</button><button class="btn q" onclick="recallP23('${id}')" style="color:var(--status-danger)">撤回</button>`:""}
    </div></div>
    <div style="font-size:13px;color:var(--ink2);margin-top:9px">${d.st==="sent"?"已发给主播，规划史同步。":(d.st==="adopted"?"草稿已确认；点击发给主播完成发送。":"请先查看或修改草稿，确认后再发送。")}</div>
    <div class="ai-consequences" style="margin-top:8px;padding:8px 10px;background:var(--brand-soft-v8);border-radius:8px;font-size:12px;color:var(--brand-ink-v8)">
      <strong>采纳后影响：</strong>${d.st==="draft"?"确认后进入草稿状态，可修改或发送；发送后主播端同步可见。":d.st==="adopted"?"发送给主播后，主播端 P81 同步出现此规划，运营端进入规划史。":"主播已收到此规划，可在 P81 查看。"}
    </div>`;
  return head + streamerTaskContext(s) + steps + draft + `${sectHead(`生成参数与数据依据`)}<div class="groupbox">${formSummary}${basis}</div>`;
}
function near7(s){ return s.d14.slice(7).reduce((a,b)=>a+b,0)/7; }
function p23Go(){
  ST.p23form.goal = document.getElementById("f-goal").value.trim();
  ST.p23form.focus = document.getElementById("f-focus").value.trim();
  p23StartGeneration(ST.p23.id);
}
function p23StartGeneration(id){
  const session=planSession(P23SESSIONS,id);
  session.stage = "working"; session.work = {step:0}; session.generation++;
  const generation=session.generation;
  render();
  p23WorkTick(id,session.tier,generation);
}
function applyP23Inputs(d, form, tier){
  const goal=String(form?.goal||"").trim(), focus=String(form?.focus||"").trim();
  const goalRow=d.rows.find(r=>r[0]==="数据目标"||r[0]==="里程碑");
  if(goal && goalRow){
    if(tier==="dan"){
      const follower=(goalRow[1].match(/涨粉[^·]*/)||[])[0];
      goalRow[1]=`音浪${goal}${follower?" · "+follower:""}`;
    } else goalRow[1]=`音浪目标：${goal} · ${goalRow[1]}`;
  }
  const focusIndex=d.rows.findIndex(r=>r[0]==="本轮重点");
  if(focus){ if(focusIndex>=0)d.rows[focusIndex][1]=focus; else d.rows.push(["本轮重点",focus]); }
}
function p23WorkTick(id,tier,generation){
  const session=planSession(P23SESSIONS,id);
  if(session.generation!==generation) return;
  session.work.step++;
  const visible=location.hash==="#P23/"+id || (location.hash==="#P23"&&ST.p23.id===id);
  if (session.work.step < 4){ if(visible) render(); setTimeout(()=>p23WorkTick(id,tier,generation), 720); }
  else {
    const draft=p23Draft(byId(id), tier,session.variant);
    applyP23Inputs(draft,session.form,tier);
    session.stage = "draft"; if(visible) render();
  }
}
function p23BackForm(){ planSession(P23SESSIONS,ST.p23.id).stage = "form"; render(); }
function p23Tier(t){ planSession(P23SESSIONS,ST.p23.id).tier = t; render(); }
function adoptP23(id){ p23Draft(byId(id), ST.p23.tier).st = "adopted"; toast("已采纳，记得发给主播"); render(); }
function dropP23(id){ delete (P23DRAFTS[id]||{})[ST.p23.tier]; planSession(P23SESSIONS,id).stage="form"; toast("已不用这条草稿"); render(); }
function regenP23(id){ const session=planSession(P23SESSIONS,id); session.variant = 1 - session.variant; delete (P23DRAFTS[id]||{})[session.tier]; toast("正在重新生成规划"); p23StartGeneration(id); }
function sendP23(id){
  const s = byId(id), tier = ST.p23.tier, d = p23Draft(s, tier);
  if (!s.plans) s.plans = [];
  const goal = d.rows.find(r=>r[0]==="数据目标"||r[0]==="里程碑")?.[1] || "未填写";
  const t = tier==="dan" ? "单场规划 · "+(s.id==="maizi" ? "首播早场" : (s.slot || "常规场"))
    : tier==="stage7" ? "7天 · "+d.rows[0][1] : "30天阶段规划";
  s.plans.unshift({d:"今天", k:P23TIER[tier][2], t:t, goal:goal, st:"sent",
    owner:"运营 · 小林", text:d.rows.map(r=>r[0]+"："+r[1]).join("；")});
  d.st = "sent";
  toast("已发给"+s.name+"，她的规划史里能看到"); render();
}
function recallP23(id){
  const s = byId(id), tier = ST.p23.tier, d = p23Draft(s, tier);
  if (s.plans) s.plans = s.plans.filter(p=>p.st!=="sent" || p.t!==d.rows[0]?.[1]);
  d.st = "draft";
  toast("已撤回，可重新修改后发送"); render();
}
function editP23(id){
  const d = p23Draft(byId(id), ST.p23.tier);
  const s=detailOf(resolveStreamer(id));
  openModal(`<div class="mh">修改${esc(s.name)}的规划</div><div class="ms">按项目修改内容，保存后仍是待确认草稿</div>
    <div class="p23-edit-fields">${d.rows.map(([label,value],i)=>`<div class="fld p23-edit-field"><label for="p23-edit-${i}">${esc(label)}</label><textarea id="p23-edit-${i}" aria-label="${esc(label)}">${esc(value)}</textarea></div>`).join("")}</div>
    <div class="mft"><button class="btn q" onclick="closeModal()">取消</button>
    <button class="btn p" onclick="saveP23Edit('${id}')">保存修改</button></div>`);
}
function saveP23Edit(id){
  const d = p23Draft(byId(id), ST.p23.tier);
  const values=d.rows.map((_,i)=>document.getElementById(`p23-edit-${i}`).value.trim());
  if(values.some(v=>!v)){toast("请补全每项规划内容；草稿尚未保存");return;}
  d.rows=d.rows.map(([label],i)=>[label,values[i]]);
  d.st="draft";
  closeModal(); toast("草稿已改，还没发给主播"); render();
}

/* ============================================================
   P24 复盘助手（昨晚三句话：哪里好 / 哪里掉 / 今晚怎么办）
   ============================================================ */
const P24DRAFTS = {};
function makeP24(s){
  const g = s.yest ? s.yest.g : null;
  const last7 = s.d14.slice(7), prev7 = s.d14.slice(0,7);
  const sum = a => a.reduce((x,y)=>x+y,0);
  const wow = sum(prev7) > 0 ? Math.round((sum(last7)-sum(prev7))/sum(prev7)*100) : 0;
  return {lines:[
    "昨晚音浪"+fmtW(g)+"、峰值"+(s.yest?s.yest.peak:"—")+"，"+(wow>0?"近7天比前7天涨"+wow+"%":(wow===0?"近7天与前7天持平":"近7天比前7天少"+Math.abs(wow)+"%")),
    s.risk ? "要盯的：" + s.risk.text : "掉分点不明显；前30分钟的留人还有空间",
    "今晚照常"+(s.slot||"按时段")+"开播，"+(wow>0?"把涨的这套保留下来":(wow===0?"保持现有节奏，先稳住时段":"先固定时段，再谈内容调整"))
  ], snap:"音浪"+fmtW(g)+" · 时长"+(s.yest?s.yest.dur:"—")+" · 峰值"+(s.yest?s.yest.peak:"—")};
}
function p24Get(s){
  const ex = (s.reviews||[]).find(r=>r.st==="draft");
  if (ex) return {src:"review", lines:ex.lines, snap:ex.snap, r:ex};
  if (!P24DRAFTS[s.id]){
    if (!s.yest && !s.today) P24DRAFTS[s.id] = {nodata:true};
    else P24DRAFTS[s.id] = makeP24(s);
  }
  return {src:"local", d:P24DRAFTS[s.id], lines:P24DRAFTS[s.id].lines, snap:P24DRAFTS[s.id].snap};
}
function p24ev(id){ ST.p24ev=ST.p24ev||{}; ST.p24ev[id]=!ST.p24ev[id]; render(); }

  </div>`;

function ck(item){

  if(bar) bar.style.width=`${done/6*100}%`;

  if(row){ row.classList.toggle("on",ST.checkin.done.has(item)); const input=row.querySelector("input"); if(input) input.checked=ST.checkin.done.has(item); }

function aiReplyFor(text){
  const rk=ST.role,intents=AIINTENTS[rk]||[],hit=intents.find(i=>i.k.some(k=>text.indexOf(k)>-1));

  const saved=rk==="zhubo"?(ST.p83chat||[]).find(m=>m.q===text):null;
  return {from:"ai",text:saved?saved.a:"暂未匹配到这条问题。可以从这些内容继续："+(AICHIPS[rk]||[]).join("、")+"。",sourceAsk:text,actionState:""};
}
function aiAsk(text){

  T.push({from:"me",text});T.push(aiReplyFor(text));render();
}

function grpAgg(){
  const map = {};
  ALL_ASSETS.forEach(s=>{
    const g = s.grpName || "未分组";
    if (!map[g]) map[g] = {name:g, n:0, live:0, today:0, l7:0, p7:0};
    map[g].n++;
    if (s.st==="live") map[g].live++;
    if (s.today) map[g].today += s.today.g;
    map[g].l7 += s.d14.slice(7).reduce((a,b)=>a+b,0);
    map[g].p7 += s.d14.slice(0,7).reduce((a,b)=>a+b,0);
  });
  (ST.extraGroups||[]).forEach(g=>{ if (!map[g.name]) map[g.name] = {name:g.name, n:0, live:0, today:0, l7:0, p7:0}; });
  return Object.values(map).map(g=>({...g, wow: g.p7>0?Math.round((g.l7-g.p7)/g.p7*100):0, rate: g.n?Math.round(g.live/g.n*100):0}));
}
function grpLead(gname){ const m = (gname||"").match(/·\s*(.+)$/); return m ? m[1] : gname; }

function p94Pending(){
  const st=p94State(), items=[], mine=p94Members();
  (ST.dirTasks||[]).forEach((t,i)=>{ if (t.to!=="小林") return;
    items.push({id:"dir-"+i, lv:t.done?"ok":"danger", cat:"总监下达", title:t.t,
      sub:t.done?"已回复总监：任务完成":"负责人 小林 · 等你的进度回复",
      state:t.done?"已完成":"待处理", acts: t.done?null:[["标记完成",`dirTaskDone(${i})`,"p"],["看组织与分组","go('P95')","g"]]}); });
  mine.filter(s=>s.risk).forEach(s=>items.push({id:"risk-"+s.id, lv:s.risk.lv==="danger"?"danger":"warn", cat:"主播风险",
    title:`${s.name} · ${s.risk.text}`, sub:`${TRACK[s.track]} · 负责人 小林 · 下一步：${s.risk.lv==="danger"?"先看复盘再定时段":"跟进一次并留记录"}`,
    state:s.risk.lv==="danger"?"待处理":"待跟进",
    acts:[["看档案",`goP22('${s.id}')`,"p"],["记一条沟通",`openComm('${s.id}')`,"g"],["发消息",`go('P91/${s.id}')`,"g"]]}));
  TASKS60.filter(t=>t.st==="待运营审").forEach(t=>items.push({id:"script-"+t.id, lv:"warn", cat:"脚本待审",
    title:`${t.sname} · ${t.t}`, sub:`来源 ${t.src} · 过审后自动推给剪辑`,
    state:"待审", acts:[["通过推剪辑",`approveScript('${t.id}')`,"p"],["驳回退回改",`rejectScript('${t.id}')`,"g"]]}));
  (ST.grp41||[]).forEach((t,i)=>items.push({id:"grp-"+i, lv:t.st==="已完成"?"ok":"warn", cat:"任务分配回执",
    title:`${t.to} · ${t.t}`, sub:`负责人 小林 · ${t.st==="已完成"?"已办完，记录落在沟通里":"等主播回执"}`,
    state:t.st||"进行中",
    acts: t.st==="已完成"?[["看主播档案",`goP22('${(STREAMERS.find(x=>x.name===t.to)||{}).id||"xiaoyu"}')`,"g"]]
      :[["标记办完",`finishGrp41(${i})`,"p"],["看主播档案",`goP22('${(STREAMERS.find(x=>x.name===t.to)||{}).id||"xiaoyu"}')`,"g"]]}));
  const rank = it => it.lv==="danger"?0:it.lv==="warn"?1:2;
  const list = st.f==="wait" ? items.filter(it=>rank(it)<2) : items;
  return list.map((it,i)=>[it,i]).sort((a,b)=>(rank(a[0])-rank(b[0]))||(a[1]-b[1])).map(x=>x[0]);
}

const ROSTER40 = [
  {id:"maizi", day:6, stage:"第4-10天", note:"破冰话术已过，完整首秀彩排中", katiao:false, due:false},
  {id:"lizi", day:2, stage:"第1-7天", note:"刚进带教，平台规则与红线在学", katiao:false, due:false}
];/* ===== P40 培训工作台（规格 4.5）：待办工作台，摘要少而准，主体按紧急度排队 ===== */
function p40Name(r){ return r.sname || (byId(r.id)||ALL_ASSETS.find(x=>x.id===r.id)||{name:r.id}).name; }
function p40Queue(){
  /* 按紧急度：临近结业 → 卡课 → 天数多的在前 */
  const rank = r => (r.day>=6 && !ST.maiziGrad ? 0 : 0) + (r.katiao?0:1);
  return ROSTER40.slice().sort((a,b)=>(rank(a)-rank(b))||(b.day-a.day));
}
function p40OpenSubjects(){ p41State().view="subjects"; go("P41"); }
function pageP40(){
  const head = pageHead("培训工作台","谁在用：培训师（我 · 安姐）",
    "今天带谁、谁考核到期、谁卡课；派课、验收、结业都在这条线");
  const queueExams = EXAMS.filter(examPending).slice().sort((a,b)=>(a.score==null?0:1)-(b.score==null?0:1));
  const pending = queueExams.length;
  const nearGrad = ST.maiziGrad ? 0 : ROSTER40.filter(r=>r.day>=6).length;
  const graduation = !ST.maiziGrad ? focusRec({lv:"warn",head:`${catChip("明天到期")}<span>结业评估</span>`,
    title:"麦子 · 明天结业评估",sub:`带教第 ${(ROSTER40.find(r=>r.id==="maizi")||{}).day||6} 天 · 先核对任务完成情况和进房率卡点`,
    actions:[["打开学员档案","go('P41D/maizi')","g"],["去结业评估","p42Go('evaluation')","p"]]})
    : `<div class="qlist">${emptyRow("今天没有临近结业评估","新的结业安排会出现在这里。")}</div>`;
  const examRows=queueExams.map(e=>{
    const needsRetake=e.st==="retry"&&!e.retakeId;
    const status=e.st==="retry"?(e.retakeId?"已安排补考":"需补考"):"待打分";
    const action=needsRetake?["安排补考",`scheduleRetake('${e.id}')`,"p"]:["去评分",`scoreExam('${e.id}')`,"p"];
    return qrow({lv:"warn",title:`${e.sname} · ${e.subj}`,sub:`${e.try} · ${e.score==null?"尚未评分":"得分 "+e.score+" 分"}`,
      right:`<span class="badge warn">${status}</span>`,onclick:action[1],act:action});
  });
  const learnerRows=p40Queue().map(r=>{
    const name=p40Name(r), task=p41Tasks(name).find(x=>x.st!=="done");
    const stage=task?task.t.split(" · ").slice(1).join(" · "):"成长任务已完成";
    return qrow({lv:r.katiao?"danger":"",title:`${name} · ${stage}`,sub:`第 ${r.day} 天 · ${r.stage}${task?" · "+(task.st==="doing"?"待验收":"未开始"):""}`,
      right:`<span class="badge ${r.katiao?"warn":"b"}">${r.katiao?"卡课中":"带教中"}</span>`,
      onclick:`go('P41D/${r.id}')`,act:["看当前任务",`go('P41D/${r.id}')`,"g"]});
  });
  const summary=metricBar([
    ["在训学员",ROSTER40.length,"go('P41')"],
    ["待评分 / 需补考",pending,"p42Go('queue')"],
    ["临近结业",nearGrad,"p42Go('evaluation')"],
    ["本月结业",ST.gradCount||0,null]
  ]);
  const tools=`<div class="sact">
    <button class="btn g" onclick="go('P41')">成长任务与学员名单</button>
    <button class="btn g" onclick="p40OpenSubjects()">课目管理</button>
    <button class="btn g" onclick="p42Go('all')">考核历史与明细</button>
  </div>`;
  return head
    + sectHead("今天先处理",ST.maiziGrad?"按待评分与带教任务推进":"麦子结业评估明天到期",null,true)
    + graduation
    + sectHead("待评分与补考",`${pending} 项`,null,true)
    + (examRows.length?`<div class="qlist">${examRows.join("")}</div>`:`<div class="qlist">${emptyRow("没有待评分或补考任务","新的考核任务会显示在这里。")}</div>`)
    + sectHead("正在带教",`${ROSTER40.length} 位学员`,null,true)
    + (learnerRows.length?`<div class="qlist">${learnerRows.join("")}</div>`:`<div class="qlist">${emptyRow("没有在训学员","签约交接后，新学员会进入成长任务。")}</div>`)
    + sectHead("本月进度","汇总")+summary
    + sectHead("培训入口")+tools;
}

const EXAMS = [
  {id:"e1", sid:"maizi", sname:"麦子", subj:"平台规则与红线", score:92, st:"pass", try:"首考"},
  {id:"e2", sid:"maizi", sname:"麦子", subj:"破冰话术", score:88, st:"pass", try:"首考"},
  {id:"e2b", sid:"maizi", sname:"麦子", subj:"开播流程与设备", score:90, st:"pass", try:"首考"},
  {id:"e3", sid:"lizi", sname:"栗子", subj:"破冰话术", score:null, st:"wait", try:"第2次补考"},
  {id:"e3b", sid:"lizi", sname:"栗子", subj:"平台规则与红线", score:74, st:"retry", try:"补考"},
  {id:"e4", sid:"maizi", sname:"麦子", subj:"留人与互动", score:null, st:"pass", try:"免修（有直播经验）"}
];
const SUBJECTS = ["平台规则与红线","破冰话术","开播流程与设备","留人与互动","数据复盘基础","完整首秀彩排"];
function examPending(e){ return e.st==="wait" || (e.st==="retry" && !e.retakeId); }
function examLabel(e){
  if(e.st==="pass") return ["ok","已通过"];
  if(e.st==="wait") return ["warn","待评分"];
  return e.retakeId ? ["line","已安排补考"] : ["warn","需补考"];
}
function examOutcomeText(e){
  if(e.score==null) return e.st==="pass" ? "免修通过 · 无需评分" : "尚未评分";
  return `得分 ${e.score} 分 · ${e.st==="pass"?"达到通过线":"未达 80 分"}`;
}
function canGraduateMaizi(){
  const tasks=TASKS41.filter(x=>x.sname==="麦子");
  const exams=EXAMS.filter(x=>x.sname==="麦子");
  return tasks.length>0 && tasks.every(x=>x.st==="done") && exams.length>0 && exams.every(x=>x.st==="pass");
}
function scheduleRetake(id){
  const e=EXAMS.find(x=>x.id===id);
  if(!e || e.st!=="retry" || e.retakeId){ toast("这条补考已安排或状态已更新"); return; }
  const same=EXAMS.filter(x=>x.sid===e.sid && x.subj===e.subj);
  const labelMatch=(e.try||"").match(/第(\d+)次/);
  const attempt=Math.max(labelMatch?Number(labelMatch[1])+1:2,same.length+1);
  const next={id:`retake-${e.id}-${attempt}`,sid:e.sid,sname:e.sname,subj:e.subj,score:null,st:"wait",try:`第${attempt}次补考`,previousId:e.id};
  e.retakeId=next.id;
  EXAMS.push(next);
  const state=p42State();
  state.view="queue";
  if(state.lastResult?.examId===id) state.lastResult={...state.lastResult,scheduled:true,nextId:next.id};
  toast(`${e.sname} · ${e.subj} 已安排${next.try}`);
  render();
}
function traineeFind(key){
  /* 路由用主播 id，界面用姓名：两种写法都要定位到同一位学员 */
  const r = ROSTER40.find(x=>x.id===key || x.sname===key) || ROSTER40.find(x=>(byId(x.id)||{}).name===key);
  const s = byId(key) || (r ? byId(r.id) : null);
  if (s) return {key:r?r.id:s.id, s:s, roster:r||null, name:s.name};
  if (r) return {key:r.id, s:null, roster:r, name:r.sname||r.id};
  return null;
}
function scoreExam(id){
  const e = EXAMS.find(x=>x.id===id);
  if(!e){ toast("没有找到这条考核"); return; }
  openModal(`<div class="mh">打分 · ${esc(e.sname)} ${esc(e.subj)}</div><div class="ms">${esc(e.try)} · 80 分及以上判通过</div>
    <div class="fld"><label for="esc2">分数</label><input id="esc2" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="0-100" value="${e.score==null?"":e.score}"></div>
    <div class="mft"><button class="btn q" onclick="closeModal()">取消</button>
    <button class="btn p" onclick="saveExam('${id}')">保存并判定</button></div>`);
}
function saveExam(id){
  const e = EXAMS.find(x=>x.id===id);
  const input=document.getElementById("esc2");
  const raw=input?input.value.trim():"";
  const v=raw===""?NaN:Number(raw);
  if (!Number.isInteger(v) || v<0 || v>100){ toast("请输入 0-100 的整数分数"); input?.focus(); return; }
  if(!e){ toast("没有找到这条考核"); closeModal(); return; }
  e.score = v; e.st = v>=80 ? "pass" : "retry"; e.retakeId=null;
  const result={examId:e.id,sid:e.sid,sname:e.sname,subj:e.subj,score:v,st:e.st,scheduled:false};
  p42State().lastResult=result;
  if(location.hash.startsWith("#P41D")) p41State().detailView="exams";
  else p42State().view="queue";
  closeModal(); toast(v>=80 ? "考核已通过" : "未达 80 分，可安排补考"); render();
}
function weakPoint(){
  const by = {};
  EXAMS.forEach(e=>{
    if((e.try||"").startsWith("免修") || e.st==="wait") return;
    const b = by[e.subj] || (by[e.subj] = {pass:0, tries:0});
    b.tries++; if (e.st==="pass") b.pass++;
  });
  return Object.keys(by).map(k=>({subj:k, pass:by[k].pass, tries:by[k].tries,
    rate:Math.round(by[k].pass/by[k].tries*100)})).sort((a,b)=>a.rate-b.rate);
}

  return head+`<section class="p33-worklist" aria-label="关怀对象"><div class="p33-overview"><strong>${CARE40.length} 位</strong><span>当前关怀对象 · ${CARE40.filter(c=>c.bucket!=="稳定支持").length} 位需持续关注</span></div>

function modalBackground(open){
  const screen=document.querySelector(".screen");
  if (!screen) return;
  screen.classList.toggle("modal-open",open);
  [...screen.children].filter(el=>el!==overlays.mask&&el!==overlays.toast).forEach(el=>el.inert=open);
}
function mountOverlays(){
  const screen=document.querySelector(".screen");
  if (screen){screen.append(overlays.mask,overlays.toast);}
}
/* 弹层生命周期收编（BUG-01/07/E-05）：路由变化时强制关闭残留弹层——清空内容、复位显隐与状态。
   与 mountOverlays 分离：openModal 内部只需重挂载（保留刚设置的内容），路由切换才需清空。 */
function resetOverlays(){
  if(modalCloseTimer!==null){clearTimeout(modalCloseTimer);modalCloseTimer=null;}
  overlays.modal.innerHTML="";overlays.modal.classList.remove("sheet","editor");
  overlays.mask.style.display="none";overlays.mask.dataset.phase="closed";
  overlays.mask.classList.remove("is-visible","sheetmask");modalBackground(false);
  mountOverlays();
}
function modalFocusables(){return [...overlays.modal.querySelectorAll('button,input,select,textarea,a[href],[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);}
function openModal(html, opts){
  if(modalCloseTimer!==null){clearTimeout(modalCloseTimer);modalCloseTimer=null;}
  overlays.trigger=document.activeElement;
  const mode=opts?.mode||(opts?.sheet?"sheet":html.includes("<textarea")?"editor":"dialog");
  overlays.modal.classList.toggle("sheet",mode==="sheet");
  overlays.modal.classList.toggle("editor",mode==="editor");
  overlays.mask.classList.toggle("sheetmask",mode==="sheet");
  overlays.modal.innerHTML='<button type="button" class="modal-close" aria-label="关闭弹窗" onclick="closeModal()">×</button>'+html;
  const title=overlays.modal.querySelector(".mh");
  if(title){title.id="dialog-title";overlays.modal.setAttribute("aria-labelledby","dialog-title");}
  else{overlays.modal.removeAttribute("aria-labelledby");overlays.modal.setAttribute("aria-label","操作面板");}
  const description=overlays.modal.querySelector(".ms");
  if(description){description.id="dialog-description";overlays.modal.setAttribute("aria-describedby","dialog-description");}
  else overlays.modal.removeAttribute("aria-describedby");
  overlays.modal.setAttribute("role","dialog");overlays.modal.setAttribute("aria-modal","true");overlays.modal.tabIndex=-1;
  mountOverlays();overlays.mask.dataset.phase="opening";overlays.mask.classList.remove("is-visible");
  overlays.mask.style.display="flex";modalBackground(true);
  overlays.modal.scrollTop=0;
  const focusables=modalFocusables();
  (focusables.find(el=>/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))||focusables[0]||overlays.modal).focus();
  const reveal=()=>{
    if(overlays.mask.dataset.phase!=="opening")return;
    overlays.mask.classList.add("is-visible");overlays.mask.dataset.phase="open";
  };
  if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches)reveal();
  else if(typeof requestAnimationFrame==="function")requestAnimationFrame(reveal);
  else reveal();
}
function finishModalClose(){
  if(overlays.mask.dataset.phase!=="closing")return;
  if(modalCloseTimer!==null){clearTimeout(modalCloseTimer);modalCloseTimer=null;}
  overlays.mask.style.display="none";overlays.mask.dataset.phase="closed";
  overlays.mask.classList.remove("is-visible");modalBackground(false);
  overlays.modal.classList.remove("sheet","editor");overlays.mask.classList.remove("sheetmask");
  const target=overlays.trigger?.isConnected?overlays.trigger:document.querySelector('.mhead button');
  target?.focus();
}
function closeModal(){
  const wasOpen=overlays.mask.style.display!=="none";
  if(!wasOpen||overlays.mask.dataset.phase==="closing")return;
  const wasVisible=overlays.mask.classList.contains("is-visible");
  overlays.mask.dataset.phase="closing";overlays.mask.classList.remove("is-visible");
  if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches||!wasVisible){finishModalClose();return;}
  const duration=overlays.mask.classList.contains("sheetmask")?240:200;
  modalCloseTimer=setTimeout(finishModalClose,duration+80);
}
overlays.modal.addEventListener("transitionend",e=>{
  if(e.target===overlays.modal&&e.propertyName==="transform")finishModalClose();
});
function maskClick(e){ if (e.target.id === "mask") closeModal(); }
document.addEventListener("keydown", e=>{
  if(overlays.mask.style.display==="none")return;
  if(e.key==="Escape"){e.preventDefault();closeModal();}
  if(e.key==="Tab"){
    const items=modalFocusables(),first=items[0],last=items[items.length-1];
    if(!first){e.preventDefault();overlays.modal.focus();}
    else if(document.activeElement===overlays.modal){e.preventDefault();(e.shiftKey?last:first).focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!items.includes(document.activeElement)){e.preventDefault();(e.shiftKey?last:first).focus();}
  }
});

function sendComm(id, returnTo=null){

  const nextAt=document.getElementById("cnext")?.value||"待安排";
  const nextStep=document.getElementById("cnextstep")?.value.trim()||"";
  if(visit&&nextAt!=="不需要"&&!nextStep){toast("请填写下次跟进动作");return;}
  s.comms.unshift({d:"今天", way, text:v});
  if(visit){
    visit.st="done"; visit.doneText=v; visit.last="今天 · "+way;
    visit.nextAt=nextAt;
    visit.nextStep=visit.nextAt==="不需要"?"本次回访已完成":nextStep;

    if(!history){history={sid:id,sname:s.name,recs:[]};VISITHIST.unshift(history);}
    history.recs.unshift({d:"今天",way,text:v});

}

const NAV_STATE={current:null,trail:[],views:new Map()};
function navigationTrail(trail, current, next){
  if(!current||current.role!==next.role||next.hash==="#P00")return [];
  return trail.at(-1)?.hash===next.hash?trail.slice(0,-1):[...trail,current];
}
function navigationView(pid){
  const next={hash:location.hash||"#P00",role:ST.role};
  const key=n=>`${n.role}|${n.hash}`;
  const mb=document.querySelector("#chatwrap")||document.querySelector(".mbody");
  const openDetails=[...document.querySelectorAll('.mbody details[open]')].map(d=>d.querySelector('summary')?.textContent);
  NAV_STATE.restoreScroll=!!(NAV_STATE.current&&key(NAV_STATE.current)===key(next))||!!(NAV_STATE.trail.at(-1)?.hash===next.hash&&NAV_STATE.current?.role===next.role);
  if(NAV_STATE.current&&key(NAV_STATE.current)===key(next)){NAV_STATE.openDetails=openDetails;return mb?.scrollTop||0;}
  const returning=NAV_STATE.trail.at(-1)?.hash===next.hash&&NAV_STATE.current?.role===next.role;
  if(NAV_STATE.current)NAV_STATE.views.set(key(NAV_STATE.current),{scroll:mb?.scrollTop||0,tab:ST.p22.tab,expand:{...ST.expand},openDetails});
  NAV_STATE.trail=navigationTrail(NAV_STATE.trail,NAV_STATE.current,next);
  NAV_STATE.current=next;
  const saved=NAV_STATE.views.get(key(next));
  NAV_STATE.openDetails=returning?saved?.openDetails||[]:[];
  if(pid==="P22"){ST.p22.tab=ST.p22.nextTab||saved?.tab||"overview";delete ST.p22.nextTab;ST.expand=saved?.expand||{};}
  return returning?saved?.scroll||0:0;
}
function backFor(pid){
  const source=NAV_STATE.trail.at(-1);
  if(source)return source.hash.replace(/^#/,"");
  if (pid==="P22") return (ST.prevPid==="P14"||ST.prevPid==="P30"||ST.prevPid==="P21") ? ST.prevPid : "P21";
  if (pid==="P23"||pid==="P24") return (ST.prevPid==="P20"||ST.prevPid==="P22") ? ST.prevPid : "P21";
  return BACKMAP[pid] || (ST.role ? ROLES[ST.role].home : "P00");
}

/* 收工自检（永久项）：四类断言——①异常字样 ②onclick 引用函数已定义 PAGES↔case 对齐 ④溢出断言 */
function selfCheck(){
  const t = (document.body.innerText || "");
  ["[object Object]","undefined","NaN"].forEach(k=>{
    if (t.indexOf(k) > -1) console.warn("selfCheck①异常字样：" + k);
  });
  // ② onclick 引用函数已定义
  const onclicks = [...document.documentElement.outerHTML.matchAll(/onclick="([^"]+)"/g)].map(m=>m[1]);
  const fns = new Set(Object.keys(window).filter(k=>typeof window[k]==="function"));
  onclicks.forEach(o=>{
    const m = o.match(/^(\w+)\(/);
    if (m && !fns.has(m[1]) && !["go","openModal","closeModal","toast","render","selfCheck","history","event","this"].includes(m[1])) {
      console.warn("selfCheck未定义函数：" + m[1]);
    }
  });
  //  PAGES↔case 对齐
  const pageKeys = new Set(Object.keys(PAGES).concat(["MY","AI","P41D"]));
  const caseKeys = [...document.documentElement.outerHTML.matchAll(/case\s+['"](\w+)['"]/g)].map(m=>m[1]);
  caseKeys.forEach(k=>{
    if (!pageKeys.has(k)) console.warn("selfCheck③case 未登记：" + k);
  });
  // ④ 溢出断言（简化版：检查 .screen 宽度合理性）
  const scr = document.querySelector(".screen");
  if (scr) {
    const w = scr.getBoundingClientRect().width;
    if (w < 300 || w > 500) console.warn("selfCheck④屏幕宽度异常：" + w.toFixed(0));
  }
}

  if(q.get("demo")==="1") ST.demoMode=true;
  const role=q.get("role");
  if(role && ROLES[role]) ST.role=role;
  if(q.has("demo")||role) history.replaceState(null,"",location.pathname+(location.hash||"#P00"));
})();
/* P3-11 快捷键：D 切换演示模式（输入框内不触发） */
document.addEventListener("keydown",e=>{
  if(e.key!=="d"&&e.key!=="D")return;
  const t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  e.preventDefault(); toggleDemoMode();
});
if (!location.hash) history.replaceState(null, "", "#P00");
render();
selfCheck();
window.__READY__ = true;
</script>
</body>
