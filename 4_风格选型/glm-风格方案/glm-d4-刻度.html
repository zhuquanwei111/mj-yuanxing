<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>if(new URLSearchParams(location.search).get('shot')==='long')document.documentElement.classList.add('shot-long');</script>
<title>明镜 · 运营工作台 · 今天 ｜ glm · d4 刻度</title>
<style>
/* ============ glm · d4 刻度 ============
   北极星：一台擦亮的仪表——今天的公会是一组读数：AI 把指针摆到位，人确认是否校准。
   冷瓷白 × 墨青单色 × 区带警示；细黑大数字；总刻度带。 */
:root{
  --bg:#F2F5F4; --face:#FFFFFF; --sink:#E7EDEB;
  --ink:#1E3231; --ink2:#3E5452; --mut:#7C918D;
  --line:#DCE4E2;
  --jade:#2F7E6D; --jade-dk:#226157;
  --cor:#E25B4A; --cor-bg:#FCEFEC;
  --amb:#C98A1B; --amb-bg:#FAF3E2;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[x-cloak]{display:none!important}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:#E2E8E6}
/* ---------- 桌面台面：瓷面仪器台 ---------- */
.desk{min-height:100%;display:block;
  background:
    radial-gradient(ellipse at 50% 6%,rgba(255,255,255,.55),transparent 58%),
    repeating-linear-gradient(180deg,transparent 0 35px,rgba(30,50,49,.022) 35px 36px),#E2E8E6}
.phone{width:390px;height:844px;background:var(--bg);overflow:hidden;position:relative;
  border-radius:34px;outline:10px solid #17211F;
  box-shadow:0 30px 70px rgba(23,33,31,.3),0 4px 14px rgba(23,33,31,.2)}
@media(max-width:519.9px){
  .desk{padding:0}
  .phone{width:100%;height:100vh;border-radius:0;outline:none;box-shadow:none}
}
@media(min-width:520px) and (min-height:960px){
  .desk{display:flex;align-items:center;justify-content:center;padding:34px 16px}
}
@media(min-width:520px) and (max-height:959.9px){
  .desk{display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
  .phone{transform:scale(.82);transform-origin:top center;margin-bottom:-160px}
}
.app{height:844px;display:flex;flex-direction:column;position:relative}
/* ---------- 壳顶栏 ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:9px;padding:12px 14px 10px;background:var(--bg);
  border-bottom:1px solid var(--line);z-index:5}
.logo{width:30px;height:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;border-radius:8px;letter-spacing:0}
.tb-name{font-weight:700;font-size:15px;letter-spacing:.06em}
.bell{margin-left:auto;position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.bell svg{width:19px;height:19px;stroke:var(--ink2);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:0;right:0;background:var(--cor);color:#fff;font-style:normal;
  font-size:9.5px;line-height:1;padding:2.5px 4.5px;border-radius:8px;font-variant-numeric:tabular-nums}
.role{font-size:11px;color:var(--jade-dk);border:1px solid var(--jade);padding:3.5px 8px;border-radius:6px;letter-spacing:.12em;background:#EDF4F1}
/* ---------- 页头三行 ---------- */
.pagehead{padding:13px 14px 11px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;align-items:flex-start;gap:10px}
.ph-name{font-weight:700;font-size:20px;letter-spacing:.03em;line-height:1.25}
.ph-sub{margin-top:5px;font-size:11px;color:var(--mut);line-height:1.6}
.ph-sub b{color:var(--jade-dk);font-weight:700}
.btn-ghost{margin-left:auto;flex:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-size:12.5px;padding:9px 13px;cursor:pointer;min-height:38px;border-radius:8px;font-weight:600;transition:transform .12s}
.btn-ghost:active{transform:scale(.97)}
/* ---------- 总刻度带（结构性突破：13 人一条刻度） ---------- */
.scale-strip{display:flex;gap:3px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.scale-strip .cap{writing-mode:vertical-rl;font-size:9px;color:var(--mut);letter-spacing:.28em;margin-right:7px;flex:none;text-align:center;padding-top:2px}
.tick{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.tick i{width:100%;height:22px;border-radius:4px;background:var(--sink)}
.tick.live i{background:var(--jade);animation:ring 2.4s ease-in-out infinite}
.tick.done i{background:#B9C9C4}
.tick.wait i{background:transparent;border:1.5px dashed #A9BBB6}
.tick.risk i{background:var(--cor)}
.tick.warn i{background:#E8B93B}
.tick span{font-size:8.5px;color:var(--mut);transform:scale(.92)}
@keyframes ring{0%,100%{opacity:1}50%{opacity:.55}}
/* ---------- 班次行 ---------- */
.shift-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);font-family:var(--sans);
  font-size:12px;padding:9px 11px;cursor:pointer;min-height:38px;border-radius:8px;transition:transform .12s,background .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .tm{font-size:10.5px;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
/* ---------- 内容流 ---------- */
.flow{flex:1;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.flow::-webkit-scrollbar{width:0}
/* ---------- Tab ---------- */
.tabs{display:flex;gap:20px;padding:12px 14px 0;position:sticky;top:0;background:var(--bg);z-index:4}
.tab{font-size:13.5px;color:var(--mut);padding:2px 1px 9px;cursor:pointer;border-bottom:1.5px solid transparent;font-weight:600}
.tab .n{font-size:11px;margin-left:3px;font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);font-weight:800;border-bottom-color:var(--jade)}
/* ---------- KPI 读数组 ---------- */
.kpi-band{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px 14px 4px}
.kpi{padding:11px 6px 10px;cursor:pointer;position:relative;transition:background .15s;border-radius:10px}
.kpi:active{background:var(--sink)}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .v{font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .v .yi{font-size:14px;font-weight:400;margin-left:1px}
.kpi .l{font-size:10px;color:var(--mut);margin-top:3px;letter-spacing:.04em}
.kpi .sub{font-size:9.5px;color:var(--jade-dk);margin-top:2px;font-weight:600}
.kpi .drill{position:absolute;top:8px;right:6px;font-size:8.5px;color:var(--mut);border:1px solid var(--line);padding:1px 4px;border-radius:4px}
.gauge{display:flex;gap:2.5px;margin-top:7px}
.gauge i{flex:1;height:4px;border-radius:2px;background:var(--sink);transform-origin:left;animation:fill .7s cubic-bezier(.2,.7,.3,1) both}
.gauge i.f{background:var(--jade)}
.gauge i:nth-child(1){animation-delay:.05s}.gauge i:nth-child(2){animation-delay:.1s}.gauge i:nth-child(3){animation-delay:.15s}
.gauge i:nth-child(4){animation-delay:.2s}.gauge i:nth-child(5){animation-delay:.25s}.gauge i:nth-child(6){animation-delay:.3s}
.gauge i:nth-child(7){animation-delay:.35s}.gauge i:nth-child(8){animation-delay:.4s}.gauge i:nth-child(9){animation-delay:.45s}
.gauge i:nth-child(10){animation-delay:.5s}
@keyframes fill{from{transform:scaleX(0);opacity:0}}
/* ---------- 待办卡：读数区 ---------- */
.todo-list{padding:0 14px 8px}
.tdwrap > .card{background:var(--face);border-radius:12px;padding:12px 13px;margin-top:9px;position:relative;
  box-shadow:0 1px 4px rgba(30,50,49,.05)}
.tdwrap > .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:12px 12px 0 0;background:var(--jade);opacity:.25}
.tdwrap > .card.lv-red::before{background:var(--cor);opacity:1}
.tdwrap > .card.lv-amb::before{background:#E8B93B;opacity:.85}
.chead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.cat{font-size:11px;color:var(--ink2);letter-spacing:.08em;font-weight:700}
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mut)}
.src .tag{font-size:9.5px;letter-spacing:.06em;padding:2.5px 6px;border-radius:4px;font-weight:700}
.src.auto .tag{color:var(--jade-dk);background:#E5F0EC}
.src.warn .tag{color:var(--cor);background:var(--cor-bg)}
.src.draft .tag{color:var(--amb);background:var(--amb-bg)}
.src.man .tag{color:var(--ink2);background:var(--sink)}
.risk{margin-left:auto;font-size:10.5px;letter-spacing:.05em;padding:3.5px 8px;font-weight:700;flex:none;border-radius:5px}
.risk.r{color:#fff;background:var(--cor)}
.risk.y{color:#7A5205;background:var(--amb-bg)}
.ct{font-weight:700;font-size:15px;line-height:1.48;letter-spacing:.01em}
.cbody{margin-top:6px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.digest{margin-top:7px}
.digest li{list-style:none;font-size:12.5px;line-height:1.72;color:var(--ink2);padding-left:15px;position:relative}
.digest li::before{content:"";position:absolute;left:1px;top:10px;width:7px;height:2px;border-radius:1px;background:var(--jade)}
.digest li em{font-style:normal;font-weight:700;color:var(--ink)}
.digest li .tag{font-size:11px;color:var(--mut)}
.digest li .tag.bad{color:var(--cor);font-weight:700}
/* 人机分工行：校准栏 */
.lobor{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:11.5px;line-height:1.65;color:var(--ink2)}
.lobor .who{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);letter-spacing:.04em;font-size:10.5px}
.lobor .who i{font-style:normal;width:15px;height:15px;font-size:9px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;color:#fff}
.lobor .who.ai i{background:var(--jade)}
.lobor .who.hu i{background:var(--ink2)}
/* 草稿卡（待校准） */
.draft-card{background:var(--face);border:1.5px dashed #A9BBB6;border-radius:12px;padding:12px 13px;margin-top:9px;position:relative}
.draft-card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:12px 12px 0 0;background:#A9BBB6}
.dcols{display:grid;grid-template-columns:1fr 88px;gap:10px;margin-top:8px}
.dtext{border:1px solid var(--line);background:var(--bg);padding:9px 10px;font-size:13px;line-height:1.75;color:var(--ink);border-radius:8px}
.dtext .zh{display:block;font-size:10px;color:var(--mut);margin-bottom:4px;letter-spacing:.14em;font-weight:700}
.dact{display:flex;flex-direction:column;gap:7px}
.btn{font-family:var(--sans);font-size:13px;letter-spacing:.05em;cursor:pointer;min-height:38px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:8px;transition:transform .12s,background .18s,color .18s,border-color .18s;position:relative}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--jade);color:#fff;border:1px solid var(--jade)}
.btn.p.go{background:var(--ink);border-color:var(--ink)}
.btn.s{background:transparent;border:1px solid #A9BBB6;color:var(--ink2)}
.btn.w{background:transparent;border:1px solid transparent;color:var(--mut)}
.card-act{display:flex;gap:8px;margin-top:11px}
.card-act .btn{min-width:96px}
.card-act .btn.w{min-width:0;padding:0 10px}
/* 已校准态 */
.draft-card.done{border-style:solid;border-color:var(--jade)}
.draft-card.done::before{background:var(--jade)}
.draft-card.dropped{opacity:.45}
.done-note{margin-top:9px;border-top:1px dashed var(--line);padding-top:7px;font-size:12px;color:var(--jade-dk);font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.done-note::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--jade)}
.done-note.drop{color:var(--mut)}
.done-note.drop::before{background:var(--mut)}
.editbox{margin-top:9px;border:1px solid #A9BBB6;background:var(--bg);border-radius:8px}
.editbox textarea{width:100%;border:0;outline:0;background:transparent;resize:none;font-family:var(--sans);
  font-size:13px;line-height:1.7;padding:9px 10px;color:var(--ink);display:block;min-height:74px}
.editbox .ebar{display:flex;gap:7px;padding:7px;border-top:1px solid var(--line)}
.editbox .btn{min-height:32px;font-size:12px;padding:0 11px}
/* 今日开播：读数行 */
.sec-head{display:flex;align-items:baseline;padding:15px 14px 6px}
.sec-head h3{font-weight:700;font-size:15px;letter-spacing:.1em}
.sec-head .r{margin-left:auto;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.roster{padding:0 14px 4px}
.row{display:flex;gap:10px;padding:10px 11px;background:var(--face);border-radius:10px;margin-bottom:6px;align-items:flex-start;box-shadow:0 1px 3px rgba(30,50,49,.04)}
.ava{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--sink);color:var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px}
.ava.live{border-color:var(--jade);animation:ring 2.4s ease-in-out infinite}
.rmain{flex:1;min-width:0}
.rline1{display:flex;align-items:baseline;gap:8px}
.rname{font-weight:700;font-size:14px}
.rslot{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rrisk{margin-top:3px;font-size:11.5px;line-height:1.6;color:var(--ink2)}
.rrisk b{color:var(--cor);font-weight:700;margin-right:2px}
.rstat{flex:none;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.06em;color:var(--jade-dk);
  padding:4px 8px;border-radius:99px;white-space:nowrap;background:#E5F0EC;font-weight:600}
.badge .dot{width:8px;height:8px;border-radius:50%;border:2px solid var(--jade);background:var(--jade)}
.badge.off{color:var(--mut);background:var(--sink)}
.badge.off .dot{border-color:var(--mut);background:var(--mut);border-radius:2px;width:7px;height:4px;animation:none}
.badge.wait{color:var(--ink2);background:transparent;border:1.5px dashed #A9BBB6}
.badge.wait .dot{border:2px solid #A9BBB6;background:transparent;width:7px;height:7px}
.roster-foot{margin:6px 14px 12px;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;color:var(--ink2);line-height:1.7;background:var(--face)}
.roster-foot b{color:var(--jade-dk);font-weight:700}
/* 已处理 */
.done-card{margin:10px 14px;background:var(--face);border-radius:12px;padding:13px;color:var(--ink2);font-size:13px;line-height:1.7;box-shadow:0 1px 4px rgba(30,50,49,.05)}
.done-card .tm{color:var(--mut);font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums}
/* ---------- 底部 Tab ---------- */
.tabbar{flex:none;display:flex;background:var(--face);border-top:1px solid var(--line);padding:7px 6px calc(9px + env(safe-area-inset-bottom))}
.tb{flex:1;text-align:center;font-size:12px;color:var(--mut);padding:8px 0 6px;cursor:pointer;letter-spacing:.05em;position:relative}
.tb.on{color:var(--jade-dk);font-weight:700}
.tb.on::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--jade)}
/* ---------- 弹层 ---------- */
.mask{position:absolute;inset:0;background:rgba(30,50,49,.4);z-index:20;display:flex;align-items:flex-end;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--face);border-radius:16px 16px 0 0;max-height:78%;display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes up{from{transform:translateY(70px);opacity:0}}
.sheet-h{padding:15px 16px 11px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-weight:700;font-size:16.5px;letter-spacing:.03em}
.sheet-h p{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.6}
.sheet-b{padding:13px 16px;overflow-y:auto}
.namelist{display:flex;flex-wrap:wrap;gap:8px}
.np{border:1px solid var(--line);background:var(--bg);font-size:13px;padding:9px 13px;cursor:pointer;color:var(--ink2);border-radius:8px;transition:transform .1s}
.np:active{transform:scale(.95)}
.np.on{background:var(--ink);border-color:var(--ink);color:#fff}
.np i{font-style:normal;font-size:10px;margin-left:4px;opacity:.8}
.writebox{margin-top:13px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.writebox textarea{width:100%;border:0;outline:0;background:transparent;resize:none;display:block;
  font-family:var(--sans);font-size:14px;line-height:1.6;padding:11px 12px;color:var(--ink);min-height:64px}
.sheet-f{display:flex;gap:9px;padding:11px 16px calc(13px + env(safe-area-inset-bottom))}
.sheet-f .btn{flex:1}
.kpi-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.kpi-row:last-child{border-bottom:0}
.kpi-row b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:14px;font-weight:700}
.kpill{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 3px}
.kpill span{border:1px solid var(--line);font-size:12px;padding:5px 10px;color:var(--ink2);border-radius:6px}
.kpill span.lv{border-color:var(--cor);color:var(--cor);background:var(--cor-bg)}
.kpill span.ok{border-color:var(--jade);color:var(--jade-dk);background:#E5F0EC}
/* 送达卡 */
.sent-card{margin:10px 14px 0;background:#E5F0EC;border:1px solid var(--jade);border-radius:12px;padding:11px 12px}
.sent-card .st{display:flex;align-items:baseline;font-weight:700;font-size:14px;color:var(--jade-dk)}
.sent-card .st span{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums}
.sent-card .sb{margin-top:5px;font-size:12.5px;color:var(--ink);line-height:1.65}
.sent-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sent-pills i{font-style:normal;font-size:10.5px;border:1px solid var(--jade);color:var(--ink2);padding:2.5px 7px;border-radius:5px;background:var(--face)}
.sent-pills i b{font-weight:400}
.sent-pills i b::after{content:"已送达";color:var(--jade-dk);margin-left:4px;font-weight:700}
/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:12.5px;padding:9px 15px;letter-spacing:.04em;z-index:40;white-space:nowrap;border-radius:8px;animation:fade .18s both}
/* ---------- 进场：读数逐个落位 ---------- */
.enter{animation:set .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes set{from{opacity:0;transform:translateY(5px)}}
/* ---------- forms 截图模式 ---------- */
.mode-forms .topbar,.mode-forms .pagehead,.mode-forms .shift-row,.mode-forms .tabs,
.mode-forms .kpi-band,.mode-forms .scale-strip,.mode-forms .sec-head,.mode-forms .roster,.mode-forms .roster-foot,
.mode-forms .tabbar,.mode-forms .sent-card{display:none!important}
.mode-forms .tdwrap > *:not(.is-form){display:none}
.mode-forms .flow{padding-top:12px}
/* ---------- 整页截图模式 ---------- */
.shot-long body{background:var(--bg)}
.shot-long .desk{display:block;padding:0;min-height:0;background:none}
.shot-long .phone{width:100%;height:auto;border-radius:0;outline:none;box-shadow:none;transform:none}
.shot-long .app{height:auto}
.shot-long .flow{overflow:visible}
/* ---------- P13 经营大盘 ---------- */
.p13-band{margin:10px 14px 0;background:var(--face);border-radius:12px;padding:11px 12px;box-shadow:0 1px 4px rgba(30,50,49,.05)}
.p13-band .bt{font-size:10px;letter-spacing:.18em;color:var(--mut);margin-bottom:9px;font-weight:700}
.ptask{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;color:var(--ink2)}
.ptask .nm{flex:none;width:58px;letter-spacing:.03em}
.ptask .bar{flex:1;height:5px;background:var(--sink);border-radius:3px;overflow:hidden}
.ptask .bar i{display:block;height:100%;background:var(--jade);border-radius:3px}
.ptask .vv{flex:none;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink);width:88px;text-align:right;line-height:1.4;font-weight:700}
.ptask .vv b{color:var(--cor);font-size:10.5px;display:block;font-weight:600}
.p13-note-row{border-top:1px dashed var(--line);margin-top:7px;padding-top:9px;font-size:12px;color:var(--mut)}
.p13-cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 14px 0}
.pc{background:var(--face);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(30,50,49,.05)}
.pc .v{font-weight:300;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pc .v small{font-size:15px;font-weight:400}
.pc .v .up{font-size:12px;color:var(--jade-dk);margin-left:4px;font-weight:600}
.pc .l{font-size:11px;color:var(--mut);margin-top:4px}
.p13-sec{margin:10px 14px 0;background:var(--face);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(30,50,49,.05)}
.p13-sec h4{font-weight:700;font-size:13.5px;letter-spacing:.1em;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.p13-sec h4::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--cor)}
.p13-sec h4.n::before{background:var(--jade)}
.alarm{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.alarm:first-of-type{border-top:0;padding-top:2px}
.alarm .txt{font-size:12.5px;line-height:1.65;color:var(--ink2);flex:1}
.alarm .txt b{color:var(--ink);font-size:13.5px;font-weight:700}
.alarm .txt i{font-style:normal;color:var(--cor);font-weight:700}
.alarm .btn{flex:none;min-height:32px;font-size:12px;padding:0 11px}
.base-row{padding:9px 0;border-top:1px dashed var(--line)}
.base-row:first-of-type{border-top:0;padding-top:2px}
.base-row .bl{display:flex;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
.base-row .bl b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.base-row .bl .judge{margin-left:auto;font-size:11px;font-weight:700}
.base-row .judge.hi{color:var(--jade-dk)}
.base-row .judge.lo{color:var(--cor)}
.base-bars{display:flex;flex-direction:column;gap:3px}
.bbar{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--mut)}
.bbar .tr{flex:1;height:5px;background:var(--sink);border-radius:3px;overflow:hidden}
.bbar .tr i{display:block;height:100%;background:#AFC2BD}
.bbar.us .tr i{background:var(--ink)}
.bbar em{font-style:normal;width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.p13-note{margin:10px 14px 14px;font-size:11px;color:var(--mut);line-height:1.7}
</style>
</head>
<body>
<div class="desk">
  <div class="phone">
    <div class="app" x-data="mg()" :class="panel==='forms' ? 'mode-forms' : ''">

      <!-- ================= P13 经营大盘 ================= -->
      <template x-if="page==='p13'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div class="topbar">
            <div class="logo">明</div><div class="tb-name">明镜</div>
            <div class="bell"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><i>2</i></div>
            <div class="role">老板</div>
          </div>
          <div class="pagehead">
            <div class="ph-row">
              <div class="ph-name">经营大盘</div>
              <button class="btn-ghost" style="margin-left:auto" @click="say('周报已按官方口径生成')">生成经营周报</button>
            </div>
            <div class="ph-sub">谁在用：公会老板<br>今天谁在播、赚多少、谁有风险</div>
          </div>
          <div class="flow">
            <div class="p13-band enter">
              <div class="bt">本月平台任务 · 自动按官方口径算</div>
              <div class="ptask"><span class="nm">拉新主播</span><span class="bar"><i style="width:60%"></i></span><span class="vv">12/20 人<b>还差 8 人</b></span></div>
              <div class="ptask"><span class="nm">活跃主播</span><span class="bar"><i style="width:81.3%"></i></span><span class="vv">61/75 人<b>还差 14 人</b></span></div>
              <div class="ptask"><span class="nm">月音浪</span><span class="bar"><i style="width:44.6%"></i></span><span class="vv">1560/3500 万<b>还差 1940 万</b></span></div>
              <div class="p13-note-row">本月账单已出 · 主播收益页可查</div>
            </div>
            <div class="p13-cards">
              <div class="pc enter" style="animation-delay:.05s"><div class="v">86</div><div class="l">主播规模 · 较上月 +5</div></div>
              <div class="pc enter" style="animation-delay:.1s"><div class="v">61</div><div class="l">活跃主播 · 口径：10有效天</div></div>
              <div class="pc enter" style="animation-delay:.15s"><div class="v">1560<small>万</small><span class="up">↑6.4%</span></div><div class="l">本月音浪</div></div>
              <div class="pc enter" style="animation-delay:.2s"><div class="v">71<small>%</small></div><div class="l">今日开播率 · 61/86 人在播</div></div>
            </div>
            <div class="p13-sec enter" style="animation-delay:.25s">
              <h4>异常 · 要处理（2 条）</h4>
              <div class="alarm"><div class="txt"><b>阿哲</b> · 连续3天流水下滑，近7天少<i>16%</i></div><button class="btn p" @click="say('进入阿哲复盘')">去处理</button></div>
              <div class="alarm"><div class="txt"><b>喵喵</b> · 连续2天没开播，消息回得慢</div><button class="btn p" @click="say('进入喵喵跟进')">去处理</button></div>
            </div>
            <div class="p13-sec enter n" style="animation-delay:.3s">
              <h4 class="n">公会 vs 行业基准</h4>
              <div class="base-row">
                <div class="bl">开播率　我们 <b>71%</b> ／ 行业 65%<span class="judge hi">高于基准</span></div>
                <div class="base-bars">
                  <div class="bbar us"><span style="width:26px">我们</span><span class="tr"><i style="width:71%"></i></span><em>71%</em></div>
                  <div class="bbar"><span style="width:26px">行业</span><span class="tr"><i style="width:65%"></i></span><em>65%</em></div>
                </div>
              </div>
              <div class="base-row">
                <div class="bl">活跃率　我们 <b>71%</b> ／ 行业 62%<span class="judge hi">高于基准</span></div>
                <div class="base-bars">
                  <div class="bbar us"><span style="width:26px">我们</span><span class="tr"><i style="width:71%"></i></span><em>71%</em></div>
                  <div class="bbar"><span style="width:26px">行业</span><span class="tr"><i style="width:62%"></i></span><em>62%</em></div>
                </div>
              </div>
              <div class="base-row">
                <div class="bl">新人 30 天留存　我们 <b>74%</b> ／ 行业 76%<span class="judge lo">低 2 个点</span></div>
                <div class="base-bars">
                  <div class="bbar us"><span style="width:26px">我们</span><span class="tr"><i style="width:74%"></i></span><em>74%</em></div>
                  <div class="bbar"><span style="width:26px">行业</span><span class="tr"><i style="width:76%"></i></span><em>76%</em></div>
                </div>
              </div>
            </div>
            <div class="p13-note">口径与任务进度每天自动按官方规则重算；要改口径去「设置 · 结算」。</div>
          </div>
          <div class="tabbar">
            <div class="tb on">今天</div><div class="tb">主播</div><div class="tb">预警</div><div class="tb">我的</div><div class="tb">助理</div>
          </div>
        </div>
      </template>

      <!-- ================= P20 运营工作台 ================= -->
      <template x-if="page!=='p13'">
        <div style="display:flex;flex-direction:column;height:100%">
          <div class="topbar">
            <div class="logo">明</div><div class="tb-name">明镜</div>
            <div class="bell"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><i>2</i></div>
            <div class="role">运营</div>
          </div>

          <div class="pagehead">
            <div class="ph-row">
              <div class="ph-name">运营工作台 · 今天</div>
              <button class="btn-ghost" style="margin-left:auto" @click="modal='notify'">群发通知</button>
            </div>
            <div class="ph-sub">谁在用：运营（我 · 小林）<br><b>待办第一</b>；早班先消化昨晚夜场</div>
          </div>

          <!-- 总刻度带：13 人状态一条刻度 -->
          <div class="scale-strip enter">
            <span class="cap">班况</span>
            <div class="tick live" title="小雨"><i></i><span>雨</span></div>
            <div class="tick live" title="大乔"><i></i><span>乔</span></div>
            <div class="tick done" title="甜甜"><i></i><span>甜</span></div>
            <div class="tick live" title="茉莉"><i></i><span>莉</span></div>
            <div class="tick risk" title="阿哲"><i></i><span>哲</span></div>
            <div class="tick done" title="九九"><i></i><span>九</span></div>
            <div class="tick warn" title="栗子"><i></i><span>栗</span></div>
            <div class="tick warn" title="晓晓"><i></i><span>晓</span></div>
            <div class="tick risk" title="老K"><i></i><span>K</span></div>
            <div class="tick" title="喵喵"><i></i><span>喵</span></div>
            <div class="tick" title="南南"><i></i><span>南</span></div>
            <div class="tick" title="豆豆"><i></i><span>豆</span></div>
            <div class="tick" title="麦子"><i></i><span>麦</span></div>
          </div>

          <div class="shift-row">
            <button class="chip" :class="shift==='am' && 'on'" @click="setShift('am')">早班<span class="tm">7:30-16:30</span></button>
            <button class="chip" :class="shift==='pm' && 'on'" @click="setShift('pm')">晚班<span class="tm">16:30-01:30</span></button>
          </div>

          <!-- 送达卡 -->
          <div class="sent-card" x-show="sent > 0" x-cloak>
            <div class="st">群发通知<span x-text="sent + '人 · 已送达'"></span></div>
            <div class="sb" x-text="notifyText"></div>
            <div class="sent-pills">
              <template x-for="h in sentHosts" :key="h"><i><b x-text="h"></b></i></template>
            </div>
          </div>

          <div class="flow">
            <div class="tabs">
              <div class="tab" :class="tab==='todo' && 'on'" @click="tab='todo'">待办<span class="n" x-text="todoCount"></span></div>
              <div class="tab" :class="tab==='done' && 'on'" @click="tab='done'">已处理<span class="n">1</span></div>
            </div>

            <!-- KPI 读数组 -->
            <div class="kpi-band enter">
              <div class="kpi" @click="modal='k13'">
                <span class="drill">下钻</span>
                <div class="v">13</div><div class="l">在管主播</div>
              </div>
              <div class="kpi" @click="modal='k10'">
                <div class="v">10</div><div class="l">今日应播</div>
              </div>
              <div class="kpi" @click="modal='k6'">
                <span class="drill">下钻</span>
                <div class="v">6</div>
                <div class="gauge"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i></i></div>
                <div class="sub">3 个在播</div>
              </div>
              <div class="kpi" @click="modal='k18'">
                <span class="drill">下钻</span>
                <div class="v">18.8<span class="yi">万</span></div><div class="l">今日音浪</div>
                <div class="sub">3 场在播</div>
              </div>
            </div>

            <!-- 待办流 -->
            <div class="todo-list" x-show="tab==='todo'">
              <template x-if="shift==='am'">
                <div class="tdwrap">
                  <!-- 1 自动摘要 -->
                  <div class="card is-form enter">
                    <div class="chead">
                      <span class="cat">盯场复盘</span>
                      <span class="src auto"><span class="tag">自动</span>自动摘要</span>
                    </div>
                    <div class="ct">昨晚夜场小结（11场 · 34.2万）</div>
                    <ul class="digest">
                      <li>11场开播，总音浪34.2万，比上周同期涨2.4%<span class="tag">（正常）</span></li>
                      <li><em>老K昨晚1.1万</em>，是14天里最低的一场；22点档有大场在分流<span class="tag bad">（异常）</span></li>
                      <li>茉莉新打法第二场，涨粉86，是上周同期的2倍<span class="tag">（正常）</span></li>
                    </ul>
                    <div class="lobor">
                      <span><span class="who ai"><i>AI</i>AI 做了什么</span>　汇总昨晚11场夜场数据写成这3条</span>
                      <span><span class="who hu"><i>人</i>人拍什么板</span>　没问题的点「标记已消化」，要处理的走下面待办</span>
                    </div>
                    <div class="card-act">
                      <button class="btn p" @click="say('已标记已消化')">标记已消化</button>
                      <button class="btn s" @click="say('进入夜场复盘')">去复盘</button>
                    </div>
                  </div>

                  <!-- 2 预警 · 有风险 -->
                  <div class="card is-form lv-red enter" style="animation-delay:.08s">
                    <div class="chead">
                      <span class="cat">盯场复盘</span>
                      <span class="src warn"><span class="tag">自动</span>预警</span>
                      <span class="risk r">▲ 有风险</span>
                    </div>
                    <div class="ct">老K：昨晚音浪1.1万，比上周同期低42%</div>
                    <div class="cbody">他22:00-01:00场；同赛道22点档这两天有大场在分流。</div>
                    <div class="card-act">
                      <button class="btn p" @click="say('进入老K复盘')">去复盘</button>
                      <button class="btn s" @click="say('打开老K详情')">看详情</button>
                    </div>
                  </div>

                  <!-- 3 预警 · 有风险 -->
                  <div class="card lv-red enter" style="animation-delay:.13s">
                    <div class="chead">
                      <span class="cat">流水跟踪</span>
                      <span class="src warn"><span class="tag">自动</span>预警</span>
                      <span class="risk r">▲ 有风险</span>
                    </div>
                    <div class="ct">阿哲：连续3天流水下滑，近7天比前7天少16%</div>
                    <div class="cbody">进场停留也从38秒掉到26秒；18点档被新起的两个同类场分走人气。</div>
                    <div class="card-act">
                      <button class="btn p" @click="say('进入阿哲复盘')">去复盘</button>
                      <button class="btn s" @click="say('打开阿哲详情')">看详情</button>
                    </div>
                  </div>

                  <!-- 4 预警 · 待跟进 -->
                  <div class="card lv-amb enter" style="animation-delay:.18s">
                    <div class="chead">
                      <span class="cat">话术节奏</span>
                      <span class="src warn"><span class="tag">自动</span>预警</span>
                      <span class="risk y">● 待跟进</span>
                    </div>
                    <div class="ct">晓晓：开场30秒话术两周没换，峰值连降一周</div>
                    <div class="cbody">同一时段在线只剩上周的7成，先从开场话术动刀。</div>
                    <div class="card-act">
                      <button class="btn p" @click="say('进入话术规划')">生成规划</button>
                      <button class="btn s" @click="say('打开晓晓详情')">看详情</button>
                    </div>
                  </div>

                  <!-- 5 记录 · 待跟进 -->
                  <div class="card lv-amb enter" style="animation-delay:.23s">
                    <div class="chead">
                      <span class="cat">新人孵化</span>
                      <span class="src man"><span class="tag">人工</span>记录</span>
                      <span class="risk y">● 待跟进</span>
                    </div>
                    <div class="ct">麦子：新人第6天，明天结业评估</div>
                    <div class="cbody">培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。</div>
                    <div class="card-act">
                      <button class="btn s" @click="say('打开麦子详情')">看详情</button>
                      <button class="btn s" @click="say('给麦子发消息')">发消息</button>
                    </div>
                  </div>

                  <!-- 6 预警 · 待跟进 -->
                  <div class="card lv-amb enter" style="animation-delay:.28s">
                    <div class="chead">
                      <span class="cat">风险合规</span>
                      <span class="src warn"><span class="tag">自动</span>预警</span>
                      <span class="risk y">● 待跟进</span>
                    </div>
                    <div class="ct">茉莉：昨晚画面自检背景一项没过，出现品牌标识</div>
                    <div class="cbody">她21:00开播，开播前要把背景撤掉。</div>
                    <div class="card-act">
                      <button class="btn p" @click="say('工单已转视觉组')">转视觉</button>
                      <button class="btn s" @click="say('给茉莉发消息')">发消息</button>
                    </div>
                  </div>

                  <!-- 7 草稿 · 待校准 -->
                  <div class="draft-card is-form enter" style="animation-delay:.33s"
                       :class="draftA==='dropped' ? 'dropped' : (draftA ? 'done' : '')">
                    <div class="chead">
                      <span class="cat">话术沉淀</span>
                      <span class="src draft"><span class="tag">草稿</span>待校准</span>
                    </div>
                    <div class="ct">小雨：昨晚收尾连唱打法有效，建议沉淀进话术库</div>
                    <div class="dcols" x-show="draftA===''||draftA==='edited'">
                      <div class="dtext">
                        <span class="zh">草稿正文</span>
                        <span x-show="draftA!=='edited'">收尾连唱两首，唱完报下次歌单；佐证：该段进场停留41秒，为全场最高。</span>
                        <span x-show="draftA==='edited'" x-text="editVal"></span>
                      </div>
                      <div class="dact">
                        <button class="btn p" :class="draftA==='accepted' && 'go'" @click="accept('draftA')" x-text="draftA==='accepted' ? '已校准' : '采纳'">采纳</button>
                        <button class="btn s" @click="startEdit('draftA','收尾连唱两首，唱完报下次歌单；佐证：该段进场停留41秒，为全场最高。')">修改</button>
                        <button class="btn w" @click="drop('draftA')">不用</button>
                      </div>
                    </div>
                    <div class="lobor" x-show="draftA===''||draftA==='edited'">
                      <span><span class="who ai"><i>AI</i>AI 做了什么</span>　按昨晚场次写出这条沉淀草稿</span>
                      <span><span class="who hu"><i>人</i>人拍什么板</span>　采纳存进话术库、改一改、或不用</span>
                    </div>
                    <div class="editbox" x-show="editing==='draftA'" x-cloak>
                      <textarea x-model="editVal"></textarea>
                      <div class="ebar">
                        <button class="btn p" @click="saveEdit('draftA')">保存修改</button>
                        <button class="btn w" @click="editing=''">收回</button>
                      </div>
                    </div>
                    <div class="done-note" x-show="draftA==='accepted'" x-cloak>已采纳 · 已存进话术库</div>
                    <div class="done-note drop" x-show="draftA==='dropped'" x-cloak>已标记不用</div>
                    <div class="done-note" x-show="draftA==='edited'" x-cloak>已修改 · 已存进话术库</div>
                  </div>
                </div>
              </template>

              <!-- 晚班 -->
              <template x-if="shift==='pm'">
                <div class="tdwrap">
                  <div class="card enter">
                    <div class="chead">
                      <span class="cat">盯场复盘</span>
                      <span class="src man"><span class="tag">人工</span>记录</span>
                    </div>
                    <div class="ct">老K：22:00场开播前，画面自检六项过一遍</div>
                    <div class="cbody">灯光、背景、妆容、服装、机位、道具；昨晚他机位偏了半格。</div>
                    <div class="card-act">
                      <button class="btn s" @click="say('打开自检清单')">看详情</button>
                      <button class="btn s" @click="say('给老K发消息')">发消息</button>
                    </div>
                  </div>

                  <div class="draft-card enter">
                    <div class="chead">
                      <span class="cat">话术节奏</span>
                      <span class="src draft"><span class="tag">草稿</span>待校准</span>
                    </div>

<script>
function mg(){
  const q = new URLSearchParams(location.search);
  const hosts = ['小雨','阿哲','喵喵','老K','甜甜','大乔','九九','栗子','南南','茉莉','豆豆','晓晓','麦子'];
  return {
    page: q.get('page') || 'p20',
    panel: q.get('panel') || '',
    shift: q.get('shift') === 'pm' ? 'pm' : 'am',
    tab: 'todo',
    modal: '',
    draftA: '', draftB: '', editing: '', editVal: '',
    hosts, picked: {}, notifyText: '', sent: 0,
    toast: '', toastT: 0,
    init(){ hosts.forEach(h => this.picked[h] = (['小雨','大乔','茉莉','阿哲','九九','栗子','晓晓','老K','甜甜'].includes(h))); },
    setShift(s){ this.shift = s; },
    say(m){ this.toast = m; clearTimeout(this.toastT); this.toastT = setTimeout(()=>this.toast='', 2200); },
    accept(k){ this[k]='accepted'; this.say('已采纳 · 已存进话术库'); },
    startEdit(k, txt){ this.editing=k; this.editVal=txt; },
    saveEdit(k){ this[k]='edited'; this.editing=''; this.say('已修改 · 已存进话术库'); },
    drop(k){ this[k]='dropped'; this.say('已标记不用'); },
    sendNotify(){
      const n = this.hosts.filter(h=>this.picked[h]).length;
      if(!n){ this.say('先选收件人'); return; }
      if(!this.notifyText.trim()){ this.say('写一句通知内容'); return; }
      this.sent = n; this.modal=''; this.say('已群发 '+n+' 人');
    },
    get todoCount(){ return this.shift==='am' ? 7 : 4; },
    get sentHosts(){ return this.hosts.filter(h=>this.picked[h]); }
  };
}
</script>
