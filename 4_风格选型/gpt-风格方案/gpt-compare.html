.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

receipt\">已送达\u003c/span>\u003c/span>\u003c/template>\u003c/div>\u003c/article>\u003c/template>\n\u003cdiv x-show=\"tab==='todo'\" role=\"tabpanel\" aria-labelledby=\"todo-tab\">\u003cdiv x-show=\"shift==='am'\" class=\"todo-flow\">\u003carticle id=\"summary\" class=\"task summary\" x-show=\"!completed.includes('summary')\">\u003cspan class=\"queue-mark\">01\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>已汇总\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source auto\">🤖 自动摘要\u003c/span>\u003c/div>\u003ch3>昨晚夜场小结（11场 · 34.2万）\u003c/h3>\u003cul class=\"insights\">\u003cli class=\"\">11场开播，总音浪34.2万，比上周同期涨2.4%（正常）\u003c/li>\u003cli class=\"abnormal\">老K昨晚1.1万，是14天里最低的一场；22点档有大场在分流（异常）\u003c/li>\u003cli class=\"\">茉莉新打法第二场，涨粉86，是上周同期的2倍（正常）\u003c/li>\u003c/ul>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>汇总昨晚11场夜场数据写成这3条\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>没问题的点「标记已消化」，要处理的走下面待办\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('summary','标记已消化')\">标记已消化\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('summary','去复盘')\">去复盘\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"laok\" class=\"task warn-task\" x-show=\"!completed.includes('laok')\">\u003cspan class=\"queue-mark\">02\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>老K：昨晚音浪1.1万，比上周同期低42%\u003c/h3>\u003cp class=\"body\">他22:00-01:00场；同赛道22点档这两天有大场在分流。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对昨晚音浪与上周同期，标出时段分流\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，判断是否调整时段\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('laok','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('laok','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"azhe\" class=\"task warn-task\" x-show=\"!completed.includes('azhe')\">\u003cspan class=\"queue-mark\">03\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">流水跟踪\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>阿哲：连续3天流水下滑，近7天比前7天少16%\u003c/h3>\u003cp class=\"body\">进场停留也从38秒掉到26秒；18点档被新起的两个同类场分走人气。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对近7天流水与进场停留，标出连续下滑\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，决定下一步调整\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('azhe','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('azhe','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"xiaoxiao\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('xiaoxiao')\">\u003cspan class=\"queue-mark\">04\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">话术节奏\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>晓晓：开场30秒话术两周没换，峰值连降一周\u003c/h3>\u003cp class=\"body\">同一时段在线只剩上周的7成，先从开场话术动刀。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对开场话术与一周峰值变化\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>生成规划，审阅后再采纳\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('xiaoxiao','生成规划')\">生成规划\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('xiaoxiao','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"maizi\" class=\"task manual-task follow-task\" x-show=\"!completed.includes('maizi')\">\u003cspan class=\"queue-mark\">05\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>人\u003c/b>\u003cspan>已记录\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">新人孵化\u003c/span>\u003cspan class=\"source manual\">🖐 记录\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>麦子：新人第6天，明天结业评估\u003c/h3>\u003cp class=\"body\">培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" @click=\"act('maizi','看详情')\">看详情\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('maizi','发消息')\">发消息\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"moli\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('moli')\">\u003cspan class=\"queue-mark\">06\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">风险合规\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>茉莉：昨晚画面自检背景一项没过，出现品牌标识\u003c/h3>\u003cp class=\"body\">她21:00开播，开播前要把背景撤掉。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span> \u003c/span>\u003c/span>\u003c/template>\u003c/div>\u003c/article>\u003c/template>\n\u003cdiv x-show=\"tab==='todo'\" role=\"tabpanel\" aria-labelledby=\"todo-tab\">\u003cdiv x-show=\"shift==='am'\" class=\"todo-flow\">\u003carticle id=\"summary\" class=\"task summary\" x-show=\"!completed.includes('summary')\">\u003cspan class=\"queue-mark\">01\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>已汇总\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source auto\">🤖 自动摘要\u003c/span>\u003c/div>\u003ch3>昨晚夜场小结（11场 · 34.2万）\u003c/h3>\u003cul class=\"insights\">\u003cli class=\"\">11场开播，总音浪34.2万，比上周同期涨2.4%（正常）\u003c/li>\u003cli class=\"abnormal\">老K昨晚1.1万，是14天里最低的一场；22点档有大场在分流（异常）\u003c/li>\u003cli class=\"\">茉莉新打法第二场，涨粉86，是上周同期的2倍（正常）\u003c/li>\u003c/ul>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>汇总昨晚11场夜场数据写成这3条\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>没问题的点「标记已消化」，要处理的走下面待办\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('summary','标记已消化')\">标记已消化\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('summary','去复盘')\">去复盘\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"laok\" class=\"task warn-task\" x-show=\"!completed.includes('laok')\">\u003cspan class=\"queue-mark\">02\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>老K：昨晚音浪1.1万，比上周同期低42%\u003c/h3>\u003cp class=\"body\">他22:00-01:00场；同赛道22点档这两天有大场在分流。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对昨晚音浪与上周同期，标出时段分流\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，判断是否调整时段\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('laok','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('laok','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"azhe\" class=\"task warn-task\" x-show=\"!completed.includes('azhe')\">\u003cspan class=\"queue-mark\">03\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">流水跟踪\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>阿哲：连续3天流水下滑，近7天比前7天少16%\u003c/h3>\u003cp class=\"body\">进场停留也从38秒掉到26秒；18点档被新起的两个同类场分走人气。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对近7天流水与进场停留，标出连续下滑\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，决定下一步调整\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('azhe','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('azhe','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"xiaoxiao\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('xiaoxiao')\">\u003cspan class=\"queue-mark\">04\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">话术节奏\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>晓晓：开场30秒话术两周没换，峰值连降一周\u003c/h3>\u003cp class=\"body\">同一时段在线只剩上周的7成，先从开场话术动刀。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对开场话术与一周峰值变化\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>生成规划，审阅后再采纳\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('xiaoxiao','生成规划')\">生成规划\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('xiaoxiao','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"maizi\" class=\"task manual-task follow-task\" x-show=\"!completed.includes('maizi')\">\u003cspan class=\"queue-mark\">05\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>人\u003c/b>\u003cspan>已记录\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">新人孵化\u003c/span>\u003cspan class=\"source manual\">🖐 记录\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>麦子：新人第6天，明天结业评估\u003c/h3>\u003cp class=\"body\">培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" @click=\"act('maizi','看详情')\">看详情\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('maizi','发消息')\">发消息\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"moli\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('moli')\">\u003cspan class=\"queue-mark\">06\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">风险合规\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>茉莉：昨晚画面自检背景一项没过，出现品牌标识\u003c/h3>\u003cp class=\"body\">她21:00开播，开播前要把背景撤掉。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>检查昨晚画面，标出背景品牌  \"xiaoxiao\": {\"id\": \"xiaoxiao\", \"cat\": \"话术节奏\", \"source\": \"预警\", \"level\": \"待跟进\", \"title\": \"晓晓：开场30秒话术两周没换，峰值连降一周\", \"body\": \"同一时段在线只剩上周的7成，先从开场话术动刀。\", \"ai\": \"比对开场话术与一周峰值变化\", \"human\": \"生成规划，审阅后再采纳\", \"actions\": [\"生成规划\", \"看详情\"]}, \"maizi\": {\"id\": \"maizi\", \"cat\": \"新人孵化\", \"source\": \"记录\", \"level\": \"待跟进\", \"title\": \"麦子：新人第6天，明天结业评估\", \"body\": \"培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。\", \"actions\": [\"看详情\", \"发消息\"]}, \"moli\": {\"id\": \"moli\", \"cat\": \"风险合规\", \"source\": \"预警\", \"level\": \"待跟进\", \"title\": \"茉莉：昨晚画面自检背景一项没过，出现品牌标识\", \"body\": \"她21:00开播，开播前要把背景撤掉。\", \"ai\": \"检查昨晚画面，标出背景品牌标识\", \"human\": \"转视觉或发消息，确认背景已撤\", \"actions\": [\"转视觉\", \"发消息\"]}, \"draft\": {\"id\": \"draft\", \"cat\": \"话术沉淀\", \"source\": \"草稿\", \"level\": \"\", \"title\": \"小雨：昨晚收尾连唱打法有效，建议沉淀进话术库\", \"body\": \"收尾连唱两首，唱完报下次歌单；佐证：该段进场停留41秒，为全场最高。\", \"ai\": \"按昨晚场次写出这条沉淀草稿\", \"human\": \"采纳存进话术库、改一改、或不用\", \"actions\": [\"采纳\", \"修改\", \"不用\"]}, \"pm-laok\": {\"id\": \"pm-laok\", \"cat\": \"盯场复盘\", \"source\": \"记录\", \"level\": \"\", \"title\": \"老K：22:00场开播前，画面自检六项过一遍\", \"body\": \"灯光、背景、妆容、服装、机位、道具；昨晚他机位偏了半格。\", \"actions\": [\"看详情\", \"发消息\"]}, \"pm-draft\": {\"id\": \"pm-draft\", \"cat\": \"话术节奏\", \"source\": \"草稿\", \"level\": \"\", \"title\": \"晓晓：今晚21:00场，开场话术换新版\", \"body\": \"先用昨晚评论区热词起头，30秒内点一次歌；目标把峰值拉回上周的9成。\", \"ai\": \"按昨晚评论区热词写出新版开场草稿\", \"human\": \"采纳、修改或不用，采纳之后才生效\", \"actions\": [\"采纳\", \"修改\", \"不用\"]}, \"pm-lizi\": {\"id\": \"pm-lizi\", \"cat\": \"新人孵化\", \"source\": \"记录\", \"level\": \"待跟进\", \"title\": \"栗子：19:30场，新人第9天\", \"body\": \"盯前30分钟：进房率健康线20-25%，低于20%就调开场。\", \"actions\": [\"看详情\", \"发消息\"]}, \"pm-moli\": {\"id\": \"pm-moli\", \"cat\": \"风险合规\", \"source\": \"记录\", \"level\": \"待跟进\", \"title\": \"茉莉：开播前把背景标识撤掉\", \"body\": \"视觉组工单已转，19:00前回传。\", \"actions\": [\"催一下\", \"看详情\"]}};const PEOPLE=[[\"小雨\", \"20:00-23:00\", \"\", \"直播中\", \"xiaoyu\"], [\"大乔\", \"19:00-22:00\", \"\", \"直播中\", \"daqia e\" x-text=\"page==='P13'?'经营大盘':'今天'\">今天\u003c/span>\u003cbutton class=\"bell\" aria-label=\"查看消息，2条未读\" @click=\"openInfo('消息','老K：昨晚音浪1.1万，比上周同期低42%\\n阿哲：连续3天流水下滑，近7天比前7天少16%','2 条未读')\">\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3Z\"/>\u003cpath d=\"M10 21h4\"/>\u003c/svg>\u003cem>2\u003c/em>\u003c/button>\u003cspan class=\"role\" x-text=\"page==='P13'?'老板':'运营'\">运营\u003c/span>\u003c/header>\u003cdiv class=\"scroll\" x-ref=\"scroller\">\n\u003csection x-show=\"page==='P20'\">\u003cdiv class=\"intro\">\u003ch1>运营工作台 · 今天\u003c/h1>\u003cp>谁在用：运营（我 · 小林）\u003c/p>\u003cp>待办第一；早班先消化昨晚夜场\u003c/p>\u003cbutton class=\"broadcast\" @click=\"openBroadcast()\">群发通知\u003c/button>\u003c/div>\u003cdiv class=\"clockmark\" aria-hidden=\"true\">\u003cstrong x-text=\"shift==='am'?'07:30':'16:30'\">07:30\u003c/strong>\u003cspan x-text=\"shift==='am'?'早班开始 · 先消化昨晚夜场':'晚班开始 · 先确认开播准备'\">早班开始 · 先消化昨晚夜场\u003c/span>\u003c/div>\u003cdiv class=\"shift\" :class=\"{night:shift==='pm'}\" role=\"group\" aria-label=\"选择班次\">\u003cbutton id=\"am\" :class=\"{active:shift==='am'}\" :aria-pressed=\"shift==='am'\" @click=\"switchShift('am')\" class=\"active\">早班 7:30-16:30\u003c/button>\u003cbutton id=\"pm\" :class=\"{active:shift==='pm'}\" :aria-pressed=\"shift==='pm'\" @click=\"switchShift('pm')\">晚班 16:30-01:30\u003c/button>\u003c/div>\u003cdiv class=\"tabs\" role=\"tablist\" aria-label=\"待办状态\">\u003cbutton role=\"tab\" id=\"todo-tab\" :class=\"{active:tab==='todo'}\" :aria-selected=\"tab==='todo'\" @click=\"tab='todo'\" class=\"active\">待办 \u003cb x-text=\"count()\">7\u003c/b>\u003c/button>\u003cbutton role=\"tab\" id=\"done-tab\" :class=\"{active:tab==='done'}\" :aria-selected=\"tab==='done'\" @click=\"tab='done'\">已处理 \u003cb x-text=\"done.length\">1\u003c/b>\u003c/button>\u003c/div>\n\u003ctemplate x-for=\"delivery in deliveries\" :key=\"delivery.id\">\u003carticle class=\"delivery\">\u003cdiv class=\"section-title\">\u003cstrong>群发通知\u003c/strong>\u003cspan x-text=\"delivery.names.length+'人 · 已送达'\">\u003c/span>\u003c/div>\u003cp x-text=\"delivery.text\">\u003c/p>\u003cdiv class=\"receipts\">\u003ctemplate x-for=\"name in delivery.names\" :key=\"name\">\u003cspan>\u003cb x-text=\"name\">\u003c/b> \u003cspan class=\"badge receipt\">已送达\u003c/span>\u003c/span>\u003c/template>\u003c/div>\u003c/article>\u003c/template>\n\u003cdiv x-show=\"tab==='todo'\" role=\"tabpanel\" aria-labelledby=\"todo-tab\">\u003cdiv x-show=\"shift==='am'\" class=\"todo-flow\">\u003carticle id=\"summary\" class=\"task summary\" x-show=\"!completed.includes('summary')\">\u003cspan class=\"queue-mark\">01\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>已汇总\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source auto\">🤖 自动摘要\u003c/span>\u003c/div>\u003ch3>昨晚夜场小结（11场 · 34.2万）\u003c/h3>\u003cul class=\"insights\">\u003cli class=\"\">11场开播，总音浪34.2万，比上周同期涨2.4%（正常）\u003c/li>\u003cli class=\"abnormal\">老K昨晚1.1万，是14天里最低的一场；22点档有大场在分流（异常）\u003c/li>\u003cli class=\"\">茉莉新打法第二场，涨粉86，是上周同期的2倍（正常）\u003c/li>\u003c/ul>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>汇总昨晚11场夜场数据写成这3条\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>没问题的点「标记已消化」，要处理的走下面待办\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('summary','标记已消化')\">标记已消化\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('summary','去复盘')\">去复盘\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"laok\" class=\"task warn-task\" x-show=\"!completed.includes('laok')\">\u003cspan class=\"queue-mark\">02\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">盯场复盘\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>老K：昨晚音浪1.1万，比上周同期低42%\u003c/h3>\u003cp class=\"body\">他22:00-01:00场；同赛道22点档这两天有大场在分流。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对昨晚音浪与上周同期，标出时段分流\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，判断是否调整时段\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('laok','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('laok','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"azhe\" class=\"task warn-task\" x-show=\"!completed.includes('azhe')\">\u003cspan class=\"queue-mark\">03\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">流水跟踪\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk danger\">有风险\u003c/span>\u003c/div>\u003ch3>阿哲：连续3天流水下滑，近7天比前7天少16%\u003c/h3>\u003cp class=\"body\">进场停留也从38秒掉到26秒；18点档被新起的两个同类场分走人气。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对近7天流水与进场停留，标出连续下滑\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>去复盘，决定下一步调整\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('azhe','去复盘')\">去复盘\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('azhe','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"xiaoxiao\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('xiaoxiao')\">\u003cspan class=\"queue-mark\">04\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">话术节奏\u003c/span>\u003cspan class=\"source warn\">🤖 预警\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>晓晓：开场30秒话术两周没换，峰值连降一周\u003c/h3>\u003cp class=\"body\">同一时段在线只剩上周的7成，先从开场话术动刀。\u003c/p>\u003cdiv class=\"responsibility\">\u003cdiv>\u003cspan class=\"resp-label\">🤖 AI做了什么：\u003c/span>比对开场话术与一周峰值变化\u003c/div>\u003cdiv class=\"human-line\">\u003cspan class=\"resp-label\">🖐 人拍什么板：\u003c/span>生成规划，审阅后再采纳\u003c/div>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" @click=\"act('xiaoxiao','生成规划')\">生成规划\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('xiaoxiao','看详情')\">看详情\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"maizi\" class=\"task manual-task follow-task\" x-show=\"!completed.includes('maizi')\">\u003cspan class=\"queue-mark\">05\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>人\u003c/b>\u003cspan>已记录\u003c/span>\u003c/div>\u003cdiv class=\"task-inner\">\u003cdiv class=\"task-head\">\u003cspan class=\"category\">新人孵化\u003c/span>\u003cspan class=\"source manual\">🖐 记录\u003c/span>\u003cspan class=\"risk follow\">待跟进\u003c/span>\u003c/div>\u003ch3>麦子：新人第6天，明天结业评估\u003c/h3>\u003cp class=\"body\">培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn secondary\" @click=\"act('maizi','看详情')\">看详情\u003c/button>\u003cbutton class=\"btn secondary\" @click=\"act('maizi','发消息')\">发消息\u003c/button>\u003c/div>\u003c/div>\u003c/article>\u003carticle id=\"moli\" class=\"task warn-task follow-task\" x-show=\"!completed.includes('moli')\">\u003cspan class=\"queue-mark\">06\u003c/span>\u003cdiv class=\"ticket-rail\" aria-hidden=\"true\">\u003cb>AI\u003c/b>\u003cspan>待处理\u003c/span>\u003c/div>\ \", \"body\": \"他22:00-01:00场；同赛道22点档这两天有大场在分流。\", \"ai\": \"比对昨晚音浪与上周同期，标出时段分流\", \"human\": \"去复盘，判断是否调整时段\", \"actions\": [\"去复盘\", \"看详情\"]}, \"azhe\": {\"id\": \"azhe\", \"cat\": \"流水跟踪\", \"source\": \"预警\", \"level\": \"有风险\", \"title\": \"阿哲：连续3天流水下滑，近7天比前7天少16%\", \"body\": \"进场停留也从38秒掉到26秒；18点档被新起的两个同类场分走人气。\", \"ai\": \"比对近7天流水与进场停留，标出连续下滑\", \"human\": \"去复盘，决定下一步调整\", \"actions\": [\"去复盘\", \"看详情\"]}, \"xiaoxiao\": {\"id\": \"xiaoxiao\", \"cat\": \"话术节奏\", \"source\": \"预警\", \"level\": \"待跟进\", \"title\": \"晓晓：开场30秒话术两周没换，峰值连降一周\", \"body\": \"同一时段在线只剩上周的7成，先从开场话术动刀。\", \"ai\": \"比对开场话术与一周峰值变化\", \"human\": \"生成规划，审阅后再采纳\", \"actions\": [\"生成规划\", \"看详情\"]}, \"maizi\": {\"id\": \"maizi\", \"cat\": \"新人孵化\", \"source\": \"记录\", \"level\": \"待跟进\", \"title\": \"麦子：新人第6天，明天结业评估\", \"body\": \"培训组明天出评估；结业后转运营，第一场建议排早场避开晚高峰。\", \"actions\": [\"看详情\", \"发消息\"]}, \"moli\": {\"id\": \"moli\", \"cat\": \"风险合规\", \"source\": \"预警\", \"level\": \"待跟进\", \"title\": \"茉莉：昨晚画面自检背景一项没过，出现品牌标识\", \"body\": \"她21:00开播，开播前要把背景撤掉。\", \"ai\": \"检查昨晚画面，标出背景品牌标识\", \"human\": \"转视觉或发消息，确认背景已撤\", \"actions\": [\"转视觉\", \"发消息\"]}, \"draft\": {\"id\": \"draft\", \"cat\": \"话术沉淀\", \"source\": \"草稿\", \"level\": \"\", \"title\": \"小雨：昨晚收尾连唱打法有效，建议沉淀进话术库\", \"body\": \"收尾连唱两首，唱完报下次歌单；佐证：该段进场停留41秒，为全场最高。\", \"ai\": \"按昨晚场次写出这条沉淀草稿\", \"human\": \"采纳存进话术库、改一改、或不用\", \"actions\": [\"采纳\", \"修改\", \"不用\"]}, \"pm-laok\": {\"id\": \"pm-laok\", \"cat\": \"盯场复盘\", \"source\": \"记录\", \"level\": \"\", \"title\": \"老K：22:00场开播前，画面自检六项过一遍\", \"body\": \"灯光、背景、妆容、服装、机位、道具；昨晚他机位偏了半格。\", \"actions\": [\"看详情\", \"发消息\"]}, \"pm-draft\": {\"id\": \"pm-draft\", \"cat\": \"话术节奏\", \"source\": \"草稿\", \"level\": \"\", \"title\": \"晓晓：今晚21:00场，开场话术换新版\", \"body\": \"先用昨晚评论区热词起头，30秒内点一次歌；目标把峰值拉回上周的9成。\", \"ai\": \"按昨晚评论区热词写出新版开场草稿\", \"human\": \"采纳、修改或不用，采纳之后才生效\", \"actions\": [\"采纳\", \"修改\", \"不用\"]}, \"pm-lizi\": {\"id\": \"pm-lizi\", \"cat\": \"新人孵化\", \"source\": \"记录\", \"level\": \"待跟进\", \"   if(ready===true){if(m.getAttribute('src')!==c.content){s.classList.remove('ready');m.src=c.content;}}
  else{s.classList.remove('ready');if(m.hasAttribute('src'))m.removeAttribute('src');}
 }
 async function checkService(url){
  const state=services.get(url);if(state.pending)return;state.pending=true;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);
  const target=new URL(url);if(target.hostname==='[::1]')target.hostname='localhost';
  try{await fetch(target.href,{mode:'no-cors',cache:'no-store',credentials:'omit',signal:controller.signal});state.ready=true;}catch{state.ready=false;}
  finally{clearTimeout(timer);state.pending=false;}
  $$('.stage').forEach(s=>{const c=byId[s.dataset.id];if(c.kind==='url'&&c.content===url)syncService(s,c);});
 }
 const checkServices=()=>services.forEach((state,url)=>checkService(url));

 // 动效工具：尊重“减少动态效果”，浏览器不支持时直接落到最终状态
 function animate(node,frames,opts){if(calm.matches||!node?.animate)return;try{node.animate(frames,opts);}catch{node.animate(frames,{...opts,easing:'ease-out'});}}
 let vtSeq=0;
 function morph(update,kind){
  if(calm.matches||!document.startViewTransition||document.hidden){update();return;}
  const n=++vtSeq;root.dataset.vt=kind||'';
  try{document.startViewTransition(update).finished.finally(()=>{if(n===vtSeq)delete root.dataset.vt;});}catch{update();}
 }
 function slideTo(ind,target,instant){
  if(!ind||!target||!target.offsetWidth)return;
  if(instant)ind.style.transition='none';
  ind.style.width=`${target.offsetWidth}px`;ind.style.height=`${target.offsetHeight}px`;ind.style.transform=`translate(${target.offsetLeft}px,${target.offsetTop}px)`;
  if(instant){ind.offsetWidth;ind.style.transition='';}
 }
 const placeThumbs=instant=>$$('.seg').forEach(s=>slideTo(s.querySelector('.thumb'),s.querySelector('[aria-pressed=true]'),instant));
 const placeFilm=instant=>{const f=$('#film');slideTo(f.querySelector('.film-ind'),f.querySelector('[aria-current=true]'),instant);};

 $('#project').textContent=DATA.project;
 $('#brief').textContent=DATA.brief||'';

 function stripMini(c){const s=el('span','strip-mini');(c.palette||[]).forEach(h=>{const i=el('i');i.style.background=h;s.append(i);});return s;}
 function stage(c,interactive){
  const s=el('div','stage');s.dataset.id=c.id;
  const m=document.createElement(c.kind==='image'?'img':'iframe');
  if(c.kind==='image'){m.alt=c.name;m.draggable=false;}
  else{m.title=c.name;m.setAttribute('sandbox',c.kind==='url'?'allow-scripts allow-same-origin allow-forms':c.interactive?'allow-scripts allow-forms':'');m.referrerPolicy='no-referrer';if(!interactive)m.tabIndex=-1;}
  m.addEventListener('load',()=>{if(c.kind==='url'&&services.get(c.content).ready!==true)return;s.classList.add('ready');fit(s);});
  if(c.kind==='image')m.src=c.content;else if(c.kind!=='url')m.srcdoc=c.content;
  s.append(m);
  if(c.kind==='url'){s.append(serviceNotice());syncService(s,c);}
  if(c.kind!=='html'||c.interactive)s.append(el('span','static',c.kind==='url'?t('live'):c.kind==='image'?t('image'):t('interactive')));
  return s;
 }
 function fit(s){
  if(!s.isConnected)return;
  const size=SIZES[st.viewport],m=s.querySelector('iframe,img'),box=s.parentElement;let r;
  if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?Infinity:box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
