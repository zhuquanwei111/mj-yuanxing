 === 'done';\n    document.getElementById('todosPm').hidden = shift !== 'pm' || tab !== 'todo';\n    var all = document.getElementById('matAll');\n    all.classList.toggle('doneonly', tab === 'done');\n    document.getElementById('mat').hidden = tab === 'done' || showAll;\n    all.hidden = !(tab === 'done' || showAll);\n    document.getElementById('secDone').hidden = tab !== 'done';\n    document.getElementById('tabAll').textContent = showAll ? '只看今日开播' : '这里的 13 个人';\n    var g = document.getElementById('todos');\n    g.classList.remove('fill'); void g.offsetWidth; g.classList.add('fill');\n  }\n  apply();\n  document.querySelectorAll('[data-shift]').forEach(function(chip){\n    chip.addEventListener('click', function(){\n      shift = chip.dataset.shift; tab = 'todo'; showAll = false;\n      document.querySelectorAll('[data-shift]').forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });\n      apply();\n    });\n  });\n  document.getElementById('tabDone').addEventListener('click', function(){ tab = 'done'; showAll = true; apply(); });\n  document.getElementById('tabTodo').addEventListener('click', function(){ tab = 'todo'; apply(); });\n  document.getElementById('tabAll').addEventListener('click', function(){ showAll = !showAll; apply(); });\n\n  // 草稿：采纳 = 整格填入墨青\n  document.querySelectorAll('[data-draft]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var cell = b.closest('.cell'), kind = b.dataset.draft;\n      cell.querySelectorAll('[data-draft]').forEach(function(x){ x.disabled = true; });\n      if (kind === 'yes') {\n        cell.classList.add('adopted');\n        var tag = cell.querySelector('.tag.src'); if (tag) { tag.textContent = '已入库'; tag.className = 'tag'; }\n        cell.querySelector('.note').textContent = '已入库 · 生效';\n      } else if (kind === 'edit') {\n        cell.querySelector('.note').textContent = '等你的修改';\n      } else {\n        cell.classList.add('struck');\n        cell.querySelector('.note').textContent = '不入库';\n      }\n    });\n  });\n  document.querySelectorAll('[data-digest]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var cell = b.closest('.cell'); if (cell.dataset.done) return; cell.dataset.done = 1;\n      cell.classList.add('struck'); b.disabled = true; b.textContent = '已消化';\n      cell.querySelector('.note').textContent = '已记一笔';\n    });\n  });\n\n  // 弹层\n  var scrim = document.getElementById('scrim'), sheets = { kpi: document.getElementById('sheetKpi'), compose: document.getElementById('sheetCompose') };\n  function open(w){ scrim.hidden = false; requestAnimationFrame(function(){ scrim.classList.add('on'); sheets[w].hidden = false; requestAnimationFrame(function(){ sheets[w].classList.add('on'); }); }); }\n  function close(){ scrim.classList.remove('on'); Object.keys(sheets).forEach(function(k){ sheets[k].classList.remove('on'); });\n    setTimeout(function(){ scrim.hidden = true; Object.keys(sheets).forEach(function(k){ sheets[k].hidden = true; }); }, 180); }\n  scrim.addEventListener('click', close);\n  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', close); });\n  var kpi = {\n    '13': { t:'在管主播 13', rows:[['直播中 3','小雨 · 大乔 · 茉莉'],['已下播 3','甜甜 · 阿哲 · 九九'],['未开播 3','栗子 · 晓晓 · 老K'],['请假 1','豆豆 · 10-15 返岗'],['新人 1','麦子 · 第 6 天'],['今日未播 1','喵喵'],['排休 1','安琪']] },\n    '6': { t:'已开播 6 · 3 个在播', rows:[['直播中 3','小雨 · 大乔 · 茉莉'],['已播完 3','甜甜 · 阿哲 · 九九'],['待播 4','10 场里还剩 4 场']] },\n    '18.8': { t:'今日音浪 18.8 万', rows:[['在播 3 场','小雨 · 大乔 · 茉莉'],['已播完 3 场','甜甜 · 阿哲 · 九九'],['待播 4','10 场里还剩 4 场']] },\n    '1560': { t:'本月音浪 1560 万', rows:[['本月平台任务','1560/3500 万 · 还差 1940 万'],['口径','官方口径自动算']] },\n    '71': { t:'今日开播率 71%', rows:[['已开播','61 人'],['主播规模','86 人']] }\n  };\n  document.querySelectorAll('[data-drill]').forEach(function(cell){\n    cell.addEventListener('click', function(){\n      var d = kpi[cell.dataset.drill]; if (!d) return;\n      document.getElementById('kpiTitle').textContent = d.t;\n      document.getElementById('kpiBody').innerHTML = d.rows.map(function(r){ return '\u003cdiv class=\"kv\">\u003cb>' + r[0] + '\u003c/b>\u003cspan>' + r[1] + '\u003c/span>\u003c/div>'; }).join('');\n      open('kpi');\n    });\n  });\n  var names = ['小雨','大乔','甜甜','茉莉','阿哲','九九','栗子','晓晓','老K','麦子','豆豆','喵喵','安琪'];\n  var list = document.getElementById('pickList');\n  list.innerHTML = names.map(function(n){ return '\u003clabel>\u003cinput type=\"checkbox\" value=\"' + n + '\">' + n + '\u003c/label>'; }).join('');\n  var doSend = document.getElementById('doSend'), ta = document.getElementById('msgText'), cnt = document.getElementById('pickCount');\n  function sync(){ var n = list.querySelectorAll('input:checked').length; cnt.textContent = n; doSend.disabled = !(n && ta.value.trim()); }\n  list.addEventListener('change', sync); ta.addEventListener('input', sync);\n  document.getElementById('openCompose').addEventListener('click', function(){ open('compose'); });\n  doSend.addEventListener('click', function(){\n    var picked = [].slice.call(list.querySelectorAll('input:checked')).map(function(i){ return i.value; }), text = ta.value.trim();\n    document.getElementById('delivered').innerHTML =\n      '\u003cdiv class=\"grid2\" style=\"grid-template-columns:1fr\">\u003cdiv class=\"cell\" style=\"min-height:80px\">' +\n        '\u003cdiv class=\"who\">群发通知 \u003cem>我发出 · ' + picked.length + ' 人 · 已送达\u003c/em>\u003c/div>' +\n        '\u003cp>' + text + '\u003c/p>\u003cdiv class=\"recips\">' + picked.map(function(n){ return '\u003cspan>' + n + ' \u003cb>已送达\u003c/b>\u003c/span>'; }).join('') + '\u003c/div>' +\n      '\u003c/div>\u003c/div>';\n    close(); document.getElementById('scroller').scrollTo({ top: 0, behavior: 'smooth' });\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "ds2-d4-人阵.html", "baseline": false, "interactive": true}, {"id": "d5", "name": "d5 标图", "concept": "像一张今天要交的作业图：问题画在图上，按编号回注解表办事。", "typography": "无衬线＋等宽标注（编号与数值），字号统一在 12–15px，字距略松", "palette": ["#0F2E5C", "#0A2246", "#28497E", "#E8EFFA", "#9DB3D6", "#C8382B"], "traits": ["图上作业：纵轴开播时刻×横轴偏离基准的散点＋引线编号", "三档状态用朱红双圈＋引线／白虚线圈／无圈表达（彩色只给危险）", "晒图纸：白线、网格、平无阴影"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>明镜 · 运营工作台 · 今天（ds2-d5 标图）\u003c/title>\n\u003cstyle>\n/* ds2-d5 标图 —— 晒图纸上的图上作业：问题画在图上，编号回表格办事\n   色板：蓝图 #0F2E5C / 深槽 #0A2246 / 网格 #28497E / 浅网格 #1C3A6B / 白线字 #E8EFFA\n        次级 #9DB3D6 / 弱 #7E97C0 / 朱批 #C8382B / 台面 #071A34\n   三档：危险＝朱红双圈＋引线编号；关注＝白虚线圈；正常＝无圈白点 —— 圈数与线型是第二手段 */\n:root{\n  --paper:#0f2e5c; --deep:#0a2246; --grid:#28497e; --grid2:#1c3a6b;\n  --ink:#e8effa; --dim:#9db3d6; --dim2:#7e97c0; --red:#c8382b; --desk:#071a34;\n  --sans:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",sans-serif;\n  --mono:ui-monospace,\"Cascadia Mono\",Consolas,\"DejaVu Sans Mono\",monospace;\n}\n[hidden]{display:none!important}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;background:var(--desk);\n  background-image:linear-gradient(#0b2444 1px,transparent 1px),linear-gradient(90deg,#0b2444 1px,transparent 1px);background-size:32px 32px}\n.phone{position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);\n  border:1px solid var(--grid)}\n.phone[hidden]{display:none}\n\n/* 壳 */\n.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;flex:none;border-bottom:1px solid var(--ink)}\n.top .mark{font-size:13px;letter-spacing:.16em;border:1px solid var(--ink);padding:2px 6px}\n.top .nm{font-size:13px;letter-spacing:.04em}\n.top .sp{margin-left:auto;display:flex;align-items:center;gap:8px}\n.top .bell{position:relative;border:1px solid var(--grid);padding:1px 6px;font-family:var(--mono);font-size:12px;color:var(--dim)}\n.top .bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;padding:0 3px;font-weight:700}\n.top .role{border:1px dashed var(--ink);padding:1px 7px;font-size:12px;letter-spacing:.12em}\n.scroll{flex:1;overflow-y:auto}\n.tabbar{display:flex;flex:none;border-top:1px solid var(--ink)}\n.tabbar button{flex:1;min-height:46px;font-size:12px;color:var(--dim2);letter-spacing:.06em;padding:14px 0;border-right:1px solid var(--grid2)}\n.tabbar button:last-child{border-right:0}\n.tabbar button[aria-current=\"page\"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}\n\n/* 图纸头 */\n.ph{padding:12px}\n.ph .t{display:flex;align-items:baseline;gap:8px}\n.ph .t h1{margin:0;font-size:15px;letter-spacing:.08em}\n.ph .t i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim2);border:1px solid var(--grid);padding:0 4px}\n.ph .ln{margin-top:3px;font-size:12px;color:var(--dim)}\n.sbar{display:flex;gap:6px;align-items:center;padding:0 12px 10px}\n.chip{min-height:40px;padding:9px 9px;border:1px solid var(--grid2);font-size:12px;color:var(--dim);font-family:var(--mono)}\n.chip[aria-pressed=\"true\"]{border-color:var(--ink);color:var(--ink)}\n.chip[aria-pressed=\"true\"]::before{content:\"▣\";margin-right:5px;color:var(--red)}\n.send{margin-left:auto;min-height:40px;padding:9px 10px;border:1px solid var(--ink);font-size:12px;letter-spacing:.04em}\n\n/* 标题栏（图签） */\n.tb{display:grid;grid-template-columns:repeat(4,1fr);margin:0 12px;border:1px solid var(--ink)}\n.tb button{padding:7px 8px;border-right:1px solid var(--grid);text-align:left}\n.tb button:last-child{border-right:0}\n.tb .n{display:block;font-family:var(--mono);font-size:18px;font-weight:700}\n.tb .n i{font-style:normal;font-size:12px;font-weight:400}\n.tb .k{display:block;font-size:12px;color:var(--dim)}\n.tb .k em{display:block;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim2)}\n.tb button[data-drill] .n::after{content:\" ⌄\";color:var(--dim2);font-size:10px}\n.tb button:active{background:var(--deep)}\n\n/* 图纸 */\n.sheet{margin:10px 12px 0;border:1px solid var(--ink);background:var(--deep);position:relative}\n.sheet .cap{display:flex;align-items:baseline;gap:8px;padding:8px 9px 6px;border-bottom:1px solid var(--grid)}\n.sheet .cap b{font-size:13px;letter-spacing:.06em}\n.sheet .cap span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}\n.sheet .plot{padding:6px 0 0}\nsvg{display:block;width:100%;height:auto}\n.legend{display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px 9px;border-top:1px solid var(--grid);font-size:12px;color:var(--dim)}\n.legend span{display:flex;align-items:center;gap:5px}\n.legend i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);display:inline-block}\n.legend i.d{border:2px solid var(--red);width:12px;height:12px}\n.legend i.w{border-style:dashed}\n.legend em{font-style:normal;margin-left:auto;font-family:var(--mono);color:var(--dim2)}\n.notes{display:flex;flex-wrap:wrap;gap:4px 12px;padding:7px 9px;border-top:1px solid var(--grid);font-size:12px;color:var(--ink)}\n.notes span{font-family:var(--mono);font-size:12px}\n.notes span b{font-family:var(--sans);font-weight:400;color:var(--dim)}\n\n/* 注解表 */\n.ant{margin:10px 12px 0;border-top:1px solid var(--ink)}\n.ant .ah{display:flex;align-items:baseline;gap:8px;padding:8px 0 6px;border-bottom:1px solid var(--grid)}\n.ant .ah b{font-size:13.5px;letter-spacing:.06em}\n.ant .ah span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2);cursor:pointer;\n  border-bottom:1px dashed var(--dim2);min-height:40px;display:inline-flex;align-items:center}\n.ar{display:grid;grid-template-columns:22px 1fr 66px;gap:7px;padding:8px 0;border-bottom:1px solid var(--grid2);align-items:start}\n.ar .no{font-family:var(--mono);font-size:12px;color:var(--dim)}\n.ar .no.hot{color:var(--red);font-weight:700}\n.ar .body b{font-size:12.5px}\n.ar .body .meta{display:inline-flex;gap:6px;align-items:center;margin-left:6px}\n.src{font-size:12px;padding:0 4px;border:1px solid var(--dim);color:var(--dim)}\n.src.a{border-style:solid}\n.src.b{border-style:solid;border-left-width:4px;color:var(--ink);border-color:var(--ink)}\n.src.c{border-style:dashed;color:var(--ink);border-color:var(--ink)}\n.src.d{border-style:double;border-width:3px;color:var(--ink);border-color:var(--ink)}\n.ar .body p{margin:3px 0 0;font-size:12px;line-height:1.5;color:var(--dim)}\n.ar .body p em{font-family:var(--mono);font-style:normal;color:var(--ink);font-weight:700}\n.ar .body p i{font-style:normal;font-family:var(--mono);color:var(--ink)}\n.ar .act{text-align:right}\n.btn{min-height:40px;padding:9px 10px;border:1px solid var(--ink);font-size:12px;display:inline-block;transition:transform 80ms ease-out}\n.btn.pri{background:var(--ink);color:var(--paper);font-weight:700}\n.btn.weak{border-style:dotted;color:var(--dim);border-color:var(--dim)}\n.btn:active{transform:translateY(1px)}\n.btn[disabled]{opacity:.5}\n.ar .act u{display:block;font-size:12px;color:var(--dim);text-decoration:none;margin-top:5px;border-bottom:1px dashed var(--dim2)}\n.note{font-family:var(--mono);font-size:12px;color:var(--red);display:block;margin-top:4px}\n.underline{position:relative}\n.underline::after{content:\"\";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--red);\n  transform-origin:left;animation:draw .2s ease-out both}\n@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n\n/* 底表 */\n.base{margin:10px 12px 0;border-top:1px solid var(--ink)}\n.base .bh{display:flex;align-items:baseline;gap:8px;padding:8px 0 6px;border-bottom:1px solid var(--grid)}\n.base .bh b{font-size:13.5px;letter-spacing:.06em}\n.base .bh span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2)}\n.br{display:grid;grid-template-columns:52px 84px 1fr 58px;gap:6px;padding:6px 0;border-bottom:1px solid var(--grid2);\n  font-size:12px;align-items:center;min-height:36px}\n.br .nm{font-size:12.5px}\n.br .tm{font-family:var(--mono);color:var(--dim)}\n.br .rk{color:var(--dim);font-size:12px}\n.br .rk.hot{color:var(--ink)}\n.br .st{text-align:right;color:var(--dim2)}\n.br .st.live{color:var(--ink)}\n.base .foot{display:flex;gap:8px;padding:8px 0 10px;border-top:1px solid var(--grid);font-size:12px;color:var(--dim)}\n.base .foot span:last-child{margin-left:auto}\n.tail{height:18px}\n\n/* 弹层 */\n.scrim{position:absolute;inset:0;background:#03101fcc;opacity:0;transition:opacity .16s linear}\n.scrim.on{opacity:1}\n.sheet-drawer{position:absolute;left:0;right:0;bottom:0;max-height:84%;background:var(--paper);border-top:2px solid var(--ink);\n  display:flex;flex-direction:column;transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}\n.sheet-drawer.on{transform:none}\n.sheet-drawer .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-bottom:1px solid var(--grid)}\n.sheet-drawer .hd b{font-size:13.5px;letter-spacing:.06em}\n.sheet-drawer .hd .x{margin-left:auto;border:1px solid var(--grid);min-height:40px;padding:9px 10px;font-size:12px;color:var(--dim)}\n.sheet-drawer .bd{padding:10px 12px 16px;overflow-y:auto}\n.kv{display:flex;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--grid2)}\n.kv b{font-family:var(--mono);min-width:64px}\n.kv span{flex:1;color:var(--dim)}\n.pick{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}\n.pick label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12px;border-bottom:1px solid var(--grid2)}\n.pick input{appearance:none;width:18px;height:18px;border:1px solid var(--dim);position:relative;flex:none}\n.pick input:checked{border-color:var(--ink);background:var(--ink)}\n.pick input:checked::after{content:\"✓\";color:var(--paper);font-size:12px;position:absolute;left:2px;top:-2px}\n.ta{width:100%;min-height:76px;margin-top:10px;background:var(--deep);border:1px solid var(--grid);color:var(--ink);\n  padding:9px;font:12px/1.6 var(--sans);resize:none}\n.ta::placeholder{color:var(--dim2)}\n.ft{display:flex;gap:8px;margin-top:12px}\n.ft .btn{flex:1;text-align:center}\n.recips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}\n.recips span{display:flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--grid);padding:3px 6px;color:var(--dim)}\n.recips b{font-family:var(--mono);font-size:12px;color:var(--ink)}\n\n/* 图纸上的动效：圈注 / 落点 / 出场 */\n.drawn circle{stroke-dasharray:150;stroke-dashoffset:150;animation:stroke .45s ease-out both;animation-delay:var(--d,0ms)}\n@keyframes stroke{to{stroke-dashoffset:0}}\n.fade{animation:fade .3s ease-out both;animation-delay:var(--d,0ms)}\n@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\nhtml.full .desk{padding:0;background:var(--paper);background-image:none;align-items:flex-start}\nhtml.full .phone{height:auto;max-height:none;border:0}\nhtml.full .scroll{overflow:visible}\n@media (max-width:300px){\n  .sbar{flex-wrap:wrap}\n  .chip{fle   const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;

   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
