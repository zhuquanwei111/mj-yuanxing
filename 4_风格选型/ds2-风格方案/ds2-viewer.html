.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

ace,\"Cascadia Mono\",Consolas,\"DejaVu Sans Mono\",monospace;\n  --stagger:40ms;\n}\n[hidden]{display:none!important}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%}\nbody{background:var(--desk);font-family:var(--sans);color:var(--ink);font-size:13px;line-height:1.6}\n:root{--desk:#262626}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;\n  background:var(--desk);background-image:linear-gradient(#2e2e2e 1px,transparent 1px);background-size:100% 96px}\n.phone{position:relative;width:390px;height:844px;background:var(--paper);overflow:hidden;\n  border:1px solid #4a4a4a;border-radius:3px;box-shadow:0 0 0 9px #1c1c1c,0 26px 54px -18px #000;display:flex;flex-direction:column}\n.phone[hidden]{display:none}\n\n/* ---------- 壳 ---------- */\n.top{display:flex;align-items:center;gap:9px;padding:0 12px;height:46px;border-bottom:3px double var(--rule);flex:none}\n.top .mark{width:22px;height:22px;background:var(--ink);color:#fff;display:grid;place-items:center;\n  font-family:var(--serif);font-size:14px;font-weight:700}\n.top .name{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.06em}\n.top .sp{margin-left:auto;display:flex;align-items:center;gap:7px}\n.top .bell{position:relative;width:26px;height:26px;border:1px solid var(--rule);display:grid;place-items:center;font-size:12px}\n.top .bell b{position:absolute;top:-5px;right:-5px;background:var(--ink);color:#fff;font-size:9.5px;\n  font-family:var(--mono);min-width:14px;height:14px;display:grid;place-items:center;padding:0 2px}\n.top .role{font-family:var(--serif);font-size:12px;border:1px solid var(--rule);padding:2px 6px;letter-spacing:.08em}\n.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}\n.tabbar{display:flex;border-top:1px solid var(--rule);flex:none;background:var(--paper)}\n.tabbar button{flex:1;padding:12px 0 13px;font-size:12px;color:var(--ink3);position:relative;min-height:44px}\n.tabbar button+button{border-left:1px solid var(--rule3)}\n.tabbar button[aria-current=\"page\"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--rule),inset 0 0 0 0 transparent}\n\n/* ---------- 页头（会计头） ---------- */\n.head{padding:13px 14px 10px;border-bottom:1px solid var(--rule2)}\n.head .h1{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.08em;line-height:1.35}\n.head .ln{margin-top:3px;font-size:12px;color:var(--ink2);letter-spacing:.02em}\n.head .ln:last-child{color:var(--ink3)}\n.shift{display:flex;align-items:center;gap:7px;padding:9px 14px;border-bottom:1px solid var(--rule2)}\n.chip{font-size:12px;border:1px solid var(--ink2);padding:9px;min-height:40px;letter-spacing:.02em;\n  font-family:var(--mono)}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}\n.send{margin-left:auto;font-size:12px;border:1px solid var(--rule);padding:9px 10px;min-height:40px;font-weight:700;letter-spacing:.04em}\n\n/* ---------- 合计行（KPI） ---------- */\n.sum{display:flex;border-bottom:3px double var(--rule)}\n.sum .c{flex:1;padding:9px 8px 8px;border-right:1px solid var(--rule3);text-align:left;position:relative}\n.sum .c:last-child{border-right:0}\n.sum .n{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n.sum .n i{font-style:normal;font-size:12.5px;font-weight:400;margin-left:1px}\n.sum .k{display:block;font-size:12px;color:var(--ink2);margin-top:1px}\n.sum .k em{display:block;font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:12px}\n.sum .c[data-drill] .n{border-bottom:1px dotted var(--ink3)}\n.sum .c[data-drill] .n::after{content:\"▾\";font-size:12px;color:var(--ink3);margin-left:3px;vertical-align:2px}\n.sum .c:active{background:var(--p2)}\n\n/* ---------- 页签 ---------- */\n.tabs{position:relative;display:flex;gap:20px;padding:10px 14px 8px;border-bottom:1px solid var(--rule)}\n.tabs button{font-size:13px;color:var(--ink3);letter-spacing:.02em;padding:6px 0 4px;min-height:40px}\n.tabs button.on{color:var(--ink);font-weight:700}\n.tabs button i{font-style:normal;font-family:var(--mono);font-size:12px;margin-left:3px}\n.tabs .ind{position:absolute;bottom:-1px;left:14px;height:2px;background:var(--rule);\n  transition:transform .18s cubic-bezier(.2,.8,.2,1),width .18s cubic-bezier(.2,.8,.2,1)}\n\n/* ---------- 台账条目 ---------- */\n.entries{padding:0 14px}\n.entry{border-bottom:1px solid var(--rule3);padding:11px 0 10px;position:relative}\n.entry.lead{border-bottom:1px solid var(--rule)}\n.entry .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}\n.entry .no{font-family:var(--mono);font-size:12px;color:var(--ink3);width:16px;flex:none}\n.entry .cat{font-family:var(--serif);font-size:13.5px;font-weight:700;letter-spacing:.06em}\n.src{font-size:12px;border:1px solid var(--ink2);padding:1px 5px;letter-spacing:.06em;color:var(--ink2)}\n.src.machine{border-style:solid}\n.src.draft{border-style:dashed;color:var(--ink);border-color:var(--ink)}\n.src.human{border-width:2px;color:var(--ink);border-color:var(--ink)}\n.lv{margin-left:auto;font-size:12px;border:1px solid var(--ink2);padding:1px 5px;color:var(--ink2);letter-spacing:.06em}\n.lv.risk{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}\n.lv.follow{background:var(--p3);border-color:var(--ink3);color:var(--ink)}\n.entry .lines{margin:6px 0 0}\n.entry .l{display:flex;align-items:baseline;gap:6px;font-size:12px;line-height:1.55;padding:1px 0}\n.entry .l .k{flex:none;color:var(--ink2)}\n.entry .l .dots{flex:1;border-bottom:1px dotted var(--rule2);transform:translateY(-3px);min-width:8px}\n.entry .l .v{font-family:var(--mono);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}\n.entry .l .u{font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none}\n.entry .l .m{flex:none}\n.mark{font-size:12px;padding:0 4px;border:1px solid var(--ink3);color:var(--ink2);letter-spacing:.04em}\n.mark.risk{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}\n.mark.follow{background:var(--p3);border-color:var(--ink2);color:var(--ink)}\n.mark.ok{color:var(--ink3)}\n.film{font-family:var(--mono);font-size:12px;color:var(--ink2);border:1px solid var(--rule3);padding:0 4px}\n.entry .split{display:flex;gap:10px;margin-top:7px;padding-top:6px;border-top:1px solid var(--rule3);\n  font-size:12px;color:var(--ink3)}\n.entry .split span{flex:1}\n.entry .split span+span{text-align:right}\n.acts{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}\n.btn{border:1px solid var(--rule);padding:9px 12px;min-height:40px;font-size:12px;font-weight:700;letter-spacing:.03em;\n  transition:transform 80ms ease-out,background 120ms linear,color 120ms linear}\n.btn.solid{background:var(--ink);color:#fff}\n.btn:active{transform:translateY(1px) scale(.985)}\n.btn.weak{border-style:dotted;color:var(--ink2);font-weight:400;min-height:40px;padding:9px 10px}\n.btn[disabled]{opacity:.45;cursor:default}\n.acts .note{margin-left:auto;font-size:12px;color:var(--ink2);font-family:var(--mono)}\n.struck{position:relative}\n.struck::after{content:\"\";position:absolute;left:0;right:0;top:11px;height:1px;background:var(--ink);\n  transform-origin:left;animation:strike .22s cubic-bezier(.3,.7,.2,1) both}\n@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n.entry.settled .cat,.entry.settled .lines{color:var(--ink3)}\n.stampin{display:inline-block;animation:stamp .18s cubic-bezier(.2,.9,.1,1) both}\n@keyframes stamp{from{transform:translateY(-7px) scale(1.5) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}\n\n/* ---------- 今日开播（明细表） ---------- */\n.tbl{margin:14px 14px 4px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}\n.tbl .cap{display:flex;align-items:baseline;gap:8px;padding:8px 0 7px;border-bottom:1px solid var(--rule2)}\n.tbl .cap b{font-family:var(--serif);font-size:13.5px;letter-spacing:.06em}\n.tbl .cap span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.tbl .th{display:grid;grid-template-columns:52px 84px 1fr 54px;gap:6px;padding:6px 0;\n  font-size:12px;color:var(--ink3);letter-spacing:.06em;border-bottom:1px solid var(--rule3)}\n.tbl .tr{display:grid;grid-template-columns:52px 84px 1fr 54px;gap:6px;padding:7px 0;border-bottom:1px solid var(--rule3);\n  font-size:12px;min-height:36px;align-items:center}\n.tbl .tr:last-child{border-bottom:0}\n.tbl .tr .nm{font-family:var(--serif);font-size:12.5px;font-weight:700}\n.tbl .tr .tm{font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.tbl .tr .rk{font-size:12px;color:var(--ink2)}\n.tbl .tr .rk.none{color:var(--ink3)}\n.tbl .tr .st{font-size:12px;text-align:center;border:1px solid var(--ink3);padding:2px 0;color:var(--ink2)}\n.tbl .tr .st.live{border-color:var(--ink);color:var(--ink);font-weight:700}\n.tbl .tr .st.done{background:var(--p2)}\n.tbl .foot{padding:7px 0 9px;font-size:12px;color:var(--ink3);border-top:1px solid var(--rule3);display:flex;gap:10px}\n.tbl .foot span+span{margin-left:auto;text-align:right}\n.tail{height:22px}\n\n/* ---------- 弹层 ---------- */\n.scrim{position:absolute;inset:0;background:#11111155;opacity:0;transition:opacity .18s linear}\n.scrim[hidden]{display:none}\n.scrim.on{opacity:1}\n.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:3px double var(--rule);\n  transform:translateY(101%);transition:transform .24s cubic-bezier(.2,.8,.2,1);max-height:82%;display:flex;flex-direction:column}\n.sheet.on{transform:none}\n.sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 14px 9px;border-bottom:1px solid var(--rule2)}\n.sheet .hd b{font-family:var(--serif);font-size:14.5px;letter-spacing:.06em}\n.sheet .hd .x{margin-left:auto;font-size:12px;border:1px solid var(--rule2);padding:5px 9px;color:var(--ink2);min-height:40px;display:flex;align-items:center}\n.sheet .bd{padding:10px 14px 14px;overflow-y:auto}\n.kv{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--rule3)}\n.kv b{font-family:var(--mono);font-size:12px;min-width:44px}\n.kv span{flex:1;color:var(--ink2)}\n.kv em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink3)}\n.pick{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin:6px 0 0}\n.pick label{display:flex;align-items:center;gap:7px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--rule3);min-height:38px}\n.pick input{appearance:none;width:16px;height:16px;border:1px solid var(--ink2);flex:none;display:grid;place-items:center}\n.pick input:checked{border-color:var(--ink);background:var(--ink)}\n.pick input:checked::after{content:\"✓\";color:#fff;font-size:12px;line-height:1}\n.ta{width:100%;min-height:74px;margin-top:12px;border:1px solid var(--rule2);padding:9px;font:12px/1.6 var(--sans);\n  resize:none;color:var(--ink);background:var(--paper);\n  background-image:repeating-linear-gradient(var(--paper) 0 23px,var(--rule3) 23px 24px)}\n.ta::placeholder{color:var(--ink3)}\n.sheet .ft{display:flex;gap:8px;padding:0 14px 16px}\n.sheet .ft .btn{flex:1;text-align:center}\n.recips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}\n.recips span{font-size:12px;border:1px solid var(--rule3);padding:3px 6px;color:var(--ink2);display:flex;gap:5px;align-items:center}\n.recips span b{font-family:var(--mono);font-size:12px;border:1px solid var(--ink);color:var(--ink);padding:0 3px}\n.recips span b.ok{background:var(--ink);color:#fff}\n\n/* ---------- 出场 ---------- */\n.rise{animation:rise .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}\n@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\nhtml.full .desk{padding:0;background:#fff;background-image:none;align-items:flex-start}\nhtml.full .phone{height:auto;max-height:none;border:0;box-shadow:none}\nhtml.full .scroll{overflow:visible}\nhtml.full .tabbar{position:static}\n@media (max-width:300px){\n  .shift{flex-wrap:wrap}\n  .chip{flex:1 1 46%}\n  .sum{flex-wrap:wrap}\n  .sum .c{flex:1 1 100%;border-right:0;border-top:1px solid var(--rule3)}\n  .sum .n{font-size:21px}\n  .entry .l{flex-wrap:wrap;align-items:flex-start}\n  .entry .l .dots{display:none}\n  .entry .l .k{flex:1 1 100%;min-width:0;overflow-wrap:anywhere}\n  .entry .l .v,.entry .l .u,.entry .l .m{flex:1 1 auto}\n  .tbl .th,.tbl .tr{grid-template-columns:1fr 1fr}\n  .acts{flex-wrap:wrap}\n  .acts .note{margin-left:0}\n  .tabbar{flex-wrap:wrap}\n  .tabbar button{flex:1 1 33.33%}\n  .head .h1{font-size:17px}\n}\n@media (max-width:430px){\n  .desk{padding:0;background:var(--paper);background-image:none;min-height:0}\n  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"desk\">\n\n\u003c!-- ==================== P20 运营工作台 ==================== -->\n\u003cdiv class=\"phone\" id=\"app\">\n  \u003cheader class=\"top\">\n    \u003cspan class=\"mark\">明\u003c/span>\u003cspan class=\"name\">明镜\u003c/span>\n    \u003cspan class=\"sp\">\n      \u003cspan class=\"bell\" title=\"消息\">◔\u003cb>2\u003c/b>\u003c/span>\n      \u003cspan class=\"role\">运营\u003c/span>\n    \u003c/span>\n  \u003c/header>\n\n  \u003cdiv class=\"scroll\" id=\"scroller\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"h1\">运营工作台 · 今天\u003c/div>\n      \u003cdiv class=\"ln\">运营 · 小林（我）　经手：\u003cspan id=\"shiftWho\">早班\u003c/span>\u003c/div>\n      \u003cdiv class=\"ln\">待办第一 · 早班先消化昨晚夜场\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"shift\">\n      \u003cbutton class=\"chip\" data-shift=\"am\" aria-pressed=\"true\">早班 7:30-16:30\u003c/button>\n      \u003cbutton class=\"chip\" data-shift=\"pm\" aria-pressed=\"false\">晚班 16:30-01:30\u003c/button>\n      \u003cbutton class=\"send\" id=\"openCompose\">群发通知\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"sum\">\n      \u003cbutton class=\"c\" data-drill=\"13\">\u003cspan class=\"n\" data-count=\"13\">13\u003c/span>\u003cspan class=\"k\">在管主播\u003cem>可下钻\u003c/em>\u003c/span>\u003c/button>\n      \u003cbutton class=\"c\">\u003cspan class=\"n\" data-count=\"10\">10\u003c/span>\u003cspan class=\"k\">今日应播\u003cem>&nbsp;\u003c/em>\u003c/span>\u003c/button>\n      \u003cbutton class=\"c\" data-drill=\"6\">\u003cspan class=\"n\" data-count=\"6\">6\u003c/span>\u003cspan class=\"k\">已开播\u003cem>3 个在播\u003c/em>\u003c/span>\u003c/button>\n      \u003cbutton class=\"c\" data-drill=\"18.8\">\u003cspan class=\"n\" data-count=\"18.8\">18.8\u003ci>万\u003c/i>\u003c/span>\u003cspan class=\"k\">今日音浪\u003cem>3 场在播\u003c/em>\u003c/span>\u003c/button>\n    \u003c/div>\n\n    \u003cnav class=\"tabs\" id=\"tabs\">\n      \u003cbutton class=\"on\" data-tab=\"todo\">待办\u003ci>7\u003c/i>\u003c/button>\n      \u003cbutton data-tab=\"done\">已处理\u003ci>1\u003c/i>\u003c/button>\n      \u003cspan class=\"ind\" id=\"ind\">\u003c/span>\n    \u003c/nav>\n\n    \u003c!-- 送达卡（发送后插入） -->\n    \u003cdiv class=\"entries\" id=\"delivered\">\u003c/div>\n\n    \u003csection class=\"entries\" id=\"panel-todo\">\n      \u003carticle class=\"entry lead rise\" style=\"--d:0ms\" id=\"e1\">\n        \u003cdiv class=\"meta\">\u003cspan class=\"no\">01\u003c/span>\u003cspan class=\"cat\">盯场复盘\u003c/span>\u003cspan class=\"src machine\">自动摘要\u003c/span>\u003cspan class=\"lv\">昨晚\u003c/span>\u003c/div>\n        \u003cdiv class=\"lines\">\n          \u003cdiv class=\"l\">\u003cspan class=\"k\">11 场开播 · 合计\u003c/span>\u003ci class=\"dots\">\u003c/i>\u003cspan class=\"v\">34.2 万\u003c/span>\u003cspan class=\"u\">+2.4%\u003c/span>\u003cspan class=\"m mark ok\">正常\u003c/span>\u003c/div>\n          \u003cdiv class=\"l\">\u003cspan class=\"k\">老K · 14 天最低\u003c/span>\u003ci class=\"dots\">\u003c/i>\u00 \n    ['e1','e2','e7'].forEach(function(id){ forms.appendChild(document.getElementById(id)); });\n    var s = forms.querySelectorAll('.entry'); for (var i=0;i\u003cs.length;i++) s[i].style.borderBottom = '1px solid var(--rule)';\n    document.querySelectorAll('.entries').forEach(function(x){ x.style.paddingLeft='14px'; });\n    return;\n  }\n\n  // ---- 页签 + 班次（一套状态，互不覆盖）\n  var tabs = document.getElementById('tabs'), ind = document.getElementById('ind');\n  var panels = { todo: document.getElementById('panel-todo'), done: document.getElementById('panel-done'), pm: document.getElementById('panel-pm') };\n  var tab = 'todo', shift = 'am';\n  function moveInd(btn){ ind.style.width = btn.offsetWidth + 'px'; ind.style.transform = 'translateX(' + (btn.offsetLeft - 14) + 'px)'; }\n  function apply(){\n    panels.todo.hidden = !(shift === 'am' && tab === 'todo');\n    panels.pm.hidden = !(shift === 'pm' && tab === 'todo');\n    panels.done.hidden = tab !== 'done';\n    tabs.querySelectorAll('button').forEach(function(b){ if (b.dataset.tab === tab) { b.classList.add('on'); moveInd(b); } else b.classList.remove('on'); });\n  }\n  tabs.addEventListener('click', function(e){ var b = e.target.closest('button[data-tab]'); if (!b) return; tab = b.dataset.tab; apply(); });\n  apply();\n  window.addEventListener('resize', apply);\n  document.querySelectorAll('[data-shift]').forEach(function(chip){\n    chip.addEventListener('click', function(){\n      shift = chip.dataset.shift; tab = 'todo';\n      document.querySelectorAll('[data-shift]').forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });\n      document.getElementById('shiftWho').textContent = shift === 'pm' ? '晚班' : '早班';\n      apply();\n      var box = panels[shift === 'pm' ? 'pm' : 'todo'];\n      box.style.transition = 'none'; box.style.opacity = '.35';\n      requestAnimationFrame(function(){ box.style.transition = 'opacity .18s linear'; box.style.opacity = 1; });\n    });\n  });\n\n  // ---- 草稿三动作\n  document.querySelectorAll('[data-draft]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var entry = b.closest('.entry'), kind = b.dataset.draft, slot = entry.querySelector('.note');\n      var lv = entry.querySelector('.lv'), src = entry.querySelector('.src');\n      entry.querySelectorAll('[data-draft]').forEach(function(x){ x.disabled = true; });\n      if (kind === 'yes') {\n        lv.textContent = '已采纳'; lv.className = 'lv';\n        src.textContent = '已入库'; src.className = 'src human';\n        entry.querySelectorAll('.u').forEach(function(u){ if (u.textContent === '未生效') u.textContent = '已生效'; });\n        slot.innerHTML = '\u003cspan class=\"stampin\">已入库 · 生效\u003c/span>';\n      } else if (kind === 'edit') {\n        lv.textContent = '改一改'; slot.innerHTML = '\u003cspan class=\"stampin\">等你的修改\u003c/span>';\n      } else {\n        lv.textContent = '不用'; lv.className = 'lv follow';\n        entry.querySelectorAll('.u').forEach(function(u){ if (u.textContent === '未生效') u.textContent = '作废'; });\n        slot.innerHTML = '\u003cspan class=\"stampin\">不入库\u003c/span>';\n      }\n    });\n  });\n\n  // ---- 标记已消化（划线）\n  document.querySelectorAll('[data-digest]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var entry = b.closest('.entry');\n      if (entry.classList.contains('settled')) return;\n      entry.classList.add('settled');\n      var head = entry.querySelector('.cat');\n      head.classList.add('struck');\n      b.disabled = true; b.textContent = '已消化';\n      entry.querySelector('.note').innerHTML = '\u003cspan class=\"stampin\">已记一笔\u003c/span>';\n    });\n  });\n\n  // ---- 弹层\n  var scrim = document.getElementById('scrim');\n  var sheets = { kpi: document.getElementById('sheetKpi'), compose: document.getElementById('sheetCompose') };\n  function open(which){ scrim.hidden = false; requestAnimationFrame(function(){ scrim.classList.add('on'); }); sheets[which].hidden = false; requestAnimationFrame(function(){ sheets[which].classList.add('on'); }); }\n  function close(){ scrim.classList.remove('on'); Object.keys(sheets).forEach(function(k){ sheets[k].classList.remove('on'); });\n    setTimeout(function(){ scrim.hidden = true; Object.keys(sheets).forEach(function(k){ sheets[k].hidden = true; }); }, 200); }\n  scrim.addEventListener('click', close);\n  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', close); });\n\n  // ---- KPI 下钻\n  var kpi = {\n    '13': { t:'在管主播 13', rows: [\n      ['直播中 3','小雨 · 大乔 · 茉莉'],\n      ['已下播 3','甜甜 · 阿哲 · 九九'],\n      ['未开播 3','栗子 · 晓晓 · 老K'],\n      ['请假 1','豆豆 · 10-15 返岗'],\n      ['新人 1','麦子 · 第 6 天'],\n      ['今日未播 1','喵喵'],\n      ['排休 1','安琪']]},\n    '6': { t:'已开播 6 · 3 个在播', rows: [\n      ['直播中 3','小雨 · 大乔 · 茉莉 · 3 个在播'],\n      ['已播完 3','甜甜 · 阿哲 · 九九'],\n      ['待播 4','10 场里还剩 4 场']]},\n    '18.8': { t:'今日音浪 18.8 万', rows: [\n      ['在播 3 场','小雨 · 大乔 · 茉莉'],\n      ['已播完 3 场','甜甜 · 阿哲 · 九九'],\n      ['待播 4 场','10 场里还剩 4 场']]},\n    '1560': { t:'本月音浪 1560 万', rows: [['本月平台任务','1560/3500 万 · 还差 1940 万'],['口径','官方口径自动算']] },\n    '71': { t:'今日开播率 71%', rows: [['在播 + 已播','61 人'],['主播规模','86 人']] }\n  };\n  document.querySelectorAll('[data-drill]').forEach(function(cell){\n    cell.addEventListener('click', function(){\n      var d = kpi[cell.dataset.drill]; if (!d) return;\n      document.getElementById('kpiTitle').textContent = d.t;\n      document.getElementById('kpiBody').innerHTML = d.rows.map(function(r){ return '\u003cdiv class=\"kv\">\u003cb>' + r[0] + '\u003c/b>\u003cspan>' + r[1] + '\u003c/span>\u003c/div>'; }).join('');\n      open('kpi');\n    });\n  });\n\n  // ---- 群发通知\n  var names = ['小雨','大乔','甜甜','茉莉','阿哲','九九','栗子','晓晓','老K','麦子','豆豆','喵喵','安琪'];\n  var list = document.getElementById('pickList');\n  list.innerHTML = names.map(function(n, i){ return '\u003clabel>\u003cinput type=\"checkbox\" value=\"' + n + '\">' + n + '\u003c/label>'; }).join('');\n  var doSend = document.getElementById('doSend'), ta = document.getElementById('msgText'), cnt = document.getElementById('pickCount');\n  function sync(){ var n = list.querySelectorAll('input:checked').length; cnt.textContent = n; doSend.disabled = !(n && ta.value.trim()); }\n  list.addEventListener('change', sync); ta.addEventListener('input', sync);\n  document.getElementById('openCompose').addEventListener('click', function(){ open('compose'); });\n  doSend.addEventListener('click', function(){\n    var picked = [].slice.call(list.querySelectorAll('input:checked')).map(function(i){ return i.value; });\n    var text = ta.value.trim();\n    document.getElementById('delivered').innerHTML =\n      '\u003carticle class=\"entry lead\">' +\n        '\u003cdiv class=\"meta\">\u003cspan class=\"no\">群\u003c/span>\u003cspan class=\"cat\">群发通知\u003c/span>\u003cspan class=\"src human\">我发出\u003c/span>\u003cspan class=\"lv\">' + picked.length + ' 人 · 已送达\u003c/span>\u003c/div>' +\n        '\u003cdiv class=\"lines\">\u003cdiv class=\"l\">\u003cspan class=\"k\">' + text + '\u003c/span>\u003ci class=\"dots\">\u003c/i>\u003cspan class=\"u\">刚刚\u003c/span>\u003c/div>\u003c/div>' +\n        '\u003cdiv class=\"recips\">' + picked.map(function(n){ return '\u003cspan>' + n + ' \u003cb class=\"ok\">已送达\u003c/b>\u003c/span>'; }).join('') + '\u003c/div>' +\n      '\u003c/article>';\n    close();\n    document.getElementById('scroller').scrollTo({ top: 0, behavior: 'smooth' });\n  });\n\n  // ---- 首次出场：合计行数字落笔\n  document.querySelectorAll('[data-count]').forEach(function(el, i){\n    var target = parseFloat(el.dataset.count), dec = (el.dataset.count.indexOf('.') >= 0) ? 1 : 0;\n    var unit = el.querySelector('i') ? el.querySelector('i').outerHTML : '';\n    var t0 = performance.now(), dur = 240 + i * 40;\n    (function step(now){\n      var p = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));\n      el.innerHTML = v.toFixed(dec) + unit;\n      if (p \u003c 1) requestAnimationFrame(step); else el.innerHTML = (dec ? target.toFixed(dec) : target) + unit;\n    })(t0);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "ds2-d1-台账.html", "baseline": false, "interactive": true}, {"id": "d2", "name": "d2 时刻", "concept": "这一页是一张时刻表：人和事都挂在同一条时间坐标上，现在与时限一眼可见。", "typography": "单一无衬线＋等宽数字（19px），字号跨度小，靠共享刻度与对齐取胜", "palette": ["#FBFDFE", "#EEF2F4", "#17212B", "#5C6E7A", "#C6402A", "#E3A21B", "#2C6E8F"], "traits": ["共享时间坐标的条带（待办时限刻线＋9 场场次条同轴）", "三档状态用朱红实心＋斜纹／琥珀点阵／无标记表达", "印刷时刻表：细刻度、斜纹、平无阴影"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>明镜 · 运营工作台 · 今天（ds2-d2 时刻）\u003c/title>\n\u003cstyle>\n/* ds2-d2 时刻 —— 印刷时刻表：所有人和事挂在同一条时间坐标上\n   色板：纸 #FBFDFE / 底 #EEF2F4 / 墨 #17212B / 次级 #5C6E7A / 线 #C2CED6 / 浅线 #DDE5EA\n        朱红 #C6402A / 琥珀 #E3A21B / 钢蓝 #2C6E8F / 台面 #D7DEE3\n   三档：危险＝朱红实心＋斜纹同位；关注＝琥珀空心＋点阵；正常＝无标记（钢灰字） */\n:root{\n  --paper:#fbfdfe; --bg:#eef2f4; --ink:#17212b; --ink2:#5c6e7a; --ink3:#7c8b95;\n  --rule:#c2ced6; --rule2:#dde5ea; --red:#c6402a; --amber:#e3a21b; --steel:#2c6e8f;\n  --desk:#d7dee3;\n  --sans:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",sans-serif;\n  --mono:ui-monospace,\"Cascadia Mono\",Consolas,\"DejaVu Sans Mono\",monospace;\n  --hatch:repeating-linear-gradient(45deg,var(--amber) 0 2px,#fbfdfe 2px 5px);\n  --dots:radial-gradient(var(--amber) .8px,#fbfdfe .9px);\n}\n[hidden]{display:none!important}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;\n  background:var(--desk);background-image:linear-gradient(#c9d4da 1px,transparent 1px),linear-gradient(90deg,#c9d4da 1px,transparent 1px);\n  background-size:28px 28px,28px 28px}\n.phone{position:relative;width:390px;height:844px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;\n  border:1px solid var(--ink);box-shadow:0 20px 40px -26px #17212b80}\n.phone[hidden]{display:none}\n\n/* 壳 */\n.top{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-bottom:1px solid var(--ink);flex:none;font-size:12px}\n.top .mark{font-weight:700;letter-spacing:.12em}\n.top .pg{color:var(--ink2)}\n.top .now{margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.02em}\n.top .bell{position:relative;border:1px solid var(--rule);padding:1px 5px;font-family:var(--mono);font-size:11px}\n.top .bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:9.5px;font-family:var(--mono);padding:0 2px;line-height:1.35}\n.top .role{border:1px solid var(--ink);padding:1px 6px;letter-spacing:.1em}\n.scroll{flex:1;overflow-y:auto}\n.tabbar{display:flex;border-top:1px solid var(--ink);flex:none}\n.tabbar button{flex:1;min-height:44px;font-size:12px;color:var(--ink2);letter-spacing:.06em;padding:13px 0}\n.tabbar button+button{border-left:1px solid var(--rule2)}\n.tabbar button[aria-current=\"page\"]{background:var(--ink);color:#fff;letter-spacing:.1em}\n\n/* 页头 */\n.head{padding:12px 14px 10px}\n.head .h1{font-size:16px;font-weight:700;letter-spacing:.04em}\n.head .ln{margin-top:2px;font-size:12px;color:var(--ink2);letter-spacing:.02em}\n.bar{display:flex;align-items:center;gap:6px;padding:0 14px 10px}\n.chip{min-height:40px;padding:9px 10px;border:1px solid var(--rule);font-size:12px;font-family:var(--mono);\n  color:var(--ink2);letter-spacing:.02em}\n.chip[aria-pressed=\"true\"]{background:var(--ink);border-color:var(--ink);color:#fff}\n.chip[aria-pressed=\"true\"]::before{content:\"●\";font-size:9px;margin-right:5px;vertical-align:1px}\n.send{margin-left:auto;min-height:40px;padding:9px 11px;border:1px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.06em}\n.send::after{content:\" →\"}\n\n/* 数字条 + 时间尺 */\n.kpibar{display:flex;padding:0 14px;gap:0}\n.kpibar button{flex:1;text-align:left;padding:4px 0 6px;border-top:2px solid var(--ink)}\n.kpibar .n{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em}\n.kpibar .n i{font-style:normal;font-size:12.5px;font-weight:400}\n.kpibar .k{display:block;font-size:12px;color:var(--ink2);margin-top:1px}\n.kpibar .k em{display:block;font-style:normal;color:var(--ink3);font-family:var(--mono);font-size:12px}\n.kpibar button[data-drill]:active{background:var(--bg)}\n.ruler{margin:4px 14px 0;position:relative;height:40px;border-top:1px solid var(--rule)}\n.ruler .band{position:absolute;top:0;height:6px}\n.ruler .band.am{left:0;width:50%;background:var(--rule)}\n.ruler .band.pm{left:50%;right:0;background:var(--ink2)}\n.ruler .zone{position:relative;height:6px;background:var(--bg)}\n.ruler .tk{position:absolute;top:6px;width:1px;height:5px;background:var(--rule)}\n.ruler .tk.major{height:9px;background:var(--ink2)}\n.ruler .lb{position:absolute;top:16px;font-family:var(--mono);font-size:10px;color:var(--ink3);transform:translateX(-50%)}\n.ruler .shows{position:absolute;top:31px;left:0;right:0;height:8px}\n.ruler .shows i{position:absolute;top:0;height:8px;background:var(--steel);opacity:.55}\n.ruler .shows i.risk{background:var(--red);opacity:1}\n.ruler .now{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}\n.ruler .now em{position:absolute;top:-2px;left:3px;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--red);white-space:nowrap}\n.axisnote{padding:2px 14px 10px;font-size:12px;color:var(--ink2);display:flex;gap:8px}\n.axisnote span+span{margin-left:auto;text-align:right}\n\n/* 分区标题 */\n.sec{display:flex;align-items:baseline;gap:8px;padding:8px 14px 6px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);\n  font-size:12px;color:var(--ink2)}\n.sec b{font-size:13.5px;color:var(--ink);letter-spacing:.04em}\n.sec span:last-child{margin-left:auto;font-family:var(--mono);cursor:pointer;border-bottom:1px dashed var(--ink3);min-height:40px;display:inline-flex;align-items:center}\n\n/* 待办行（时刻列 + 内容 + 场次条） */\n.trow{display:grid;grid-template-columns:20px 52px 1fr;gap:7px;padding:9px 14px;border-bottom:1px solid var(--rule2);position:relative}\n.trow .no{font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:2px}\n.trow .tm{font-family:var(--mono);font-size:12px;color:var(--ink);line-height:1.35;padding-top:1px}\n.trow .tm em{display:block;font-style:normal;color:var(--ink3);font-size:12px}\n.trow .mid b{font-size:13px;font-weight:700}\n.trow .mid .cat{color:var(--ink2);font-weight:400}\n.trow .mid p{margin:3px 0 0;font-size:12px;line-height:1.5}\n.trow .flag{display:inline-block;font-size:12px;padding:0 5px;margin-right:5px;border:1px solid var(--ink2);color:var(--ink2);letter-spacing:.04em}\n.trow .flag.risk{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}\n.trow .flag.follow{background:var(--hatch);border-color:var(--amber);color:var(--ink)}\n.trow .flag.draft{background:none;border:1px dashed var(--ink);color:var(--ink);font-weight:700}\n.trow .track{position:relative;height:9px;margin-top:5px;background:var(--bg);border-left:1px solid var(--rule)}\n.trow .track i{position:absolute;top:1px;bottom:1px;background:var(--ink2);opacity:.45}\n.trow .track i.risk{background:var(--red);opacity:1}\n.trow .track u{position:absolute;top:1px;bottom:1px;width:1px;background:var(--ink)}\n.trow .acts{grid-column:2/4;display:flex;gap:6px;align-items:center;margin-top:8px}\n.btn{min-height:40px;padding:9px 12px;border:1px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em;\n  transition:transform 80ms ease-out}\n.btn.solid{background:var(--ink);color:#fff}\n.btn:active{transform:translateY(1px)}\n.btn.ghost{border-color:var(--rule);color:var(--ink2);font-weight:400}\n.btn[disabled]{opacity:.45}\n.note{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.done-line{position:relative}\n.done-line::after{content:\"\";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink);\n  transform-origin:left;animation:ink .22s cubic-bezier(.3,.7,.2,1) both}\n@keyframes ink{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n.trow.settled .mid b,.trow.settled .mid p{color:var(--ink3)}\n.stampin{display:inline-block;animation:press .16s cubic-bezier(.2,.9,.1,1) both}\n@keyframes press{from{transform:scale(1.35);opacity:.2}to{transform:none;opacity:1}}\n\n/* 今日开播（共享坐标） */\n.gantt{padding:0 14px 6px}\n.gantt .scale{position:relative;height:22px;margin-bottom:4px}\n.gantt .scale i{position:absolute;top:0;width:1px;height:5px;background:var(--rule)}\n.gantt .scale i.major{height:8px;background:var(--ink2)}\n.gantt .scale em{position:absolute;top:8px;font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink3);transform:translateX(-50%)}\n.gantt .row{display:grid;grid-template-columns:46px 1fr 52px;gap:7px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule2);min-height:36px}\n.gantt .row .nm{font-size:12.5px;font-weight:700}\n.gantt .row .nm em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;c  bar.style.left = a + '%'; bar.style.width = (b - a) + '%'; }\n      el.querySelectorAll('u,b').forEach(function(n){ n.style.left = (n.tagName === 'B' ? a : b) + '%'; });\n    });\n    document.querySelectorAll('[data-span2]').forEach(function(el){\n      var w = +el.dataset.span2; var bar = el.querySelector('i');\n      bar.style.left = '0'; bar.style.width = w + '%'; bar.style.opacity = .35;\n    });\n    // 刻度尺\n    var sc = document.getElementById('scale'), rl = document.getElementById('ruler');\n    if (sc && !sc.dataset.built){\n      sc.dataset.built = 1;\n      [['18:00',0],['20:00',27],['22:00',53],['24:00',80],['01:30',100]].forEach(function(t){\n        var i = document.createElement('i'); if (t[1] === 0 || t[1] === 100) {} i.style.left = t[1] + '%'; i.className = 'major';\n        var em = document.createElement('em'); em.textContent = t[0]; em.style.left = t[1] + '%';\n        sc.appendChild(i); sc.appendChild(em);\n      });\n      // 尺上的 9 场密度条\n      var strip = document.getElementById('showStrip');\n      [['18:00','21:00',1],['19:00','22:00',0],['19:30','22:30',0],['20:00','23:00',0],['20:00','23:00',0],\n       ['21:00','24:00',0],['21:00','24:00',0],['21:00','23:30',0],['22:00','01:00',1]].forEach(function(s){\n        var i = document.createElement('i'); i.style.left = pct(s[0]) + '%'; i.style.width = (pct(s[1]) - pct(s[0])) + '%';\n        if (s[2]) i.className = 'risk';\n        strip.appendChild(i);\n      });\n    }\n    // 「现在」刻线：早班起点在尺上 0%，晚班切到 50%\n    var now = document.getElementById('nowText');\n    if (now) now.textContent = '现在 ' + (document.querySelector('[data-shift=pm][aria-pressed=true]') ? '16:30' : '7:30');\n  }\n  if (state === 'full') document.documentElement.classList.add('full');\n  // 首次入场：条带逐条印上、行次第出现、数字落值（只在首次进入播放）\n  function entryMotion(){\n    var rows = document.querySelectorAll('#app .trow, #app .gantt .row, #app .gantt .rk, #app .sec');\n    rows.forEach(function(el, i){ el.style.setProperty('--d', (i * 35) + 'ms'); el.classList.add('rise'); });\n    document.querySelectorAll('#app .trow .track i, #app .gantt .row .stk i').forEach(function(el, i){\n      el.style.setProperty('--d', (140 + i * 30) + 'ms'); el.classList.add('inkin');\n    });\n    document.querySelectorAll('#app .kpibar .n').forEach(function(el, i){\n      var unit = el.querySelector('i'), u = unit ? unit.outerHTML : '';\n      var txt = el.textContent, target = parseFloat(txt), dec = txt.indexOf('.') >= 0 ? 1 : 0;\n      var t0 = performance.now(), dur = 260 + i * 40;\n      (function step(now){\n        var p = Math.min(1, (now - t0) / dur), v = target * (1 - Math.pow(1 - p, 3));\n        el.innerHTML = v.toFixed(dec) + u;\n        if (p \u003c 1) requestAnimationFrame(step); else el.innerHTML = (dec ? target.toFixed(dec) : target) + u;\n      })(t0);\n    });\n  }\n  if (state === 'p13') { app.hidden = true; p13.hidden = false; return; }\n  if (state === 'forms') {\n    app.hidden = true; forms.hidden = false; forms.style.background = 'var(--paper)';\n    forms.insertAdjacentHTML('afterbegin', '\u003cdiv class=\"head\">\u003cdiv class=\"h1\">卡形态 · 三张代表卡\u003c/div>\u003cdiv class=\"ln\">自动摘要卡 / 预警卡 / 草稿卡\u003c/div>\u003c/div>');\n    ['e1','e2','e7'].forEach(function(id){ var el = document.getElementById(id); el.style.display = 'grid'; forms.appendChild(el); });\n    place(); return;\n  }\n  place();\n  document.querySelectorAll('.trow').forEach(function(el){ if (el.querySelector('[data-span]')) el.style.gridTemplateRows = 'auto auto'; });\n  entryMotion();\n  requestAnimationFrame(place);\n\n  // 页签 + 班次\n  var tab = 'todo', shift = 'am';\n  function apply(){\n    document.getElementById('done1').hidden = tab !== 'done';\n    document.getElementById('pmBox').hidden = !(shift === 'pm' && tab === 'todo');\n    document.querySelectorAll('.trow[id^=\"e\"]').forEach(function(el){ el.hidden = !(shift === 'am' && tab === 'todo'); });\n    document.getElementById('bandAm').style.opacity = shift === 'am' ? 1 : .35;\n    document.getElementById('bandPm').style.opacity = shift === 'pm' ? 1 : .35;\n  }\n  apply();\n  document.querySelectorAll('.sec span:last-child').forEach(function(s){ s.addEventListener('click', function(){\n    tab = (tab === 'todo' ? 'done' : 'todo'); s.textContent = tab === 'done' ? '回到待办 7' : '已处理 1'; apply();\n  }); });\n  document.querySelectorAll('[data-shift]').forEach(function(chip){\n    chip.addEventListener('click', function(){\n      shift = chip.dataset.shift; tab = 'todo';\n      document.querySelectorAll('[data-shift]').forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });\n      document.querySelector('.sec span:last-child').textContent = '已处理 1';\n      apply(); place();\n    });\n  });\n\n  // 草稿三动作\n  document.querySelectorAll('[data-draft]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var row = b.closest('.trow'), kind = b.dataset.draft, slot = row.querySelector('.note'), flag = row.querySelector('.flag');\n      row.querySelectorAll('[data-draft]').forEach(function(x){ x.disabled = true; });\n      if (kind === 'yes') { flag.textContent = '已采纳'; flag.className = 'flag'; slot.innerHTML = '\u003cspan class=\"stampin\">已入库 · 生效\u003c/span>'; }\n      else if (kind === 'edit') { flag.textContent = '改一改'; slot.innerHTML = '\u003cspan class=\"stampin\">等你的修改\u003c/span>'; }\n      else { flag.textContent = '不用'; flag.className = 'flag follow'; slot.innerHTML = '\u003cspan class=\"stampin\">不入库\u003c/span>'; }\n    });\n  });\n  document.querySelectorAll('[data-digest]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var row = b.closest('.trow'); if (row.classList.contains('settled')) return;\n      row.classList.add('settled'); row.querySelector('.mid b').classList.add('done-line');\n      b.disabled = true; b.textContent = '已消化';\n      row.querySelector('.note').innerHTML = '\u003cspan class=\"stampin\">已记一笔\u003c/span>';\n    });\n  });\n\n  // 弹层\n  var scrim = document.getElementById('scrim'), sheets = { kpi: document.getElementById('sheetKpi'), compose: document.getElementById('sheetCompose') };\n  function open(w){ scrim.hidden = false; requestAnimationFrame(function(){ scrim.classList.add('on'); sheets[w].hidden = false; requestAnimationFrame(function(){ sheets[w].classList.add('on'); }); }); }\n  function close(){ scrim.classList.remove('on'); Object.keys(sheets).forEach(function(k){ sheets[k].classList.remove('on'); });\n    setTimeout(function(){ scrim.hidden = true; Object.keys(sheets).forEach(function(k){ sheets[k].hidden = true; }); }, 180); }\n  scrim.addEventListener('click', close);\n  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', close); });\n\n  var kpi = {\n    '13': { t:'在管主播 13', rows:[['直播中 3','小雨 · 大乔 · 茉莉'],['已下播 3','甜甜 · 阿哲 · 九九'],['未开播 3','栗子 · 晓晓 · 老K'],['请假 1','豆豆 · 10-15 返岗'],['新人 1','麦子 · 第 6 天'],['今日未播 1','喵喵'],['排休 1','安琪']] },\n    '6': { t:'已开播 6 · 3 个在播', rows:[['直播中 3','小雨 · 大乔 · 茉莉'],['已播完 3','甜甜 · 阿哲 · 九九'],['待播 4','10 场里还剩 4 场']] },\n    '18.8': { t:'今日音浪 18.8 万', rows:[['在播 3 场','小雨 · 大乔 · 茉莉'],['已播完 3 场','甜甜 · 阿哲 · 九九'],['待播 4 场','10 场里还剩 4 场']] },\n    '1560': { t:'本月音浪 1560 万', rows:[['本月平台任务','1560/3500 万 · 还差 1940 万'],['口径','官方口径自动算']] },\n    '71': { t:'今日开播率 71%', rows:[['已开播','61 人'],['主播规模','86 人']] }\n  };\n  document.querySelectorAll('[data-drill]').forEach(function(cell){\n    cell.addEventListener('click', function(){\n      var d = kpi[cell.dataset.drill]; if (!d) return;\n      document.getElementById('kpiTitle').textContent = d.t;\n      document.getElementById('kpiBody').innerHTML = d.rows.map(function(r){ return '\u003cdiv class=\"kv\">\u003cb>' + r[0] + '\u003c/b>\u003cspan>' + r[1] + '\u003c/span>\u003c/div>'; }).join('');\n      open('kpi');\n    });\n  });\n\n  var names = ['小雨','大乔','甜甜','茉莉','阿哲','九九','栗子','晓晓','老K','麦子','豆豆','喵喵','安琪'];\n  var list = document.getElementById('pickList');\n  list.innerHTML = names.map(function(n){ return '\u003clabel>\u003cinput type=\"checkbox\" value=\"' + n + '\">' + n + '\u003c/label>'; }).join('');\n  var doSend = document.getElementById('doSend'), ta = document.getElementById('msgText'), cnt = document.getElementById('pickCount');\n  function sync(){ var n = list.querySelectorAll('input:checked').length; cnt.textContent = n; doSend.disabled = !(n && ta.value.trim()); }\n  list.addEventListener('change', sync); ta.addEventListener('input', sync);\n  document.getElementById('openCompose').addEventListener('click', function(){ open('compose'); });\n  doSend.addEventListener('click', function(){\n    var picked = [].slice.call(list.querySelectorAll('input:checked')).map(function(i){ return i.value; }), text = ta.value.trim();\n    document.getElementById('delivered').innerHTML =\n      '\u003cdiv class=\"trow\" style=\"grid-template-columns:1fr\">' +\n        '\u003cspan class=\"no\" style=\"grid-column:1\">群\u003c/span>\u003cdiv class=\"mid\">\u003cspan class=\"flag\">我发出\u003c/span>\u003cb>群发通知\u003c/b> \u003cspan class=\"cat\">' + picked.length + ' 人 · 已送达\u003c/span>' +\n        '\u003cp>' + text + '\u003c/p>\u003c/div>' +\n        '\u003cdiv class=\"recips\" style=\"grid-column:2/4\">' + picked.map(function(n){ return '\u003cspan>' + n + ' \u003cb class=\"ok\">已送达\u003c/b>\u003c/span>'; }).join('') + '\u003c/div>' +\n      '\u003c/div>';\n    close(); document.getElementById('scroller').scrollTo({ top: 0, behavior: 'smooth' });\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "ds2-d2-时刻.html", "baseline": false, "interactive": true}, {"id": "d3", "name": "d3 灯盘", "concept": "像机房里的值班面板：机器该干的都在暗处跑完了，亮着的灯都要你去动手。", "typography": "无衬线＋等宽数字（19px），小标签加宽字距，数字等宽对齐", "palette": ["#0B0E0D", "#121816", "#1E2724", "#2E3A35", "#DCE5E0", "#8A968F", "#FF4D3D", "#FFB020", "#34D6A0"], "traits": ["深底：按“谁来动手”分三条泳道（等你拍板／机器有结论／我经手）", "三档状态用灯的面积＋卡顶横贯色带的有无表达", "阳极铝面板：蚀刻线、凹槽、2px 圆角、无外阴影"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>明镜 · 运营工作台 · 今天（ds2-d3 灯盘）\u003c/title>\n\u003cstyle>\n/* ds2-d3 灯盘 —— 机柜面板：机器在暗处跑完，亮着的灯都要你去动手\n   色板：底板 #0B0E0D / 面板 #121816 / 槽 #181F1C / 凹槽线 #1E2724 / 蚀刻线 #2E3A35\n        亮字 #DCE5E0 / 次级 #8A968F / 弱 #7C8A84 / 危险灯 #FF4D3D / 关注灯 #FFB020 / 在线灯 #34D6A0 / 台面 #050706\n   三档：危险＝大灯＋卡顶横贯色带；关注＝小灯；正常＝熄灯（暗圈）—— 面积与色带有无是第二手段 */\n:root{\n  --panel:#0b0e0d; --surf:#121816; --slot:#181f1c; --groove:#1e2724; --etch:#2e3a35;\n  --tx:#dce5e0; --dim:#8a968f; --dim2:#7c8a84; --red:#ff4d3d; --amber:#ffb020; --green:#34d6a0; --desk:#050706;\n  --sans:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",sans-serif;\n  --mono:ui-monospace,\"Cascadia Mono\",Consolas,\"DejaVu Sans Mono\",monospace;\n}\n[hidden]{display:none!important}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--desk);color:var(--tx);font-family:var(--sans);font-size:13px;line-height:1.6}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 20px;background:var(--desk);\n  background-image:linear-gradient(#0d1513 1px,transparent 1px),linear-gradient(90deg,#0d1513 1px,transparent 1px);background-size:24px 24px}\n.phone{position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);\n  border:1px solid #2e3a35;border-radius:3px;box-shadow:0 0 0 8px #080b0a,0 24px 50px -18px #000}\n.phone[hidden]{display:none}\n\n/* 壳 */\n.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;flex:none;background:var(--surf);\n  border-bottom:1px solid var(--etch);box-shadow:inset 0 1px 0 #ffffff0f}\n.top .mark{width:22px;height:22px;display:grid;place-items:center;background:var(--tx);color:#0b0e0d;font-weight:700;font-size:12px}\n.top .nm{font-size:13px;letter-spacing:.04em}\n.top .sp{margin-left:auto;display:flex;align-items:center;gap:8px}\n.top .bell{position:relative;border:1px solid var(--etch);padding:1px 6px;font-family:var(--mono);font-size:12px;color:var(--dim)}\n.top .bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#0b0e0d;font-size:9.5px;font-weight:700;padding:0 3px}\n.top .role{border:1px solid var(--etch);padding:1px 7px;font-size:12px;color:var(--dim);letter-spacing:.1em}\n.scroll{flex:1;overflow-y:auto}\n.dock{display:flex;flex:none;background:var(--surf);border-top:1px solid var(--etch)}\n.dock button{flex:1;min-height:46px;font-size:12px;color:var(--dim);letter-spacing:.06em;padding:13px 0;position:relative}\n.dock button+button{border-left:1px solid var(--groove)}\n.dock button[aria-current=\"page\"]{color:var(--tx);background:var(--slot);box-shadow:inset 0 2px 0 var(--tx)}\n.dock button[aria-current=\"page\"]::before{content:\"\";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #34d6a033}\n\n/* 页头 + 班次 */\n.ph{padding:12px 12px 10px;border-bottom:1px solid var(--groove)}\n.ph .h1{font-size:15px;font-weight:700;letter-spacing:.04em}\n.ph .ln{margin-top:2px;font-size:12px;color:var(--dim)}\n.sbar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--groove)}\n.chip{min-height:40px;padding:9px 10px;border:1px solid var(--etch);background:var(--surf);font-size:12px;color:var(--dim);font-family:var(--mono)}\n.chip[aria-pressed=\"true\"]{color:var(--tx);border-color:var(--tx);box-shadow:inset 0 0 0 1px #dce5e033}\n.chip[aria-pressed=\"true\"]::before{content:\"●\";color:var(--green);font-size:9px;margin-right:5px}\n.send{margin-left:auto;min-height:40px;padding:9px 11px;border:1px solid var(--etch);background:var(--surf);font-size:12px;color:var(--tx)}\n\n/* 读数窗 */\n.read{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;background:var(--panel)}\n.read button{text-align:left;padding:7px 8px;background:#0e1412;border:1px solid var(--groove);box-shadow:inset 0 1px 0 #ffffff10,inset 0 -1px 0 #0008}\n.read .n{display:block;font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.02em}\n.read .n i{font-style:normal;font-size:12.5px;font-weight:400}\n.read .k{display:block;font-size:12px;color:var(--dim);margin-top:1px}\n.read .k em{display:block;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--dim2)}\n.read button[data-drill] .n::after{content:\"⌄\";color:var(--dim2);font-size:10px;margin-left:4px;vertical-align:2px}\n.read button:active{background:#131b18}\n\n/* 泳道 */\n.lane{margin:10px 0 0}\n.lane .lhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--slot);\n  border-top:1px solid var(--etch);border-bottom:1px solid var(--groove)}\n.lane .lhead b{font-size:13px;letter-spacing:.06em}\n.lane .lhead span{font-size:12px;color:var(--dim)}\n.lane .lhead .ct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}\n.lamp{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--groove);background:#0a0f0d}\n.lamp.on{background:var(--red);border-color:var(--red);box-shadow:0 0 0 3px #ff4d3d26}\n.lamp.mid{width:8px;height:8px;background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 3px #ffb0201f}\n.lamp.green{background:var(--green);border-color:var(--green);box-shadow:0 0 0 3px #34d6a026}\n.lamp.off{width:7px;height:7px;background:#0d1211;border-color:#26312d}\n\n/* 卡 */\n.cards{padding:0 12px}\n.card{margin:8px 0;background:var(--surf);border:1px solid var(--groove);border-radius:2px;position:relative}\n.card.risk{border-color:#4a2b26;box-shadow:inset 0 3px 0 var(--red)}\n.card.draft{border-style:dashed;border-color:#3b4a44}\n.card .cap{display:flex;align-items:center;gap:7px;padding:8px 9px;border-bottom:1px solid var(--groove)}\n.card .src{font-size:12px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--etch);padding:1px 6px}\n.card .src.draft{color:var(--tx);border-color:var(--tx);border-style:dashed}\n.card .lv{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}\n.card .lv.risk{color:var(--red)}\n.card .lv.follow{color:var(--amber)}\n.card .lv.ok{color:var(--dim2)}\n.card .bd{padding:9px}\n.card h4{margin:0 0 6px;font-size:13.5px;letter-spacing:.02em}\n.card.risk h4{color:#fff}\n.row{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--tx);padding:2px 0;line-height:1.55}\n.row .k{color:var(--dim);min-width:44px;flex:none}\n.row .v{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}\n.row .u{font-family:var(--mono);font-size:12px;color:var(--dim)}\n.row .sp{margin-left:auto;display:flex;align-items:center;gap:6px}\n.card .split{display:flex;gap:10px;padding:7px 9px;border-top:1px solid var(--groove);font-size:12px;color:var(--dim2)}\n.card .split span{flex:1}\n.card .split span:last-child{text-align:right}\n.acts{display:flex;gap:6px;align-items:center;padding:0 9px 9px}\n.btn{min-height:40px;padding:10px 12px;border:1px solid var(--etch);background:var(--slot);font-size:12px;color:var(--tx);\n  transition:transform 80ms ease-out,box-shadow 120ms linear}\n.btn.pri{border-color:var(--tx);box-shadow:inset 0 0 0 1px #dce5e030}\n.btn:active{transform:translateY(1px);background:#0d1211;box-shadow:inset 0 1px 3px #00000099}\n.btn.weak{border-style:dotted;color:var(--dim)}\n.btn[disabled]{opacity:.5}\n.note{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim2)}\n\n/* 通道表 */\n.chans{margin:10px 12px 0;border:1px solid var(--groove);background:var(--surf)}\n.chans .ch{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--groove);background:var(--slot)}\n.chans .ch b{font-size:13px;letter-spacing:.04em}\n.chans .ch span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}\n.cr{display:grid;grid-template-columns:12px 44px 1fr 56px;gap:7px;align-items:center;padding:6px 9px;\n  border-bottom:1px solid var(--groove);min-height:38px}\n.cr:last-of-type{border-bottom:0}\n.cr .nm{font-size:12.5px}\n.cr .tm{font-family:var(--mono);font-size:12px;color:var(--dim)}\n.cr .st{font-size:12px;text-align:right;color:var(--dim)}\n.cr .st.live{color:var(--green)}\n.seg{display:flex;gap:2px}\n.seg i{flex:1;height:7px;background:#0d1211;border:1px solid #1c2523}\n.seg i.on{background:var(--tx);border-color:var(--tx)}\n.seg i.dim{background:#3c4a45;border-color:#3c4a45}\n.seg i.live{background:var(--green);border-color:var(--green);box-shadow:0 0 0 1px #34d6a040}\n.seg i.bad{background:var(--red);border-color:var(--red)}\n.seg i.warn{background:var(--amber);border-color:var(--amber)}\n.chans .foot{display:flex;gap:8px;padding:7px 9px;border-top:1px solid var(--groove);font-size:12px;color:var(--dim)}\n.chans .foot span:last-child{margin-left:auto}\n.tail{height:16px}\n\n/* 弹层 */\n.scrim{position:absolute;inset:0;background:#000000a6;opacity:0;transition:opacity .16s linear}\n.scrim[hidden]{display:none}\n.scrim.on{opacity:1}\n.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;display:flex;flex-direction:column;background:var(--surf);\n  border-top:1px solid var(--tx);transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}\n.sheet.on{transform:none}\n.sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-bottom:1px solid var(--groove)}\n.sheet .hd b{font-size:13.5px;letter-spacing:.06em}\n.sheet .hd .x{margin-left:auto;border:1px solid var(--etch);padding:9px 10px;font-size:12px;color:var(--dim);min-height:40px}\n.sheet .bd{padding:10px 12px 16px;overflow-y:auto}\n.kv{display:flex;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--groove)}\n.kv b{font-family:var(--mono);min-width:64px}\n.kv span{flex:1;color:var(--dim)}\n.pick{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}\n.pick label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12px;border-bottom:1px solid var(--groove)}\n.pick input{appearance:none;width:18px;height:18px;border:1px solid var(--etch);background:#0d1211;position:relative;flex:none}\n.pick input:checked{border-color:var(--green);box-shadow:inset 0 0 0 4px #0d1211,inset 0 0 0 6px var(--green)}\n.ta{width:100%;min-height:76px;margin-top:10px;background:#0d1211;border:1px solid var(--etch);color:var(--tx);\n  padding:9px;font:12px/1.6 var(--sans);resize:none}\n.ta::placeholder{color:var(--dim2)}\n.ft{display:flex;gap:8px;margin-top:12px}\n.ft .btn{flex:1;text-align:center}\n.recips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}\n.recips span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);border:1px solid var(--groove);padding:3px 6px}\n.recips b{font-family:var(--mono);font-size:12px;color:var(--green);border:1px solid var(--green);padding:0 3px}\n\n/* 动效 */\n.rise{animation:rise .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}\n@keyframes rise{from{opacity:0;transform:scale(.985) translateY(4px)}to{opacity:1;transform:none}}\n.litin{animation:litin .34s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d,0ms)}\n@keyframes litin{from{opacity:.1;box-shadow:0 0 0 0 #34d6a000}60%{box-shadow:0 0 0 4px #34d6a030}to{opacity:1}}\n.swap{animation:swap .22s ease-out both}\n@keyframes swap{from{opacity:.3}to{opacity:1}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\nhtml.full .desk{padding:0;background:#0b0e0d;background-image:none;align-items:flex-start}\nhtml.full .phone{height:auto;max-height:none;border:0;box-shadow:none}\nhtml.full .scroll{overflow:visible}\n@media (max-width:300px){\n  .sbar{flex-wrap:wrap}\n  .chip{flex:1 1 46%}\n  .read{grid-template-columns:1fr}\n  .cr{grid-template-columns:12px 1fr 56px}\n  .cr .seg{grid-column:2/4}\n  .card .row{flex-wrap:wrap}\n  .card .row .sp{margin-left:0}\n  .acts{flex-wrap:wrap}\n  .dock{flex-wrap:wrap}\n  .dock button{flex:1 1 33.33%}\n}\n@media (max-width:430px){\n  .desk{padding:0;background:var(--panel);background-image:none;min-height:0}\n  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"desk\">\n\n\u003cdiv class=\"phone\" id=\"app\">\n  \u003cheader class=\"top\">\n    \u003cspan class=\"mark\">明\u003c/span>\u003cspan class=\"nm\">运营工作台 · 今天\u003c/span>\n    \u003cspan class=\"sp\">\u003cspan class=\"bell\">▤\u003cb>2\u003c/b>\u003c/span>\u003cspan class=\"role\">运营\u003c/span>\u003c/span>\n  \u003c/header>\n  \u003cdiv class=\"scroll\" id=\"scroller\">\n    \u003cdiv class=\"ph\">\n      \u003cdiv class=\"h1\">运营工作台 · 今天\u003c/div>\n      \u003cdiv class=\"ln\">运营 · 小林（我）　待办第一 · 早班先消化昨晚夜场\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sbar\">\n      \u003cbutton class=\"chip\" data-shift=\"am\" aria-pressed=\"true\">早班 7:30-16:30\u003c/button>\n      \u003cbutton class=\"chip\" data-shift=\"pm\" aria-pressed=\"false\">晚班 16:30-01:30\u003c/button>\n      \u003cbutton class=\"send\" id=\"openCompose\">群发通知\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"read\">\n      \u003cbutton data-drill=\"13\">\u003cspan class=\"n\">13\u003c/span>\u003cspan class=\"k\">在管主播\u003cem uerySelector('.note'), lv = card.querySelector('.lv');\n      card.querySelectorAll('[data-draft]').forEach(function(x){ x.disabled = true; });\n      var lamp = lv.querySelector('.lamp');\n      if (kind === 'yes') { lamp.className = 'lamp green'; lv.className = 'lv ok'; lv.lastChild.textContent = '已采纳'; slot.innerHTML = '\u003cspan>已入库 · 生效\u003c/span>'; }\n      else if (kind === 'edit') { lv.lastChild.textContent = '改一改'; slot.innerHTML = '\u003cspan>等你的修改\u003c/span>'; }\n      else { lamp.className = 'lamp off'; lv.className = 'lv ok'; lv.lastChild.textContent = '不用'; slot.innerHTML = '\u003cspan>不入库\u003c/span>'; }\n    });\n  });\n  document.querySelectorAll('[data-digest]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var card = b.closest('.card'); if (card.dataset.settled) return; card.dataset.settled = 1;\n      card.querySelector('h4').style.color = 'var(--dim)';\n      b.disabled = true; b.textContent = '已消化';\n      card.querySelector('.note').textContent = '已记一笔';\n    });\n  });\n\n  // 弹层\n  var scrim = document.getElementById('scrim'), sheets = { kpi: document.getElementById('sheetKpi'), compose: document.getElementById('sheetCompose') };\n  function open(w){ scrim.hidden = false; requestAnimationFrame(function(){ scrim.classList.add('on'); sheets[w].hidden = false; requestAnimationFrame(function(){ sheets[w].classList.add('on'); }); }); }\n  function close(){ scrim.classList.remove('on'); Object.keys(sheets).forEach(function(k){ sheets[k].classList.remove('on'); });\n    setTimeout(function(){ scrim.hidden = true; Object.keys(sheets).forEach(function(k){ sheets[k].hidden = true; }); }, 180); }\n  scrim.addEventListener('click', close);\n  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', close); });\n\n  var kpi = {\n    '13': { t:'在管主播 13', rows:[['直播中 3','小雨 · 大乔 · 茉莉'],['已下播 3','甜甜 · 阿哲 · 九九'],['未开播 3','栗子 · 晓晓 · 老K'],['请假 1','豆豆 · 10-15 返岗'],['新人 1','麦子 · 第 6 天'],['今日未播 1','喵 span>\u003c/div>' +\n      '\u003cdiv class=\"cr\" style=\"grid-template-columns:1fr 56px\">\u003cspan class=\"nm\">' + text + '\u003c/span>\u003cspan class=\"st\">刚刚\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"foot\" style=\"display:flex;flex-wrap:wrap;gap:6px;padding:7px 9px;font-size:12px;color:var(--dim)\">' +\n        picked.map(function(n){ return '\u003cspan style=\"border:1px solid var(--groove);padding:2px 6px\">' + n + ' \u003cb style=\"color:var(--green)\">已送达\u003c/b>\u003c/span>'; }).join('') +\n      '\u003c/div>\u003c/div>';\n    close(); document.getElementById('scroller').scrollTo({ top: 0, behavior: 'smooth' });\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "sourceLabel": "ds2-d3-灯盘.html", "baseline": false, "interactive": true}, {"id": "d4", "name": "d4 人阵", "concept": "一屏先看人：谁在播、谁要出事，用人格矩阵回答，文字退到最小的标签里。", "typography": "无衬线超粗（900）数字 22px＋极小标签 12px，字形对比最强", "palette": ["#F6F3EA", "#FDFCF8", "#191813", "#6B6759", "#A32A21", "#C98A16", "#2E5D52"], "traits": ["网格／热力：待办大格阵＋9 格人矩阵＋13 人矩阵", "三档状态用砖红切角／土黄角块／无标记（几何是第二手段）", "珐琅标牌＋瑞士粗网格：2px 格线、唯一硬投影"], "kind": "html", "content": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; script-src 'unsafe-inline' 'unsafe-eval'; form-action 'none'; base-uri 'none'; object-src 'none'\">\u003cscript>(()=>{const mem=()=>{const m=new Map();return{get length(){return m.size},key:i=>[...m.keys()][i]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>明镜 · 运营工作台 · 今天（ds2-d4 人阵）\u003c/title>\n\u003cstyle>\n/* ds2-d4 人阵 —— 珐琅标牌 + 瑞士网格：一屏先看人，再看字\n   色板：骨白 #F6F3EA / 格 #FDFCF8 / 墨 #191813 / 次级 #6B6759 / 格线 #E2DCCB\n        砖红 #A32A21 / 土黄 #C98A16 / 墨青 #2E5D52 / 台面 #EDE8DB\n   三档：危险＝砖红实心块＋格角切角；关注＝土黄角块；正常＝无标记 —— 几何形状是第二手段 */\n:root{\n  --bone:#f6f3ea; --cell:#fdfcf8; --ink:#191813; --ink2:#6b6759; --grid:#e2dccb; --rule:#191813;\n  --red:#a32a21; --amber:#c98a16; --teal:#2e5d52; --desk:#ede8db;\n  --sans:\"Microsoft YaHei\",\"PingFang SC\",\"Hiragino Sans GB\",sans-serif;\n  --mono:ui-monospace,\"Cascadia Mono\",Consolas,\"DejaVu Sans Mono\",monospace;\n}\n[hidden]{display:none!important}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.6}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\n.desk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;background:var(--desk)}\n.phone{position:relative;width:390px;height:844px;background:var(--bone);overflow:hidden;display:flex;flex-direction:column;\n  border:2px solid var(--ink);box-shadow:10px 12px 0 #19181326}\n.phone[hidden]{display:none}\n\n/* 壳 */\n.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;flex:none;border-bottom:2px solid var(--ink)}\n.top .mark{width:24px;height:24px;background:var(--ink);color:var(--cell);display:grid;place-items:center;font-size:12px;font-weight:900}\n.top .nm{font-size:14px;font-weight:900;letter-spacing:.02em}\n.top .sp{margin-left:auto;display:flex;align-items:center;gap:8px}\n.top .bell{position:relative;border:2px solid var(--ink);padding:1px 6px;font-family:var(--mono);font-size:12px}\n.top .bell b{position:absolute;top:-8px;right:-8px;background:var(--red);color:var(--cell);font-size:10px;font-weight:900;padding:1px 4px}\n.top .role{background:var(--ink);color:var(--cell);padding:2px 7px;font-size:12px;letter-spacing:.1em}\n.scroll{flex:1;overflow-y:auto}\n.tabbar{display:flex;flex:none;border-top:2px solid var(--ink);background:var(--cell)}\n.tabbar button{flex:1;min-height:46px;font-size:12px;color:var(--ink2);padding:14px 0;border-right:1px solid var(--grid)}\n.tabbar button:last-child{border-right:0}\n.tabbar button[aria-current=\"page\"]{background:var(--ink);color:var(--cell);font-weight:900}\n\n/* 页头 */\n.head{padding:12px 12px 9px}\n.head .h1{font-size:18px;font-weight:900;letter-spacing:-.01em}\n.head .ln{margin-top:2px;font-size:12px;color:var(--ink2)}\n.bar{display:flex;gap:6px;align-items:center;padding:0 12px 10px}\n.chip{min-height:40px;padding:9px 9px;border:2px solid var(--ink);font-size:12px;color:var(--ink)}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--cell)}\n.send{margin-left:auto;min-height:40px;padding:9px 10px;border:2px solid var(--ink);font-size:12px;font-weight:900}\n\n/* 待办格阵 */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ink);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}\n.cell{background:var(--cell);padding:9px;position:relative;min-height:112px;display:flex;flex-direction:column}\n.cell.wide{grid-column:1/-1;min-height:96px}\n.cell .who{font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.2;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}\n.cell .who em{font-style:normal;font-size:12px;font-weight:400;color:var(--ink2)}\n.cell .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}\n.tag{font-size:12px;border:2px solid var(--ink);padding:0 5px}\n.tag.src{border-width:1px;border-color:var(--ink2);color:var(--ink2)}\n.tag.src.draft{border-style:dashed;border-color:var(--ink);color:var(--ink)}\n.tag.lv-ok{background:var(--grid);border-color:var(--ink2);color:var(--ink2)}\n.tag.lv-risk{background:var(--red);border-color:var(--red);color:var(--cell);font-weight:900}\n.tag.lv-follow{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:900}\n.cell p{margin:6px 0 0;font-size:12px;line-height:1.5}\n.cell p em{font-family:var(--mono);font-style:normal;font-weight:900}\n.cell .acts{margin-top:auto;padding-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}\n.btn{min-height:40px;padding:10px 11px;border:2px solid var(--ink);font-size:12px;font-weight:900;transition:background 90ms linear,color 90ms linear}\n.btn.pri{background:var(--ink);color:var(--cell)}\n.btn:active{background:var(--ink);color:var(--cell)}\n.btn.weak{border-style:dotted;font-weight:400;color:var(--ink2)}\n.btn[disabled]{opacity:.45}\n.note{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.cut{position:absolute;top:0;right:0;width:0;height:0;border-top:18px solid var(--red);border-left:18px solid transparent}\n.cut.follow{width:18px;height:18px;border:0;background:var(--amber)}\n.cell.adopted{background:var(--teal)}\n.cell.adopted .who,.cell.adopted p,.cell.adopted .note{color:var(--cell)}\n.cell.adopted .tag{background:none;border-color:var(--cell);color:var(--cell)}\n.cell.adopted .btn{border-color:var(--cell);color:var(--cell);background:none}\n.cell.struck{position:relative}\n.cell.struck::after{content:\"\";position:absolute;left:9px;right:9px;top:22px;height:3px;background:var(--ink);\n  transform-origin:left;animation:bar .2s cubic-bezier(.3,.7,.2,1) both}\n@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n\n/* KPI 格 */\n.kpi{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}\n.kpi button{padding:9px 8px;border-right:1px solid var(--grid);text-align:left}\n.kpi button:last-child{border-right:0}\n.kpi .n{display:block;font-size:22px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}\n.kpi .n i{font-style:normal;font-size:12.5px;font-weight:400}\n.kpi .k{display:block;font-size:12px;color:var(--ink2)}\n.kpi .k em{display:block;font-style:normal;font-family:var(--mono);font-size:12px}\n.kpi button[data-drill] .n::after{content:\"▾\";font-size:10px;color:var(--ink2);margin-left:3px;vertical-align:3px}\n.kpi button:active{background:var(--grid)}\n\n/* 人矩阵 */\n.sec{display:flex;align-items:baseline;gap:8px;padding:9px 12px 6px;border-bottom:2px solid var(--ink);background:var(--cell)}\n.sec b{font-size:14px;font-weight:900}\n.sec span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.sec span.tap{cursor:pointer;border-bottom:1px dashed var(--ink2);min-height:40px;display:inline-flex;align-items:center}\n.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--ink);border-bottom:2px solid var(--ink)}\n.mat .m{background:var(--cell);padding:8px 8px 13px;position:relative;min-height:104px}\n.mat .m .n{font-size:14px;font-weight:900}\n.mat .m .t{font-family:var(--mono);font-size:12px;color:var(--ink2)}\n.mat .m .rk{font-size:12px;margin-top:4px;padding-top:3px;border-top:1px solid var(--ink);color:var(--red)}\n.mat .m .rk.quiet{color:var(--ink2);border-top-color:var(--grid)}\n.mat .m .band{position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--teal)}\n.mat .m .band.off{background:var(--grid)}\n.mat .m .band.dash{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 11px);border-top:1px solid var(--ink);height:6px}\n.mat .m .band.dot{background-image:radial-gradient(var(--ink) 1px,transparent 1.2px);background-size:5px 5px;height:7px}\n.mat .m .band.hatch{background:repeating-linear-gradient(45deg,var(--ink2) 0 2px,transparent 2px 5px);height:7px}\n.mat .m .band.double{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,var(--teal) 8px 16px);height:7px}\n.mat.doneonly .m:not(.dou){display:none}\n.mat.doneonly .m.dou{grid-column:1/-1;min-height:120px}\n.mat .m .cut{position:absolute;top:0;right:0;width:0;height:0;border-top:14px solid var(--red);border-left:14px solid transparent}\n.mat .m .cut.follow{width:12px;height:12px;border:0;background:var(--amber)}\n.tail{height:18px}\n\n/* 弹层 */\n.scrim{position:absolute;inset:0;background:#19181380;opacity:0;transition:opacity .16s linear}\n.scrim[hidden]{display:none}\n.scrim.on{opacity:1}\n.sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;background:var(--cell);border-top:2px solid var(--ink);\n  display:flex;flex-direction:column;transform:translateY(101%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}\n.sheet.on{transform:none}\n.sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;border-bottom:2px solid var(--ink)}\n.sheet .hd b{font-size:14px;font-weight:900}\n.sheet .hd .x{margin-left:auto;border:2px solid var(--ink);min-height:40px;padding:9px 10px;font-size:12px}\n.sheet .bd{padding:10px 12px 16px;overflow-y:auto}\n.kv{display:flex;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px solid var(--grid)}\n.kv b{font-family:var(--mono);min-width:64px}\n.kv span{flex:1;color:var(--ink2)}\n.pick{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}\n.pick label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12px;border-bottom:1px solid var(--grid)}\n.pick input{appearance:none;width:18px;height:18px;border:2px solid var(--ink);position:relative;flex:none;background:var(--cell)}\n.pick input:checked{background:var(--ink)}\n.pick input:checked::after{content:\"✓\";color:var(--cell);font-size:12px;position:absolute;left:2px;top:-2px}\n.ta{width:100%;min-height:76px;margin-top:10px;border:2px solid var(--ink);padding:9px;font:12px/1.6 var(--sans);resize:none;background:var(--cell)}\n.ta::placeholder{color:var(--ink2)}\n.ft{display:flex;gap:8px;margin-top:12px}\n.ft .btn{flex:1;text-align:center}\n.recips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}\n.recips span{display:flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--ink2);padding:3px 6px}\n.recips b{font-family:var(--mono);font-size:12px;background:var(--teal);color:var(--cell);padding:0 4px}\n\n/* 动效：硬切填入 */\n.fill{animation:fill .12s linear both;animation-delay:var(--d,0ms)}\n@keyframes fill{from{opacity:0}to{opacity:1}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\nhtml.full .desk{padding:0;background:var(--bone);align-items:flex-start}\nhtml.full .phone{height:auto;max-height:none;border:0;box-shadow:none}\nhtml.full .scroll{overflow:visible}\n@media (max-width:300px){\n  .bar{flex-wrap:wrap}\n  .chip{flex:1 1 46%}\n  .grid2{grid-template-columns:1fr}\n  .cell.wide{grid-column:1}\n  .kpi{grid-template-columns:1fr 1fr}\n  .kpi button:nth-child(2){border-right:0}\n  .mat{grid-template-columns:1fr 1fr}\n  .tabbar{flex-wrap:wrap}\n  .tabbar button{flex:1 1 33.33%}\n}\n@media (max-width:430px){\n  .desk{padding:0;background:var(--bone);min-height:0}\n  .phone{width:100%;height:100vh;height:100dvh;border:0;box-shadow:none}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"desk\">\n\n\u003cdiv class=\"phone\" id=\"app\">\n  \u003cheader class=\"top\">\n    \u003cspan class=\"mark\">明\u003c/span>\u003cspan class=\"nm\">运营工作台 · 今天\u003c/span>\n    \u003cspan class=\"sp\">\u003cspan class=\"bell\">▤\u003cb>2\u003c/b>\u003c/span>\u003cspan class=\"role\">运营\u003c/span>\u003c/span>\n  \u003c/header>\n  \u003cdiv class=\"scroll\" id=\"scroller\">\n    \u003cdiv class=\"head\">\n      \u003cdiv class=\"h1\">运营工作台 · 今天\u003c/div>\n      \u003cdiv class=\"ln\">运营 · 小林（我）　待办第一 · 早班先消化昨晚夜场\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"bar\">\n      \u003cbutton class=\"chip\" data-shift=\"am\" aria-pressed=\"true\">早班 7:30-16:30\u003c/button>\n      \u003cbutton class=\"chip\" data-shift=\"pm\" aria-pressed=\"false\">晚班 16:30-01:30\u003c/button>\n      \u003cbutton class=\"send\" id=\"openCompose\">群发通知\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"grid2\" id=\"todos\">\n      \u003cdiv class=\"cell wide fill\" style=\"--d:0ms\" id=\"e1\">\n        \u003cdiv class=\"who\">昨晚 11 场 \u003cem>自动摘要 · AI 汇总的 3 条\u003c/em>\u003c/div>\n        \u003cdiv class=\"ta
