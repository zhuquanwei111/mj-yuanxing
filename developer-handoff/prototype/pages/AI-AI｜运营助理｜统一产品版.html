ace-y-2 max-w-[80%]"><div class="bg-[#FFFFFF] p-3 rounded-2xl rounded-tl-sm border border-[#DDE3E8] shadow-sm text-[14px] text-[#26313A] leading-relaxed">选个问题开始，或直接输入。</div><div class="flex flex-col space-y-1.5 pt-0.5"><button class="h-[44px] px-3.5 bg-[#FFFFFF] hover:bg-[#FCF4EC] text-[#26313A] hover:text-[#F88440] border border-[#DDE3E8] hover:border-[#F88440]/50 rounded-xl text-[13px] font-medium flex items-center justify-between transition-all active:scale-[0.98] shadow-sm" onclick="handleChipClick('给小雨生成下周规划')"><span>给小雨生成下周规划</span><span class="material-symbols-outlined text-sm text-[#65717B]">chevron_right</span></button><button class="h-[44px] px-3.5 bg-[#FFFFFF] hover:bg-[#FCF4EC] text-[#26313A] hover:text-[#F88440] border border-[#DDE3E8] hover:border-[#F88440]/50 rounded-xl text-[13px] font-medium flex items-center justify-between transition-all active:scale-[0.98] shadow-sm" onclick="handleChipClick('谁今天没开播')"><span>谁今天没开播</span><span class="material-symbols-outlined text-sm text-[#65717B]">chevron_right</span></button><button class="h-[44px] px-3.5 bg-[#FFFFFF] hover:bg-[#FCF4EC] text-[#26313A] hover:text-[#F88440] border border-[#DDE3E8] hover:border-[#F88440]/50 rounded-xl text-[13px] font-medium flex items-center justify-between transition-all active:scale-[0.98] shadow-sm" onclick="handleChipClick('阿哲的复盘')"><span>阿哲的复盘</span><span class="material-symbols-outlined text-sm text-[#65717B]">chevron_right</span></button></div></div></div><div class="space-y-4" id="activeThread"></div></div><div class="bg-[#FFFFFF] border-t border-[#DDE3E8] p-3 z-20"><div class="flex items-center space-x-2"><div class="flex-1 relative"><input class="w-full h-[44px] bg-[#F5F7F8] border border-[#DDE3E8] focus:border-[#F88440] focus:ring-1 focus:ring-[#F88440] rounded-xl px-3.5 text-[14px] text-[#26313A] placeholder-[#65717B] outline-none transition-all" id="chatInput" onkeydown="if(event.key==='Enter')handleSend()" placeholder="输入问题..." type="text"/><button class="hidden ab iv class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#26313A]/90 text-[#FFFFFF] text-[12px] px-3.5 py-2 rounded-lg shadow-lg flex items-center space-x-1.5 transition-all" id="toast"><span class="material-symbols-outlined text-sm text-[#F88440]">info</span><span id="toastMsg">请输入问题后再发送</span></div><div class="hidden fixed inset-0 z-50 flex flex-col justify-end" id="replaceSheet"><div class="absolute inset-0 bg-black/45 backdrop-blur-[1px] transition-opacity" onclick="closeReplaceSheet()"></div><div class="relative bg-[#FFFFFF] rounded-t-2xl border-t border-[#DDE3E8] p-4 shadow-2xl flex flex-col space-y-3"><div class="flex items-center justify-between pb-2 border-b border-[#DDE3E8]"><div class="flex items-center space-x-1.5"><span class="material-symbols-outlined text-[#F88440] text-lg">edit_note</span><span class="text-[15px] font-semibold text-[#26313A]">替换本条问题</span></div><button class="w-8 h-8 rounded-full flex items-center justify-center text-[#65717B] hover:bg-[#EDF1F3]" onclick="closeReplaceSheet()"><span class="material-symbols-outlined text-lg">close</span></button></div><div class="space-y-1.5"><div class="relative flex items-center"><input class="w-full h-[44px] bg-[#F5F7F8] border border-[#DDE3E8] focus:border-[#F88440] focus:ring-1 focus:ring-[#F88440] rounded-xl pl-3.5 pr-9 text-[14px] text-[#26313A] outline-none" id="replaceInput" type="text"/><button class="absolute right-2.5 text-[#65717B] hover:text-[#26313A] p-1" onclick="document.getElementById('replaceInput').value=''; document.getElementById('replaceInput').focus();"><span class="material-symbols-outlined text-[16px]">cancel</span></button></div><p class="text-[11px] text-[#65717B]">修改后会替换本条问题及其回复，不保留旧版本。</p></div><div class="pt-2 flex items-center space-x-2.5"><button class="flex-1 h-[44px] bg-[#EDF1F3] hover:bg-[#DDE3E8] text-[#26313A] rounded-xl text-[13px] font-medium transition-all active:scale-[0.98]" onclick="closeReplaceSheet()">取消</button><button class="flex-1 h-[44px] bg-[#F88440] hover:bg-[#D96A31] text-[#FFFFFF] rounded-xl text-[13px] font-medium transition-all active:scale-[0.98] shadow-sm" onclick="confirmReplace()">生成新回复</button></div></div></div></div><script>var currentQuestionText = ''; var isCardVisited = false; var isCardDismissed = false; const inputEl = document.getElementById('chatInput'); const clearBtn = document.getElementById('clearInputBtn'); inputEl.addEventListener('input', function() { if (this.value) { clearBtn.classList.remove('hidden'); } else { clearBtn.classList.add('hidden'); } }); function clearInput() { inputEl.value = ''; clearBtn.classList.add('hidden'); inputEl.focus(); } function showToast(msg) { const toast = document.getElementById('toast'); const toastMsg = document.getElementById('toastMsg'); toastMsg.innerText = msg; toast.classList.remove('hidden'); setTimeout(() => { toast.classList.add('hidden'); }, 2000); } function scrollToBottom() { const container = document.getElementById('chatContainer'); setTimeout(() => { container.scrollTop = container.scrollHeight; }, 60); } function resetChatSession() { currentQuestionText = ''; isCardVisited = false; isCardDismissed = false; document.getElementById('activeThread').innerHTML = ''; showToast('对话已重置'); } function handleChipClick(text) { inputEl.value = text; clearBtn.classList.remove('hidden'); handleSend(); } function handleSend() { const query = inputEl.value.trim(); if (!query) { showToast('请输入问题后再发送'); return; } currentQuestionText = query; isCardVisited = false; isCardDismissed = false; renderConversation(query); inputEl.value = ''; clearBtn.classList.add('hidden'); } function renderConversation(question) { const activeThread = document.getElementById('activeThread'); if (question === '给小雨生成下周规划') { activeThread.innerHTML = `<div class="flex items-start justify-end space-x-2.5"><div class="bg-[#F88440] text-[#FFFFFF] p-3 rounded-2xl rounded-tr-sm shadow-sm text-[14px] max-w-[80%] leading-relaxed">${question}</div><div class="w-8 h-8 rounded-full bg-[#65717B] text-[#FFFFFF] flex items-center justify-center flex-shrink-0 text-[12px] font-bold shadow-sm"><span class="material-symbols-outlined text-[18px]">person_outline</span></div></div><div class="flex items-start space-x-2.5"><div class="w-8 h-8 rounded-full bg-[#FCF4EC] border border-[#F88440]/30 flex items-center justify-center flex-shrink-0 text-[#F88440]"><span class="material-symbols-outlined text-[18px]">smart_toy</span></div><div class="flex flex-col space-y-2.5 max-w-[85%]"><div class="bg-[#FFFFFF] p-3 rounded-2xl rounded-tl-sm border border-[#DDE3E8] shadow-sm text-[14px] text-[#26313A] leading-relaxed">可以参考小雨近7天表现拟定下周目标。先查看主播规划，再在规划页确认和保存。</div><div id="suggestionCardSlot"></div></div></div>`; renderSuggestionCard(); } else { activeThread.innerHTML = `<div class="flex items-start justify-end space-x-2.5"><div class="bg-[#F88440] text-[#FFFFFF] p-3 rounded-2xl rounded-tr-sm shadow-sm text-[14px] max-w-[80%] leading-relaxed">${question}</div><div class="w-8 h-8 rounded-full bg-[#65717B] text-[#FFFFFF] flex items-center justify-center flex-shrink-0 text-[12px] font-bold shadow-sm"><span class="material-symbols-outlined text-[18px]">person_outline</span></div></div><div class="flex items-start space-x-2.5"><div class="w-8 h-8 rounded-full bg-[#FCF4EC] border border-[#F88440]/30 flex items-center justify-center flex-shrink-0 text-[#F88440]"><span class="material-symbols-outlined text-[18px]">smart_toy</span></div><div class="flex flex-col space-y-2 max-w-[85%]"><div class="bg-[#FFFFFF] p-3 rounded-2xl rounded-tl-sm border border-[#DDE3E8] shadow-sm text-[14px] text-[#26313A] leading-relaxed">暂未匹配到这条问题。可以换种问法。</div></div></div>`; } scrollToBottom(); } function renderSuggestionCard() { const slot = document.getElementById('suggestionCardSlot'); if (!slot) return; if (isCardDismissed) { slot.innerHTML = `<div class="bg-[#EDF1F3]/80 border border-[#DDE3E8] rounded-xl p-2.5 text-xs text-[#65717B] flex items-center justify-between"><span>已收起建议（本地演示）</span><button onclick="isCardDismissed=false;renderSuggestionCard()" class="text-[#F88440] hover:underline font-medium text-[11px]">重新展示</button></div>`; scrollToBottom(); return; } if (!isCardVisited) { slot.innerHTML = `<div class="bg-[#FFFFFF] p-3.5 rounded-xl rounded-tl-sm border border-[#DDE3E8] shadow-sm flex flex-col space-y-3"><div class="flex justify-between items-center pb-2 border-b border-[#DDE3E8]"><div class="flex items-center space-x-1.5"><span class="material-symbols-outlined text-[#F88440] text-[18px]">event_note</span><span class="text-[13px] font-bold text-[#26313A]">小雨 · 规划</span></div><span class="text-[10px] bg-[#FCF4EC] text-[#F88440] border border-[#F88440]/30 px-2 py-0.5 rounded-full font-medium">待确认</span></div><div class="space-y-1.5 text-[12px] text-[#65717B]"><div class="flex justify-between items-center"><span>预计开播时长:</span><span class="font-medium text-[#26313A]">28 小时/周</span></div><div class="flex justify-between items-center pt-1.5 border-t border-[#EDF1F3]"><span>核心目标流水:</span><span class="font-medium text-[#F88440]">¥45,000</span></div><div class="flex justify-between items-center pt-1.5 border-t border-[#EDF1F3]"><span>重点方向:</span><span class="font-medium text-[#26313A]">连麦互动 + 晚场连播</span></div></div><div class="pt-2 border-t border-[#DDE3E8] flex flex-col space-y-2"><a href="#P23" data-page="P23" data-subject="小雨" onclick="handleOpenPlan(event)" class="h-[48px] bg-[#F88440] hover:bg-[#D96A31] active:scale-[0.98] text-[#FFFFFF] text-[13px] font-semibold rounded-xl shadow-sm flex items-center justify-center space-x-1 transition-all"><span>去小雨的规划页</span><span class="material-symbols-outlined text-sm">arrow_forward</span></a><div class="flex space-x-2"><button onclick="openReplaceSheet()" class="flex-1 h-[38px] bg-[#FFFFFF] hover:bg-[#EDF1F3] text-[#26313A] border border-[#DDE3E8] text-[12px] font-medium rounded-lg transition-all active:scale-95">改问</button><button onclick="dismissCard()" class="flex-1 h-[38px] bg-[#FFFFFF] hover:bg-[#EDF1F3] text-[#65717B] border border-[#DDE3E8] text-[12px] font-medium rounded-lg transition-all active:scale-95">忽略建议</button></div></div></div>`; } else { slot.innerHTML = `<div class="bg-[#FFFFFF] p-3.5 rounded-xl rounded-tl-sm border border-[#DDE3E8] shadow-sm flex flex-col space-y-3"><div class="flex justify-between items-center pb-2 border-b border-[#DDE3E8]"><div class="flex items-center space-x-1.5"><span class="material-symbols-outlined text-[#F88440] text-[18px]">event_note</span><span class="text-[13px] font-bold text-[#26313A]">小雨 · 规划</span></div><span class="text-[10px] bg-[#EDF1F3] text-[#65717B] border border-[#DDE3E8] px-2 py-0.5 rounded-full font-medium">已打开关联页面（本次演示）</span></div><div class="p-2 bg-[#FCF4EC]/60 rounded-lg border border-[#F88440]/20 text-[11px] text-[#65717B] leading-snug">标记仅记录本地页面动作，不代表规划已采纳或保存。</div><div class="pt-1 border-t border-[#DDE3E8] flex flex-col space-y-2"><a href="#P23" data-page="P23" data-subject="小雨" class="h-[48px] bg-[#F88440] hover:bg-[#D96A31] active:scale-[0.98] text-[#FFFFFF] text-[13px] font-semibold rounded-xl shadow-sm flex items-center justify-center space-x-1 transition-all"><span>再次查看规划页</span><span class="material-symbols-outlined text-sm">arrow_forward</span></a><div class="flex space-x-2"><button onclick="clearCardMarker()" class="flex-1 h-[38px] bg-[#FFFFFF] hover:bg-[#EDF1F3] text-[#65717B] border border-[#DDE3E8] text-[12px] font-medium rounded-lg transition-all active:scale-95">清除此卡标记</button><button onclick="openReplaceSheet()" class="flex-1 h-[38px] bg-[#FFFFFF] hover:bg-[#EDF1F3] text-[#26313A] border border-[#DDE3E8] text-[12px] font-medium rounded-lg transition-all active:scale-95">改问</button></div></div></div>`; } scrollToBottom(); } function handleOpenPlan(e) { isCardVisited = true; renderSuggestionCard(); showToast('已模拟打开 #P23 小雨规划页'); } function clearCardMarker() { isCardVisited = false; renderSuggestionCard(); showToast('已恢复为初始状态'); } function dismissCard() { isCardDismissed = true; renderSuggestionCard(); showToast('已收起建议（本地演示）'); } function openReplaceSheet() { const sheet = document.getElementById('replaceSheet'); const replaceInput = document.getElementById('replaceInput'); replaceInput.value = currentQuestionText || '给小雨生成下周规划'; sheet.classList.remove('hidden'); replaceInput.focus(); } function closeReplaceSheet() { document.getElementById('replaceSheet').classList.add('hidden'); } function confirmReplace() { const val = document.getElementById('replaceInput').value.trim(); if (!val) { showToast('请输入替换问题'); return; } closeReplaceSheet(); currentQuestionText = val; isCardVisited = false; isCardDismissed = false; renderConversation(val); showToast('已替换为新问题'); }</script></body></html>
