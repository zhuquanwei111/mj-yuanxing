<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>P52｜直播间调试清单｜统一产品版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: '#F5F7F8',
            surface: '#FFFFFF',
            'surface-muted': '#EDF1F3',
            border: '#DDE3E8',
            'text-primary': '#26313A',
            'text-secondary': '#65717B',
            brand: '#F88440',
            'brand-pressed': '#D96A31',
            'brand-soft': '#FCF4EC',
            success: '#047857',
            'success-bg': '#ECFDF5',
            pending: '#B45309',
            'pending-bg': '#FFFBEB',
            danger: '#EF4444',
            'danger-bg': '#FEF2F2'
          },
          fontFamily: {
            sans: ['Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F5F7F8;
      overflow: hidden;
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    /* Hide scrollbar for clean UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Custom Checkbox */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid #DDE3E8;
      border-radius: 6px;
      background-color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      position: relative;
    }
    .custom-checkbox:checked {
      background-color: #F88440;
      border-color: #F88440;
    }
    .custom-checkbox:checked::after {
      content: '';
      width: 5px;
      height: 10px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }
    .custom-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }
  </style>
</head>
<body class="flex justify-center items-center h-full bg-[#F5F7F8] text-text-primary antialiased select-none">

  <!-- 390x884 Mobile Shell -->
  <div class="relative w-[390px] h-[884px] bg-[#F5F7F8] flex flex-col overflow-hidden shadow-none border-0">

    <!-- Header (56px) -->
    <header class="h-[56px] min-h-[56px] bg-surface border-b border-border px-3 flex items-center justify-between z-30">
      <!-- Left slot 44x44px -->
      <a href="#P50" data-page="P50" data-job="j1" data-subject="小雨" class="w-[44px] h-[44px] flex items-center justify-center text-text-primary active:opacity-70 transition-opacity" title="返回服务排期">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
      </a>
      
      <!-- Center Title -->
      <h1 class="text-[17px] font-semibold text-text-primary tracking-tight">直播间调试清单</h1>
      
      <!-- Right slot 44x44px -->
      <a href="#P92" data-page="P92" data-role="service" class="w-[44px] h-[44px] flex items-center justify-center text-text-primary active:opacity-70 transition-opacity" title="通知消息">
        <span class="material-symbols-outlined text-[24px]">notifications</span>
      </a>
    </header>

    <!-- Main Content (Independent scroll, min-height: 0) -->
    <main class="flex-1 min-h-0 overflow-y-auto no-scrollbar p-4 flex flex-col gap-3">

      <!-- Object & Dispatch Context -->
      <section class="bg-surface rounded-xl p-4 border border-border">
        <div class="flex items-center justify-between mb-2.5">
          <div class="flex items-center gap-2">
            <span class="text-[12px] font-medium text-brand bg-brand-soft px-2 py-0.5 rounded">直播间调试</span>
            <span class="text-[12px] text-text-secondary">服务人员：阿灿</span>
          </div>
          <!-- Status Badge -->
          <div id="statusBadge" class="flex items-center gap-1 text-[12px] font-medium text-pending bg-pending-bg px-2.5 py-0.5 rounded-full border border-[#FDE68A]">
            <span class="w-1.5 h-1.5 rounded-full bg-pending"></span>
            <span id="statusBadgeText">待完成</span>
          </div>
        </div>

        <div class="text-[16px] font-bold text-text-primary mb-1.5">
          小雨 · 09:40 · 直播间A
        </div>

        <div class="text-[13px] text-text-secondary flex items-center justify-between">
          <span>发起人：运营小林</span>
          <span>工单属性：现场服务</span>
        </div>
      </section>

      <!-- Checklist Section -->
      <section class="bg-surface rounded-xl p-4 border border-border flex flex-col gap-1">
        <div class="flex items-center justify-between pb-3 border-b border-border">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-text-secondary text-[20px]">checklist</span>
            <span class="text-[15px] font-semibold text-text-primary">调试项目</span>
          </div>
          <div class="flex items-center gap-2">
            <span id="progressCount" class="text-[14px] font-bold text-brand">0 / 6 已核对</span>
            <button id="quickCheckBtn" type="button" class="text-[12px] text-brand hover:text-brand-pressed active:opacity-75 transition-colors font-medium py-1 px-1.5">一键全选</button>
          </div>
        </div>

        <!-- 6 Items -->
        <div class="flex flex-col divide-y divide-border/60">
          <!-- Item 1: 灯光 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">light_mode</span>
              <span class="text-[14px] text-text-primary font-medium">1. 灯光</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-1" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="1" class="custom-checkbox item-checkbox" />
            </div>
          </label>

          <!-- Item 2: 收音 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">mic</span>
              <span class="text-[14px] text-text-primary font-medium">2. 收音</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-2" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="2" class="custom-checkbox item-checkbox" />
            </div>
          </label>

          <!-- Item 3: 网络 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">wifi</span>
              <span class="text-[14px] text-text-primary font-medium">3. 网络</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-3" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="3" class="custom-checkbox item-checkbox" />
            </div>
          </label>

          <!-- Item 4: 机位 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">videocam</span>
              <span class="text-[14px] text-text-primary font-medium">4. 机位</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-4" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="4" class="custom-checkbox item-checkbox" />
            </div>
          </label>

          <!-- Item 5: 背景 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">wallpaper</span>
              <span class="text-[14px] text-text-primary font-medium">5. 背景</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-5" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="5" class="custom-checkbox item-checkbox" />
            </div>
          </label>

          <!-- Item 6: 道具 -->
          <label class="flex items-center justify-between py-3.5 cursor-pointer min-h-[48px] active:bg-[#FAF5F1]/50 transition-colors px-1">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-[22px] text-text-secondary">inventory_2</span>
              <span class="text-[14px] text-text-primary font-medium">6. 道具</span>
            </div>
            <div class="flex items-center gap-3">
              <span id="itemState-6" class="text-[12px] text-text-secondary">未检查</span>
              <input type="checkbox" data-index="6" class="custom-checkbox item-checkbox" />
            </div>
          </label>
        </div>

        <div class="mt-2 text-[12px] text-text-secondary/80 flex items-center gap-1.5 pt-2 border-t border-border/40">
          <span class="material-symbols-outlined text-[16px]">info</span>
          <span>现场逐项自检确认，未全部完成前不可提交回传</span>
        </div>
      </section>

      <!-- Action Area -->
      <section class="mt-1 flex flex-col gap-2.5">
        <!-- Submit Button (48px height) -->
        <button id="submitBtn" type="button" disabled class="w-full h-[48px] rounded-xl font-medium text-[15px] flex items-center justify-center transition-all bg-[#DDE3E8] text-text-secondary cursor-not-allowed">
          <span>完成回传</span>
        </button>

        <!-- Secondary Return Link -->
        <a href="#P50" data-page="P50" data-job="j1" data-subject="小雨" class="w-full h-[44px] rounded-xl border border-border bg-surface text-text-primary text-[14px] font-medium flex items-center justify-center active:bg-surface-muted transition-colors">
          <span class="material-symbols-outlined text-[18px] mr-1.5 text-text-secondary">arrow_back</span>
          <span>返回服务排期</span>
        </a>
      </section>

      <!-- Honest Disclaimer Banner -->
      <div class="mt-auto pt-2 pb-1 text-center text-[11px] text-text-secondary/70 leading-relaxed">
        现场自检仅在本地记录，完成回执不代表妆造工单完成，不表示真实服务端送达
      </div>

    </main>

    <!-- Footer: 4 Tabs for Service Role (68px) -->
    <footer class="h-[68px] min-h-[68px] bg-surface border-t border-border flex items-center justify-around px-2 z-30 pb-safe">
      <!-- 1. 工作台 -->
      <a href="#P50" data-page="P50" data-role="service" class="flex flex-col items-center justify-center w-[64px] h-[52px] text-text-secondary hover:text-brand transition-colors active:opacity-75">
        <div class="w-[24px] h-[24px] flex items-center justify-center">
          <span class="material-symbols-outlined text-[24px]">home</span>
        </div>
        <span class="text-[11px] mt-1 leading-none font-normal">工作台</span>
      </a>

      <!-- 2. 工单 (Selected) -->
      <a href="#P50" data-page="P50" data-view="orders" data-role="service" class="flex flex-col items-center justify-center w-[64px] h-[52px] text-brand transition-colors active:opacity-75">
        <div class="w-[24px] h-[24px] flex items-center justify-center">
          <span class="material-symbols-outlined text-[24px]">assignment_turned_in</span>
        </div>
        <span class="text-[11px] mt-1 leading-none font-medium">工单</span>
      </a>

      <!-- 3. 团队 (Pending spec) -->
      <button type="button" onclick="showTeamToast()" class="flex flex-col items-center justify-center w-[64px] h-[52px] text-text-secondary hover:text-brand transition-colors active:opacity-75">
        <div class="w-[24px] h-[24px] flex items-center justify-center">
          <span class="material-symbols-outlined text-[24px]">groups</span>
        </div>
        <span class="text-[11px] mt-1 leading-none font-normal">团队</span>
      </button>

      <!-- 4. 我的 -->
      <a href="#MY" data-page="MY" data-role="service" class="flex flex-col items-center justify-center w-[64px] h-[52px] text-text-secondary hover:text-brand transition-colors active:opacity-75">
        <div class="w-[24px] h-[24px] flex items-center justify-center">
          <span class="material-symbols-outlined text-[24px]">person_outline</span>
        </div>
        <span class="text-[11px] mt-1 leading-none font-normal">我的</span>
      </a>
    </footer>

    <!-- Local Toast Container -->
    <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
      <div id="toastContent" class="bg-[#26313A] text-white text-[13px] px-3.5 py-2 rounded-lg shadow-lg flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[18px] text-brand">info</span>
        <span id="toastMsg">提示信息</span>
      </div>
    </div>

  </div>

  <script>
    // State handling
    const checkboxes = document.querySelectorAll('.item-checkbox');
    const submitBtn = document.getElementById('submitBtn');
    const progressCount = document.getElementById('progressCount');
    const quickCheckBtn = document.getElementById('quickCheckBtn');
    const statusBadge = document.getElementById('statusBadge');
    const statusBadgeText = document.getElementById('statusBadgeText');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');

    let isSubmitted = false;

    // Load from local storage if exists
    try {
      const saved = localStorage.getItem('mingjing_p52_state');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.items && Array.isArray(parsed.items)) {
          checkboxes.forEach((cb, idx) => {
            cb.checked = !!parsed.items[idx];
          });
        }
        if (parsed.isSubmitted) {
          isSubmitted = true;
        }
      }
    } catch(e) {}

    function updateUI() {
      const total = checkboxes.length;
      let checkedCount = 0;
      checkboxes.forEach((cb, idx) => {
        const itemIdx = idx + 1;
        const stateEl = document.getElementById(`itemState-${itemIdx}`);
        if (cb.checked) {
          checkedCount++;
          if (stateEl) {
            stateEl.textContent = '已核对';
            stateEl.className = 'text-[12px] text-success font-medium';
          }
        } else {
          if (stateEl) {
            stateEl.textContent = '未检查';
            stateEl.className = 'text-[12px] text-text-secondary';
          }
        }
      });

      // Update progress label
      progressCount.textContent = `${checkedCount} / ${total} 已核对`;

      if (isSubmitted) {
        // Completed State
        statusBadge.className = 'flex items-center gap-1 text-[12px] font-medium text-success bg-success-bg px-2.5 py-0.5 rounded-full border border-success/30';
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-success"></span><span>已完成</span>';
        
        submitBtn.disabled = true;
        submitBtn.className = 'w-full h-[48px] rounded-xl font-medium text-[15px] flex items-center justify-center bg-success-bg text-success border border-success/30 cursor-default';
        submitBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] mr-1 text-success">check_circle</span>已完成 · 本地回执已记录';
        
        quickCheckBtn.style.display = 'none';
        checkboxes.forEach(cb => cb.disabled = true);
        return;
      }

      // Pre-submission states: 0/6, 1-5/6, 6/6
      if (checkedCount === 0) {
        statusBadge.className = 'flex items-center gap-1 text-[12px] font-medium text-pending bg-pending-bg px-2.5 py-0.5 rounded-full border border-[#FDE68A]';
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-pending"></span><span>待完成</span>';
        
        submitBtn.disabled = true;
        submitBtn.className = 'w-full h-[48px] rounded-xl font-medium text-[15px] flex items-center justify-center bg-[#DDE3E8] text-text-secondary cursor-not-allowed';
        submitBtn.innerHTML = '完成回传';
        quickCheckBtn.textContent = '一键全选';
      } else if (checkedCount < total) {
        statusBadge.className = 'flex items-center gap-1 text-[12px] font-medium text-brand bg-brand-soft px-2.5 py-0.5 rounded-full border border-brand/30';
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-brand"></span><span>进行中</span>';
        
        submitBtn.disabled = true;
        submitBtn.className = 'w-full h-[48px] rounded-xl font-medium text-[15px] flex items-center justify-center bg-[#DDE3E8] text-text-secondary cursor-not-allowed';
        submitBtn.innerHTML = `完成回传（还差 ${total - checkedCount} 项）`;
        quickCheckBtn.textContent = '补全剩余';
      } else {
        // 6/6 Ready to submit
        statusBadge.className = 'flex items-center gap-1 text-[12px] font-medium text-brand bg-brand-soft px-2.5 py-0.5 rounded-full border border-brand/30';
        statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-brand"></span><span>可提交</span>';
        
        submitBtn.disabled = false;
        submitBtn.className = 'w-full h-[48px] rounded-xl font-medium text-[15px] flex items-center justify-center bg-brand text-white active:bg-brand-pressed shadow-sm transition-all cursor-pointer';
        submitBtn.innerHTML = '完成回传';
        quickCheckBtn.textContent = '重置清空';
      }

      // Save state to localStorage
      try {
        const itemStates = Array.from(checkboxes).map(cb => cb.checked);
        localStorage.setItem('mingjing_p52_state', JSON.stringify({
          items: itemStates,
          isSubmitted: isSubmitted
        }));
      } catch(e) {}
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        updateUI();
      });
    });

    quickCheckBtn.addEventListener('click', () => {
      if (isSubmitted) return;
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      if (allChecked) {
        checkboxes.forEach(cb => cb.checked = false);
      } else {
        checkboxes.forEach(cb => cb.checked = true);
      }
      updateUI();
    });

    submitBtn.addEventListener('click', () => {
      if (isSubmitted) return;
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      if (!allChecked) {
        showToast('请先核对全部 6 项现场检查');
        return;
      }
      isSubmitted = true;
      updateUI();
      showToast('已完成现场自检，回执已保存在本地');
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2200);
    }

    function showTeamToast() {
      showToast('团队协作模块待定义，保留服务端角色架构');
    }

    // Initial render
    updateUI();
  </script>
</body>
</html>
